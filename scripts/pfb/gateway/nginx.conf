worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
  log_format pfb '$request_id $pfb_log_class $pfb_log_id $status $request_time';
  access_log /dev/stdout pfb;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 1s;
  client_max_body_size 270m;
  proxy_read_timeout 28800s;
  proxy_send_timeout 300s;
  proxy_connect_timeout 2s;
  proxy_request_buffering off;
  proxy_buffering off;

  map $http_upgrade $pfb_connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_host $pfb_log_class {
    default invalid;
    "localhost:3000" convenience;
    "~^[a-z0-9](?:[a-z0-9-]{0,22}[a-z0-9])?\.localhost:3000$" app;
    "~^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.[a-z0-9](?:[a-z0-9-]{0,22}[a-z0-9])?\.rpg\.localhost:3000$" runtime;
  }

  map $http_host $pfb_log_id {
    default -;
    "~^(?<pfb_log_app_id>[a-z0-9](?:[a-z0-9-]{0,22}[a-z0-9])?)\.localhost:3000$" $pfb_log_app_id;
    "~^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.(?<pfb_log_runtime_id>[a-z0-9](?:[a-z0-9-]{0,22}[a-z0-9])?)\.rpg\.localhost:3000$" $pfb_log_runtime_id;
  }

  server {
    listen 3000 default_server;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    return 404 "PFB_GATEWAY_HOST_INVALID\n";
  }

  server {
    listen 3000;
    server_name localhost;
    include /etc/nginx/pfb/selected.conf;
    if ($http_host != "localhost:3000") { return 404 "PFB_GATEWAY_HOST_INVALID\n"; }
    if ($request_method !~ ^(GET|HEAD)$) { return 409 "PFB_CONVENIENCE_WRITE_REJECTED\n"; }
    if ($pfb_selected_origin = "") { return 503 "PFB_SELECTED_TARGET_UNAVAILABLE\n"; }
    return 307 $pfb_selected_origin$request_uri;
  }

  server {
    listen 3000;
    server_name "~^(?<pfb_id>[a-z0-9](?:[a-z0-9-]{0,22}[a-z0-9])?)\.localhost$";
    if ($http_host !~ "^[a-z0-9](?:[a-z0-9-]{0,22}[a-z0-9])?\.localhost:3000$") { return 404 "PFB_GATEWAY_HOST_INVALID\n"; }
    set $pfb_upstream retrom-pfb-$pfb_id;
    error_page 502 504 = @pfb_unavailable;

    location @pfb_unavailable { return 503 "PFB_UPSTREAM_UNAVAILABLE\n"; }
    location ~ ^/(api/v1|content|runtime|health)(/|$) { proxy_pass http://$pfb_upstream:8080; include /etc/nginx/pfb/proxy.inc; }
    location / { proxy_pass http://$pfb_upstream:3000; include /etc/nginx/pfb/proxy.inc; }
  }

  server {
    listen 3000;
    server_name "~^(?<launch_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12})\.(?<pfb_id>[a-z0-9](?:[a-z0-9-]{0,22}[a-z0-9])?)\.rpg\.localhost$";
    if ($http_host !~ "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.[a-z0-9](?:[a-z0-9-]{0,22}[a-z0-9])?\.rpg\.localhost:3000$") { return 404 "PFB_GATEWAY_HOST_INVALID\n"; }
    set $pfb_upstream retrom-pfb-$pfb_id;
    error_page 502 504 = @pfb_runtime_unavailable;
    location @pfb_runtime_unavailable { return 503 "PFB_UPSTREAM_UNAVAILABLE\n"; }
    location ^~ /__retrom/ { proxy_pass http://$pfb_upstream:8080; include /etc/nginx/pfb/proxy.inc; }
    location / { return 404 "PFB_GATEWAY_HOST_INVALID\n"; }
  }
}
