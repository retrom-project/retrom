services:
  gateway:
    image: ${PFB_GATEWAY_IMAGE:?}
    container_name: retrom-pfb-gateway-v1
    user: "${PFB_UID:?}:${PFB_GID:?}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=${PFB_UID:?},gid=${PFB_GID:?},mode=0700
      - /var/run:uid=${PFB_UID:?},gid=${PFB_GID:?},mode=0700
    ports:
      - "127.0.0.1:3000:3000"
    command: ["nginx", "-c", "/etc/nginx/pfb/nginx.conf", "-g", "daemon off;"]
    volumes:
      - type: bind
        source: ${PFB_GATEWAY_CONFIG_DIR:?}
        target: /etc/nginx/pfb
        read_only: true
    labels:
      io.retrom.pfb-contract-version: "1"
      io.retrom.pfb-config-sha256: ${PFB_GATEWAY_CONFIG_SHA256:?}
    networks:
      pfb-gateway:
        ipv4_address: ${PFB_GATEWAY_IP:?}

networks:
  pfb-gateway:
    name: retrom-pfb-gateway-v1
    external: true
