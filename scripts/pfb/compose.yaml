services:
  postgres:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    user: "${PFB_UID:?}:${PFB_GID:?}"
    environment:
      POSTGRES_USER: retrom
      POSTGRES_PASSWORD: retrom-pfb
      POSTGRES_DB: retrom
      PGDATA: /var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - type: bind
        source: ${PFB_WORKSPACE_ROOT:?}/postgres
        target: /var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrom -d retrom"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - database
  redis:
    image: redis:6.2-alpine@sha256:fad643c78fadb65fdfe79e19a37b0923ae48e69b4a1e7c6be2e94e080f2554b4
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - database
  app:
    image: retrom-pfb-dev:${PFB_TOOLCHAIN_DIGEST:?}
    user: "${PFB_UID:?}:${PFB_GID:?}"
    init: true
    stop_grace_period: 45s
    working_dir: /workspace/retrom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PFB_ID: ${PFB_ID:?}
      RETROM_REDIS_ADDR: redis:6379
      RETROM_DATABASE_URL: postgres://retrom:retrom-pfb@postgres:5432/retrom?sslmode=disable
      # Large development catalogs can exceed the production startup budget on cold storage.
      RETROM_STARTUP_CHECK_TIMEOUT: ${RETROM_STARTUP_CHECK_TIMEOUT:-5m}
      # Opt in on hosts with exhausted inotify watches; leave other applications alone.
      WATCHPACK_POLLING: ${PFB_WATCH_POLLING:-false}
      HOME: /pfb-workspace/home
      GOCACHE: /pfb-workspace/go-cache/build
      GOMODCACHE: /pfb-workspace/go-cache/mod
      npm_config_cache: /pfb-workspace/npm-cache
    volumes:
      - type: bind
        source: ${PFB_SERVER_DATA_ROOT:?}
        target: /server-data
        read_only: true
      - type: bind
        source: ${PFB_RETROM_ROOT:?}
        target: /workspace/retrom
      - type: bind
        source: ${PFB_RETROM_GIT_COMMON_DIR:?}
        target: ${PFB_RETROM_GIT_COMMON_DIR:?}
        read_only: true
      - type: bind
        source: ${PFB_RUNTIME_ROOT:?}
        target: /workspace/runtime
      - type: bind
        source: ${PFB_RUNTIME_GIT_COMMON_DIR:?}
        target: ${PFB_RUNTIME_GIT_COMMON_DIR:?}
        read_only: true
      - type: bind
        source: ${PFB_NEXT_ENV_FILE:?}
        target: /workspace/retrom/web/next-env.d.ts
      - type: bind
        source: ${PFB_TSCONFIG_FILE:?}
        target: /workspace/retrom/web/tsconfig.json
      - type: bind
        source: ${PFB_WORKSPACE_ROOT:?}
        target: /pfb-workspace
      - type: bind
        source: ${PFB_WORKSPACE_ROOT:?}/web-node
        target: /workspace/retrom/web/node_modules
      - type: bind
        source: ${PFB_WORKSPACE_ROOT:?}/runtime-node
        target: /workspace/runtime/node_modules
      - type: bind
        source: ${PFB_WORKSPACE_ROOT:?}/next
        target: /workspace/retrom/web/.next-pfb-${PFB_ID:?}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    networks:
      database:
      pfb-gateway:
        aliases:
          - retrom-pfb-${PFB_ID:?}

networks:
  database:
    internal: true
  pfb-gateway:
    name: retrom-pfb-gateway-v1
    external: true
