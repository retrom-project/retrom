<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>yabause 多盘 · Retrom 核心验证</title><link rel="stylesheet" href="../example.css"></head>
<body>
  <main class="example-shell"><header class="example-header"><div><h1 class="example-title" id="example-title">yabause 多盘</h1><div class="example-meta" id="example-meta"></div></div><div class="example-status" id="example-status" data-phase="configuring">正在配置</div></header><div id="game"></div></main>
  <script>
    (() => {
      const fixture = new URLSearchParams(location.search).get("fixture");
      const definitions = {
        "multidisc-saturn-2": { count: 2, gameId: 2101 },
        "multidisc-saturn-3": { count: 3, gameId: 2102 }
      };
      const selected = definitions[fixture];
      if (!selected) throw new Error("Unknown multi-disc fixture");
      const externalFiles = {};
      for (let index = 1; index <= selected.count; index += 1) {
        const canonicalName = `disc-${String(index).padStart(3, "0")}.chd`;
        externalFiles[`/${canonicalName}`] = `../../game/yabause/${fixture}/${canonicalName}`;
      }
      window.RETROM_EXAMPLE_CONFIG = {
        core: "yabause",
        runtimeVersion: "4.2.3",
        system: "saturn",
        title: `Sega Saturn / Multi-disc ${selected.count}`,
        gameId: selected.gameId,
        gameUrl: `../multidisc/saturn-${selected.count}/playlist.m3u`,
        biosUrl: "../../game/bios/saturn_bios.bin",
        externalFiles,
        expectedDiscCount: selected.count
      };
    })();
  </script>
  <script src="../example-shell.js"></script>
  <script src="../../runtime/emulatorjs/4.2.3/data/loader.js"></script>
</body>
</html>
