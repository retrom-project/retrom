<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ppsspp · Retrom 核心验证</title><link rel="stylesheet" href="../example.css"></head>
<body>
  <main class="example-shell"><header class="example-header"><div><h1 class="example-title" id="example-title">ppsspp</h1><div class="example-meta" id="example-meta"></div></div><div class="example-status" id="example-status" data-phase="configuring">正在配置</div></header><div id="game"></div></main>
  <script>
    (() => {
      const parameters = new URLSearchParams(window.location.search);
      const format = parameters.get("format") || "cso";
      const gameUrls = {
        cso: "../../game/ppsspp/psp-smoke.cso",
        iso: "../../game/ppsspp/psp-smoke.iso"
      };
      if (parameters.size !== (parameters.has("format") ? 1 : 0) || !Object.hasOwn(gameUrls, format)) {
        throw new Error("Unsupported PPSSPP fixture format");
      }
      window.RETROM_EXAMPLE_CONFIG = { core: "ppsspp", runtimeVersion: "4.2.3", system: "psp", title: "PlayStation Portable / Sheep Defense", gameId: format === "cso" ? 2022 : 2023, gameUrl: gameUrls[format], formatId: format, threads: true, startupInputs: [{ delayMs: 2000, durationMs: 120, player: 0, control: 0 }, { delayMs: 5000, durationMs: 120, player: 0, control: 0 }] };
    })();
  </script>
  <script src="../example-shell.js"></script>
  <script src="../../runtime/emulatorjs/4.2.3/data/loader.js"></script>
</body>
</html>
