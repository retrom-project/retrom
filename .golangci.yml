version: "2"

linters:
  default: none
  enable:
    - asasalint
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - funlen
    - gochecknoinits
    - gocognit
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - interfacebloat
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        no-command-imports:
          files:
            - "**/*.go"
          deny:
            - pkg: retrom/cmd
              desc: internal packages must not depend on process entrypoints
        inner-layers:
          files:
            - "${base-path}/internal/**.go"
            - "!${base-path}/internal/application/**.go"
            - "!${base-path}/internal/composition/**.go"
            - "!${base-path}/internal/httpapi/**.go"
            - "!${base-path}/internal/testsupport/**.go"
            - "!$test"
          deny:
            - pkg: retrom/internal/application
              desc: inner layers must not depend on process lifecycle
            - pkg: retrom/internal/composition
              desc: inner layers must not assemble dependencies
            - pkg: retrom/internal/httpapi
              desc: inner layers must not depend on HTTP
        http-transport:
          files:
            - "${base-path}/internal/httpapi/**.go"
            - "!$test"
          deny:
            - pkg: retrom/internal/application
              desc: HTTP receives feature dependencies from the process root
            - pkg: retrom/internal/composition
              desc: HTTP must not assemble business services
            - pkg: retrom/internal/database
              desc: HTTP must not access raw database connections
            - pkg: retrom/internal/persistence
              desc: HTTP must use business services instead of persistence adapters
            - pkg: retrom/internal/store
              desc: HTTP must not own database resources
        storage-layer:
          files:
            - "${base-path}/internal/store/**.go"
            - "${base-path}/internal/filestore/**.go"
            - "!$test"
          deny:
            - pkg: retrom/internal/service
              desc: storage must not depend on application modules
            - pkg: retrom/internal/libraryimport
              desc: storage must not depend on import workflows
            - pkg: retrom/internal/launch
              desc: storage must not depend on launch workflows
        arcade-parser-layer:
          files:
            - "${base-path}/internal/format/arcadedat/**.go"
            - "!$test"
          deny:
            - pkg: retrom/internal/service
              desc: DAT parsing must remain below business services
            - pkg: retrom/internal/firmware
              desc: DAT parsing must not depend on BIOS workflows
            - pkg: retrom/internal/libraryimport
              desc: DAT parsing must not depend on import workflows
        service-no-jobs:
          files:
            - "${base-path}/internal/service/**.go"
            - "${base-path}/internal/firmware/**.go"
            - "${base-path}/internal/launch/**.go"
            - "${base-path}/internal/libraryimport/**.go"
            - "!${base-path}/internal/service/jobs/**.go"
            - "!$test"
          deny:
            - pkg: retrom/internal/service/jobs
              desc: domains must not depend on job management use cases
    dogsled:
      max-blank-identifiers: 3
    dupl:
      threshold: 120
    errcheck:
      check-type-assertions: true
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
          msg: use structured logging
        - pattern: ^fmt\.Print.*$
          msg: use structured logging
      analyze-types: true
    funlen:
      lines: 150
      statements: 100
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 15
    interfacebloat:
      max: 10
    lll:
      line-length: 120
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    nestif:
      min-complexity: 4
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: redefines-builtin-id
        - name: unconditional-recursion
        - name: unreachable-code
        - name: unused-parameter

  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - dupl
          - err113
          - lll
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: retrom
    goimports:
      local-prefixes:
        - retrom
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod
