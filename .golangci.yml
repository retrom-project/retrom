version: "2"

linters:
  default: none
  enable:
    - asasalint
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - funlen
    - gochecknoinits
    - gocognit
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - interfacebloat
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        no-command-imports:
          files:
            - "**/*.go"
          deny:
            - pkg: retrom/cmd
              desc: internal packages must not depend on process entrypoints
        storage-layer:
          files:
            - "internal/store/**/*.go"
            - "internal/blobstore/**/*.go"
          deny:
            - pkg: retrom/internal/httpapi
              desc: storage must not depend on HTTP
            - pkg: retrom/internal/jobs
              desc: storage must not depend on job orchestration
            - pkg: retrom/internal/libraryimport
              desc: storage must not depend on application modules
            - pkg: retrom/internal/launch
              desc: storage must not depend on application modules
        arcade-parser-layer:
          files:
            - "internal/arcadedat/**/*.go"
          deny:
            - pkg: retrom/internal/httpapi
              desc: DAT parsing must remain protocol independent
            - pkg: retrom/internal/jobs
              desc: DAT parsing must remain orchestration independent
            - pkg: retrom/internal/metadatascrape
              desc: DAT evidence must not depend on metadata providers
            - pkg: retrom/internal/firmware
              desc: DAT parsing must not depend on BIOS workflows
            - pkg: retrom/internal/arcadecatalog
              desc: the parser must remain below the catalog application layer
        application-no-jobs:
          files:
            - "internal/arcadecatalog/**/*.go"
            - "internal/firmware/**/*.go"
            - "internal/gamecontent/**/*.go"
            - "internal/launch/**/*.go"
            - "internal/libraryimport/**/*.go"
            - "internal/metadatascrape/**/*.go"
            - "internal/saves/**/*.go"
            - "internal/uploads/**/*.go"
          deny:
            - pkg: retrom/internal/jobs
              desc: application modules must not depend on job orchestration
    dogsled:
      max-blank-identifiers: 3
    dupl:
      threshold: 120
    errcheck:
      check-type-assertions: true
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
          msg: use structured logging
        - pattern: ^fmt\.Print.*$
          msg: use structured logging
      analyze-types: true
    funlen:
      lines: 150
      statements: 100
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 15
    interfacebloat:
      max: 5
    lll:
      line-length: 120
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    nestif:
      min-complexity: 4
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: redefines-builtin-id
        - name: unconditional-recursion
        - name: unreachable-code
        - name: unused-parameter

  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - dupl
          - err113
          - lll
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: retrom
    goimports:
      local-prefixes:
        - retrom
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod
