version: "2"

linters:
  default: none
  enable:
    - asasalint
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - funlen
    - gochecknoinits
    - gocognit
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - interfacebloat
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        no-command-imports:
          files:
            - "**/*.go"
          deny:
            - pkg: retrom/cmd
              desc: internal packages must not depend on process entrypoints
        inner-layers:
          files:
            - "${base-path}/internal/**.go"
            - "!${base-path}/internal/httpapi/**.go"
            - "!${base-path}/internal/testsupport/**.go"
            - "!$test"
          deny:
            - pkg: retrom/internal/httpapi
              desc: domain and infrastructure packages must not depend on HTTP
        http-transport:
          files:
            - "${base-path}/internal/httpapi/**.go"
            - "!$test"
          deny:
            - pkg: retrom/internal/persistence
              desc: HTTP must use domain services rather than persistence
            - pkg: github.com/jackc/pgx
              desc: HTTP must not execute SQL or own database resources
            - pkg: database/sql
              desc: HTTP must not execute SQL
            - pkg: os/exec
              desc: HTTP must not invoke processes
        infrastructure:
          files:
            - "${base-path}/internal/persistence/**.go"
            - "${base-path}/internal/storage/**.go"
            - "${base-path}/internal/temporary/**.go"
            - "${base-path}/internal/runtimeclient/**.go"
            - "!$test"
          deny:
            - pkg: retrom/internal/service
              desc: infrastructure must not depend on domain services
        pure-inputs:
          files:
            - "${base-path}/internal/model/**.go"
            - "${base-path}/internal/format/**.go"
            - "!$test"
          deny:
            - pkg: retrom/internal/service
              desc: facts and parsers must not depend on workflows
            - pkg: retrom/internal/persistence
              desc: facts and parsers must not execute persistence
            - pkg: retrom/internal/httpapi
              desc: facts and parsers must not depend on transport
            - pkg: github.com/jackc/pgx
              desc: facts and parsers must not execute SQL
            - pkg: os/exec
              desc: facts and parsers must not invoke processes
        services:
          files:
            - "${base-path}/internal/service/**.go"
            - "!$test"
          deny:
            - pkg: github.com/jackc/pgx
              desc: services use the persistence adapter for short transactions
            - pkg: database/sql
              desc: services must not execute SQL directly
            - pkg: os/exec
              desc: runtime process invocation belongs to runtimeclient
        runtime-no-scans:
          files:
            - "${base-path}/internal/service/runs/**.go"
            - "${base-path}/internal/service/saves/**.go"
            - "${base-path}/internal/runtimeclient/**.go"
            - "!$test"
          deny:
            - pkg: retrom/internal/service/scans
              desc: runtime consumes managed facts without import authority
    dogsled:
      max-blank-identifiers: 3
    dupl:
      threshold: 120
    errcheck:
      check-type-assertions: true
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
          msg: use structured logging
        - pattern: ^fmt\.Print.*$
          msg: use structured logging
      analyze-types: true
    funlen:
      lines: 150
      statements: 100
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 15
    interfacebloat:
      max: 10
    lll:
      line-length: 120
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    nestif:
      min-complexity: 4
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: redefines-builtin-id
        - name: unconditional-recursion
        - name: unreachable-code
        - name: unused-parameter

  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - dupl
          - err113
          - lll
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: retrom
    goimports:
      local-prefixes:
        - retrom
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod
