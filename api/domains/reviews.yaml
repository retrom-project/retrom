paths:
  /api/v1/admin/reviews:
    get:
      operationId: getAdminReviews
      description: Pending review summaries including sourceTotalSizeBytes, sourceMd5, a nullable coverUrl, and STANDARD/SOURCE source identity for compact queue previews.
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/Q
        - $ref: ../components/common.yaml#/components/parameters/TagIDQuery
        - $ref: '#/components/parameters/ImportJobIDQuery'
        - $ref: '#/components/parameters/SourceImportIDQuery'
        - $ref: ../components/common.yaml#/components/parameters/PlatformInstanceIDQuery
        - $ref: '#/components/parameters/BlockerCode'
        - $ref: ../components/common.yaml#/components/parameters/Sort
        - $ref: ../components/common.yaml#/components/parameters/Cursor
        - $ref: ../components/common.yaml#/components/parameters/Limit20
      responses:
        '200':
          $ref: '#/components/responses/ReviewQueueListResponse'
  /api/v1/admin/reviews/deduplicate:
    post:
      operationId: postAdminReviewDeduplicate
      description: Discards pending reviews matching published content within the filtered scope, at most 50 scanned items per request. Continue with the returned cursor and upper bound until nextAfterItemId is null. Active attachments are skipped; published games are preserved.
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDeduplicateRequest'
      responses:
        '200':
          description: Committed page counts and continuation bounds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDeduplicateResult'
  /api/v1/admin/review-bulk-approvals:
    post:
      operationId: postAdminReviewBulkApproval
      description: Starts one bounded, global pending-review scan. Each item is rechecked before publication.
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: ../components/common.yaml#/components/requestBodies/Empty
      responses:
        '202':
          description: Created background approval task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewBulkApprovalSummary'
  /api/v1/admin/review-bulk-approvals/active:
    get:
      operationId: getActiveAdminReviewBulkApproval
      responses:
        '200':
          description: The globally active task, if any.
          content:
            application/json:
              schema:
                type: object
                required: [activeBulkApproval]
                properties:
                  activeBulkApproval:
                    allOf:
                      - $ref: '#/components/schemas/ReviewBulkApprovalSummary'
                    nullable: true
  /api/v1/admin/review-bulk-approvals/{bulkApprovalId}:
    parameters:
      - $ref: '#/components/parameters/BulkApprovalID'
    get:
      operationId: getAdminReviewBulkApproval
      responses:
        '200':
          description: Current task state and aggregate progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewBulkApprovalSummary'
  /api/v1/admin/reviews/{importItemId}:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/ImportItemID
    get:
      operationId: getAdminReview
      description: Returns the review workspace and the latest validation for its current staged source.
      responses:
        '200':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
    patch:
      operationId: patchAdminReview
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
      requestBody:
        $ref: '#/components/requestBodies/ReviewDraft'
      responses:
        '200':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /api/v1/admin/reviews/{importItemId}/scrape-candidates:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/ImportItemID
    post:
      operationId: postAdminReviewScrapeCandidates
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: ../components/common.yaml#/components/requestBodies/MetadataProvider
      responses:
        '202':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /api/v1/admin/reviews/{importItemId}/assets:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/ImportItemID
    post:
      operationId: postAdminReviewAsset
      description: Validates a completed local image upload and records an immutable manual review asset. Selection is persisted separately through the review draft PATCH.
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: '#/components/requestBodies/ReviewAsset'
      responses:
        '201':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /api/v1/admin/reviews/{importItemId}/previews:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/ImportItemID
    post:
      operationId: postAdminReviewPreview
      description: Creates a short-lived, capability-scoped browser preview from the immutable review source. Missing Parent or BIOS dependencies are omitted instead of blocking preview creation. Every preview captures one runtime screenshot five seconds after the core reports game start; a current screenshot may be used by an administrator to publish despite dependency blockers.
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: '#/components/requestBodies/ReviewPreview'
      responses:
        '201':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /api/v1/admin/reviews/{importItemId}/arcade-parent-attachments:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/ImportItemID
    post:
      operationId: postAdminReviewArcadeParentAttachment
      description: Queues strict validation of one completed ZIP upload against a missing or mismatched Parent machine in the review draft's locked Arcade DAT closure.
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: '#/components/requestBodies/ReviewArcadeParentAttachment'
      responses:
        '202':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /api/v1/admin/reviews/{importItemId}/multi-disc-attachments:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/ImportItemID
    post:
      operationId: postAdminReviewMultiDiscAttachment
      description: Queues validation of one completed FILES upload containing exactly every currently missing CHD.
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: '#/components/requestBodies/ReviewMultiDiscAttachment'
      responses:
        '202':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /api/v1/admin/reviews/{importItemId}/approve:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/ImportItemID
    post:
      operationId: postAdminReviewApprove
      description: Publishes a current READY validation, or a current blocked validation that has a five-second runtime screenshot captured by its matching review preview. Screenshot overrides remain explicit in immutable review evidence and the published Variant compatibility code.
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: '#/components/requestBodies/Approval'
      responses:
        '201':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
        '409':
          description: REVIEW_VALIDATION_STALE or DUPLICATE_GAME_CONFIRMATION_REQUIRED; duplicate confirmation includes the complete current match set.
          content:
            application/json:
              schema:
                $ref: ../components/common.yaml#/components/schemas/ErrorEnvelope
        '500':
          description: INTERNAL_ERROR when persistence fails or persisted review evidence cannot be decoded. No publication is committed.
          content:
            application/json:
              schema:
                $ref: ../components/common.yaml#/components/schemas/ErrorEnvelope
  /api/v1/admin/reviews/{importItemId}/discard:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/ImportItemID
    post:
      operationId: postAdminReviewDiscard
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: '#/components/requestBodies/ApprovalReason'
      responses:
        '200':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
components:
  schemas:
    ApprovalReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 500
    ApprovalRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 500
        duplicatePolicy:
          type: string
          enum:
            - ALLOW_NEW
        acknowledgedGameIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
    ReviewSourceKind:
      type: string
      enum:
        - STANDARD
        - SOURCE
    ReviewQueueItem:
      type: object
      additionalProperties: false
      required:
        - itemId
        - reviewVersion
        - importJobId
        - sourceDisplayName
        - draftTitle
        - platformInstance
        - validationStatus
        - validationJobId
        - blockerCodes
        - candidateCount
        - sourceTotalSizeBytes
        - sourceMd5
        - coverUrl
        - sourceKind
        - sourceLabel
        - sourceImportId
        - updatedAtMs
      properties:
        itemId:
          type: string
          format: uuid
        reviewVersion:
          type: integer
          format: int64
          minimum: 1
        importJobId:
          type: string
          format: uuid
        sourceDisplayName:
          type: string
        draftTitle:
          type: string
        platformInstance:
          type: object
          additionalProperties: false
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        validationStatus:
          type: string
          enum:
            - READY
            - BLOCKED
            - INCOMPATIBLE
            - NEEDS_VALIDATION
        validationJobId:
          type: string
          format: uuid
          nullable: true
        blockerCodes:
          type: array
          items:
            type: string
        candidateCount:
          type: integer
          format: int64
          minimum: 0
        sourceTotalSizeBytes:
          type: integer
          format: int64
          minimum: 0
        sourceMd5:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{32}$
        coverUrl:
          type: string
          nullable: true
        sourceKind:
          $ref: '#/components/schemas/ReviewSourceKind'
        sourceLabel:
          type: string
          nullable: true
        sourceImportId:
          type: string
          format: uuid
          nullable: true
        updatedAtMs:
          type: integer
          format: int64
          minimum: 0
    ReviewQueueList:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        nextCursor:
          type: string
          nullable: true
    ReviewBulkApprovalScope:
      type: object
      additionalProperties: false
      properties:
        q:
          type: string
          maxLength: 200
        tagId:
          type: string
          format: uuid
        importJobId:
          type: string
          format: uuid
        sourceImportId:
          type: string
          format: uuid
        platformInstanceId:
          type: string
          format: uuid
        blockerCode:
          type: string
          maxLength: 120
    ReviewDeduplicateRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          $ref: '#/components/schemas/ReviewBulkApprovalScope'
        afterItemId:
          type: string
          format: uuid
        throughItemId:
          type: string
          format: uuid
    ReviewDeduplicateResult:
      type: object
      additionalProperties: false
      required: [scannedCount, discardedCount, attachmentActiveCount, nextAfterItemId, throughItemId]
      properties:
        scannedCount:
          type: integer
          minimum: 0
          maximum: 50
        discardedCount:
          type: integer
          minimum: 0
          maximum: 50
        attachmentActiveCount:
          type: integer
          minimum: 0
          maximum: 50
        nextAfterItemId:
          type: string
          format: uuid
          nullable: true
        throughItemId:
          type: string
          format: uuid
          nullable: true
    ReviewBulkApprovalSummary:
      type: object
      additionalProperties: false
      required: [bulkApprovalId, jobId, state, version, maxItemId, cursorItemId,
        initialPendingCount, scannedCount, publishedCount, skippedChangedCount,
        skippedDuplicateCount, skippedNotReadyCount, createdAtMs, updatedAtMs,
        startedAtMs, completedAtMs, lastErrorCode]
      properties:
        bulkApprovalId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        state:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED]
        version:
          type: integer
          minimum: 1
        maxItemId:
          type: string
          format: uuid
        cursorItemId:
          type: string
          format: uuid
          nullable: true
        initialPendingCount:
          type: integer
          minimum: 1
        scannedCount:
          type: integer
          minimum: 0
        publishedCount:
          type: integer
          minimum: 0
        skippedChangedCount:
          type: integer
          minimum: 0
        skippedDuplicateCount:
          type: integer
          minimum: 0
        skippedNotReadyCount:
          type: integer
          minimum: 0
        createdAtMs:
          type: integer
        updatedAtMs:
          type: integer
        startedAtMs:
          type: integer
          nullable: true
        completedAtMs:
          type: integer
          nullable: true
        lastErrorCode:
          type: string
          nullable: true
    ReviewSelectedAssetsRequest:
      type: object
      additionalProperties: false
      required:
        - coverCandidateAssetId
        - coverUploadedAssetId
        - backgroundCandidateAssetId
        - screenshotCandidateAssetIds
      properties:
        coverCandidateAssetId:
          type: string
          format: uuid
          nullable: true
        coverUploadedAssetId:
          type: string
          format: uuid
          nullable: true
        backgroundCandidateAssetId:
          type: string
          format: uuid
          nullable: true
        screenshotCandidateAssetIds:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            format: uuid
    ReviewDraftRequest:
      type: object
      additionalProperties: false
      required:
        - tagIds
      properties:
        targetPlatformInstanceId:
          type: string
          format: uuid
        metadata:
          $ref: ../components/common.yaml#/components/schemas/MetadataFields
        scummvmCandidateId:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Selects one runnable upstream ScummVM candidate from the current immutable source; requires the ordinary review version precondition.
        selectedValidationId:
          type: string
          format: uuid
        selectedCandidateId:
          type: string
          format: uuid
          nullable: true
        selectedAssets:
          $ref: '#/components/schemas/ReviewSelectedAssetsRequest'
        defaultDosEntry:
          type: string
          nullable: true
        rpgSelfContainedOverride:
          type: boolean
          description: Optional explicit administrator confirmation that a 2000/2003/XP/VX/VX Ace project is self-contained. Allows approval despite external RTP declarations without supplying runtime resources. False clears the confirmation; forbidden on non-RPG reviews and true is invalid for MV/MZ.
        tagIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
      minProperties: 1
    ReviewAssetRequest:
      type: object
      additionalProperties: false
      required:
        - uploadFileId
        - kind
      properties:
        uploadFileId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - COVER
    ReviewArcadeParentAttachmentRequest:
      type: object
      additionalProperties: false
      required:
        - validationId
        - baseSourceSnapshotId
        - dependencyMachine
        - uploadFileId
      properties:
        validationId:
          type: string
          format: uuid
        baseSourceSnapshotId:
          type: string
          format: uuid
        dependencyMachine:
          type: string
          minLength: 1
          maxLength: 255
        uploadFileId:
          type: string
          format: uuid
    ReviewMultiDiscAttachmentRequest:
      type: object
      additionalProperties: false
      required:
        - uploadId
      properties:
        uploadId:
          type: string
          format: uuid
    ReviewPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - clientCapabilities
      properties:
        clientCapabilities:
          $ref: ../components/common.yaml#/components/schemas/ClientCapabilities
        restoreFromPreviewId:
          type: string
          format: uuid
          nullable: true
          description: Optionally freeze this actor's unexpired trial checkpoint into a new preview of the same current source and Target.
  requestBodies:
    ApprovalReason:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApprovalReasonRequest'
    Approval:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApprovalRequest'
    ReviewDraft:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewDraftRequest'
    ReviewAsset:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewAssetRequest'
    ReviewArcadeParentAttachment:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewArcadeParentAttachmentRequest'
    ReviewMultiDiscAttachment:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewMultiDiscAttachmentRequest'
    ReviewPreview:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewPreviewRequest'
  responses:
    ReviewQueueListResponse:
      description: Cursor-paged pending review summaries
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewQueueList'
  parameters:
    ImportJobIDQuery:
      name: importJobId
      in: query
      schema:
        type: string
        format: uuid
    SourceImportIDQuery:
      name: sourceImportId
      in: query
      schema:
        type: string
        format: uuid
    BlockerCode:
      name: blockerCode
      in: query
      schema:
        type: string
    Decision:
      name: decision
      in: query
      schema:
        type: string
    FromAtMs:
      name: fromAtMs
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
    ToAtMs:
      name: toAtMs
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
    BulkApprovalID:
      name: bulkApprovalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
