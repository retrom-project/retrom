paths:
  /api/v1/admin/source-imports:
    get:
      operationId: getAdminSourceImports
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/State
        - $ref: ../components/common.yaml#/components/parameters/Cursor
        - $ref: ../components/common.yaml#/components/parameters/Limit20
      responses:
        '200':
          $ref: '#/components/responses/SourceImportListResponse'
    post:
      operationId: postAdminSourceImport
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      requestBody:
        $ref: '#/components/requestBodies/CreateSourceImport'
      responses:
        '202':
          $ref: '#/components/responses/SourceImportResponse'
  /api/v1/admin/source-imports/{sourceImportId}:
    parameters:
      - $ref: '#/components/parameters/SourceImportID'
    get:
      operationId: getAdminSourceImport
      responses:
        '200':
          $ref: '#/components/responses/SourceImportResponse'
    delete:
      operationId: deleteAdminSourceImport
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      responses:
        '204':
          description: Unstarted Source import plan deleted
  /api/v1/admin/source-imports/{sourceImportId}/collections:
    parameters:
      - $ref: '#/components/parameters/SourceImportID'
    get:
      operationId: getAdminSourceImportCollections
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/Cursor
        - $ref: ../components/common.yaml#/components/parameters/Limit100
      responses:
        '200':
          $ref: '#/components/responses/SourceCollectionListResponse'
  /api/v1/admin/source-imports/{sourceImportId}/collection-mappings:
    parameters:
      - $ref: '#/components/parameters/SourceImportID'
    put:
      operationId: putAdminSourceImportCollectionMappings
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      requestBody:
        $ref: '#/components/requestBodies/SourceCollectionMappings'
      responses:
        '200':
          $ref: '#/components/responses/SourceImportResponse'
  /api/v1/admin/source-imports/{sourceImportId}/start:
    parameters:
      - $ref: '#/components/parameters/SourceImportID'
    post:
      operationId: postAdminSourceImportStart
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      requestBody:
        $ref: '#/components/requestBodies/SourceImportStart'
      responses:
        '202':
          $ref: '#/components/responses/SourceImportResponse'
  /api/v1/admin/source-imports/{sourceImportId}/items:
    parameters:
      - $ref: '#/components/parameters/SourceImportID'
    get:
      operationId: getAdminSourceImportItems
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/Q
        - $ref: ../components/common.yaml#/components/parameters/Outcome
        - $ref: '#/components/parameters/SourceWarning'
        - $ref: '#/components/parameters/SourceCollectionIDQuery'
        - $ref: ../components/common.yaml#/components/parameters/Cursor
        - $ref: ../components/common.yaml#/components/parameters/Limit50
      responses:
        '200':
          $ref: '#/components/responses/SourceItemListResponse'
  /api/v1/admin/source-imports/{sourceImportId}/cancel:
    parameters:
      - $ref: '#/components/parameters/SourceImportID'
    post:
      operationId: postAdminSourceImportCancel
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      requestBody:
        $ref: ../components/common.yaml#/components/requestBodies/Reason
      responses:
        '200':
          $ref: '#/components/responses/SourceImportResponse'
        '202':
          $ref: '#/components/responses/SourceImportResponse'
  /api/v1/admin/source-imports/{sourceImportId}/retry:
    parameters:
      - $ref: '#/components/parameters/SourceImportID'
    post:
      operationId: postAdminSourceImportRetry
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      requestBody:
        $ref: ../components/common.yaml#/components/requestBodies/Empty
      responses:
        '202':
          $ref: '#/components/responses/SourceImportResponse'
components:
  schemas:
    CreateSourceImportRequest:
      type: object
      additionalProperties: false
      required:
        - rootId
        - sourceRelativePath
        - format
      properties:
        format:
          type: string
          enum: [PEGASUS, GAMELIST]
        rootId:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,31}$
        sourceRelativePath:
          type: string
          maxLength: 4096
    SourceCollectionMapping:
      type: object
      additionalProperties: false
      required:
        - collectionId
        - action
        - tagIds
      properties:
        collectionId:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - IMPORT
            - SKIP
        platformInstanceId:
          type: string
          format: uuid
        tagIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
    SourceCollectionMappingsRequest:
      type: object
      additionalProperties: false
      required:
        - mappings
      properties:
        mappings:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SourceCollectionMapping'
    SourceImportStartRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
    SourceImportCounts:
      type: object
      additionalProperties: false
      required:
        - metadata
        - invalidMetadata
        - collections
        - games
        - estimatedSourceBytes
        - mappedCollections
        - skippedCollections
        - processable
        - blocked
        - reviewPending
        - published
        - reviewDiscarded
        - existing
        - failed
        - cancelled
        - mediaWarnings
        - covers
        - videos
      properties:
        metadata:
          type: integer
          format: int64
          minimum: 0
        invalidMetadata:
          type: integer
          format: int64
          minimum: 0
        collections:
          type: integer
          format: int64
          minimum: 0
        games:
          type: integer
          format: int64
          minimum: 0
        estimatedSourceBytes:
          type: integer
          format: int64
          minimum: 0
        mappedCollections:
          type: integer
          format: int64
          minimum: 0
        skippedCollections:
          type: integer
          format: int64
          minimum: 0
        processable:
          type: integer
          format: int64
          minimum: 0
        blocked:
          type: integer
          format: int64
          minimum: 0
        reviewPending:
          type: integer
          format: int64
          minimum: 0
        published:
          type: integer
          format: int64
          minimum: 0
        reviewDiscarded:
          type: integer
          format: int64
          minimum: 0
        existing:
          type: integer
          format: int64
          minimum: 0
        failed:
          type: integer
          format: int64
          minimum: 0
        cancelled:
          type: integer
          format: int64
          minimum: 0
        mediaWarnings:
          type: integer
          format: int64
          minimum: 0
        covers:
          type: integer
          format: int64
          minimum: 0
        videos:
          type: integer
          format: int64
          minimum: 0
    SourceImportSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - format
        - root
        - sourceRelativePath
        - state
        - phase
        - scanJobId
        - importJobId
        - counts
        - mappingVersion
        - version
        - createdBy
        - lastErrorCode
        - retryable
        - createdAtMs
        - updatedAtMs
        - expiresAtMs
        - completedAtMs
      properties:
        format:
          type: string
          enum: [PEGASUS, GAMELIST]
        id:
          type: string
          format: uuid
        root:
          type: object
          additionalProperties: false
          required:
            - id
            - label
          properties:
            id:
              type: string
            label:
              type: string
        sourceRelativePath:
          type: string
          maxLength: 4096
        state:
          type: string
          enum:
            - SCANNING
            - AWAITING_MAPPING
            - QUEUED
            - RUNNING
            - PARTIAL_FAILURE
            - COMPLETED
            - CANCEL_REQUESTED
            - CANCELLED
            - FAILED
            - EXPIRED
        phase:
          type: string
          nullable: true
          enum:
            - DISCOVERING_METADATA
            - PARSING_METADATA
            - RESOLVING_SOURCES
            - COPYING_CONTENT
            - VALIDATING
            - PREPARING_REVIEWS
        scanJobId:
          type: string
          format: uuid
        importJobId:
          type: string
          format: uuid
          nullable: true
        counts:
          $ref: '#/components/schemas/SourceImportCounts'
        mappingVersion:
          type: integer
          format: int64
          minimum: 1
        version:
          type: integer
          format: int64
          minimum: 1
        createdBy:
          type: object
          additionalProperties: false
          required:
            - id
            - displayName
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
        lastErrorCode:
          type: string
          nullable: true
        retryable:
          type: boolean
        createdAtMs:
          type: integer
          format: int64
          minimum: 0
        updatedAtMs:
          type: integer
          format: int64
          minimum: 0
        expiresAtMs:
          type: integer
          format: int64
          minimum: 0
        completedAtMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
    SourceImportList:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SourceImportSummary'
        nextCursor:
          type: string
          nullable: true
    SourceSourceCollection:
      type: object
      additionalProperties: false
      required:
        - id
        - metadataRelativePath
        - segmentOrdinal
        - name
        - shortName
        - description
        - gameCount
        - issueCount
        - mappingAction
        - targetPlatformInstanceId
        - targetPlatformInstanceName
        - targetDefaultCoreId
        - targetDefaultCoreName
        - tagSnapshot
        - ignoredRules
        - warningFields
      properties:
        id:
          type: string
          format: uuid
        metadataRelativePath:
          type: string
          maxLength: 4096
        segmentOrdinal:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 200
        shortName:
          type: string
          nullable: true
        description:
          type: string
        gameCount:
          type: integer
          format: int64
          minimum: 0
        issueCount:
          type: integer
          format: int64
          minimum: 0
        mappingAction:
          type: string
          nullable: true
          enum:
            - IMPORT
            - SKIP
        targetPlatformInstanceId:
          type: string
          format: uuid
          nullable: true
        targetPlatformInstanceName:
          type: string
          nullable: true
        targetDefaultCoreId:
          type: string
          nullable: true
        targetDefaultCoreName:
          type: string
          nullable: true
        tagSnapshot:
          type: array
          maxItems: 20
          items:
            $ref: ../components/common.yaml#/components/schemas/TagReference
        ignoredRules:
          type: array
          uniqueItems: true
          items:
            type: string
        warningFields:
          type: array
          uniqueItems: true
          items:
            type: string
    SourceCollectionList:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SourceSourceCollection'
        nextCursor:
          type: string
          nullable: true
    SourceItem:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - collectionId
        - collectionName
        - targetPlatformInstanceId
        - targetPlatformInstanceName
        - metadataRelativePath
        - executionState
        - payloadState
        - payloadReleaseJobId
        - contentKind
        - tags
        - media
        - warnings
        - sourceFlags
        - discoveryCode
        - errorCode
        - failureDetails
        - runtimeCheck
        - retryable
        - reviewItemId
        - publishedGameId
        - existingGameId
        - existingMatches
        - updatedAtMs
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        collectionId:
          type: string
          format: uuid
          nullable: true
        collectionName:
          type: string
          nullable: true
        targetPlatformInstanceId:
          type: string
          format: uuid
          nullable: true
        targetPlatformInstanceName:
          type: string
          nullable: true
        metadataRelativePath:
          type: string
          maxLength: 4096
        executionState:
          type: string
          enum:
            - PENDING
            - COPYING
            - VALIDATING
            - REVIEW_PENDING
            - PUBLISHED
            - REVIEW_DISCARDED
            - SKIPPED_EXISTING
            - SKIPPED_MAPPING
            - BLOCKED_SOURCE
            - BLOCKED_CONTENT
            - SOURCE_CHANGED
            - READ_FAILED
            - COMMIT_FAILED
            - CANCELLED
        payloadState:
          type: string
          enum:
            - RETAINED
            - RELEASING
            - RELEASED
            - FAILED
        payloadReleaseJobId:
          type: string
          format: uuid
          nullable: true
        contentKind:
          type: string
          nullable: true
          enum:
            - SINGLE_FILE
            - DOS_BUNDLE
            - MULTI_DISC
        tags:
          type: array
          maxItems: 20
          items:
            $ref: ../components/common.yaml#/components/schemas/TagReference
        media:
          type: object
          additionalProperties: false
          required:
            - cover
            - video
          properties:
            cover:
              type: string
              enum:
                - READY
                - MISSING
                - WARNING
            video:
              type: string
              enum:
                - READY
                - MISSING
                - WARNING
        sourceFlags:
          type: object
          additionalProperties: false
          required: [hidden, adult, kidGame]
          properties:
            hidden: {type: boolean}
            adult: {type: boolean}
            kidGame: {type: boolean}
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SourceWarningValue'
        discoveryCode:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
        failureDetails:
          nullable: true
          allOf:
            - $ref: ../components/common.yaml#/components/schemas/SourceItemFailureDetails
        runtimeCheck:
          nullable: true
          allOf:
            - $ref: ../components/common.yaml#/components/schemas/SourceRuntimeCheck
        retryable:
          type: boolean
        reviewItemId:
          type: string
          format: uuid
          nullable: true
        publishedGameId:
          type: string
          format: uuid
          nullable: true
        existingGameId:
          type: string
          format: uuid
          nullable: true
        existingMatches:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - gameId
            properties:
              gameId:
                type: string
                format: uuid
        updatedAtMs:
          type: integer
          format: int64
          minimum: 0
    SourceWarningValue:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
        field:
          type: string
    SourceItemList:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SourceItem'
        nextCursor:
          type: string
          nullable: true
  requestBodies:
    CreateSourceImport:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSourceImportRequest'
    SourceCollectionMappings:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceCollectionMappingsRequest'
    SourceImportStart:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceImportStartRequest'
  responses:
    SourceImportResponse:
      description: Source scan/import aggregate
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceImportSummary'
    SourceImportListResponse:
      description: Source scan/import history
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceImportList'
    SourceCollectionListResponse:
      description: Source collection mapping page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceCollectionList'
    SourceItemListResponse:
      description: Source item result page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceItemList'
  parameters:
    SourceWarning:
      name: warning
      in: query
      schema:
        type: string
    SourceCollectionIDQuery:
      name: collectionId
      in: query
      schema:
        type: string
        format: uuid
    SourceImportID:
      name: sourceImportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
