paths:
  /api/v1/admin/diagnostics:
    get:
      operationId: getAdminDiagnostics
      responses:
        '200':
          $ref: '#/components/responses/DiagnosticsResponse'
  /api/v1/admin/storage-analysis:
    get:
      operationId: getAdminStorageAnalysis
      description: Returns one read-only snapshot of registered CAS payload usage. Byte quantities are decimal strings.
      responses:
        '200':
          $ref: '#/components/responses/StorageAnalysisResponse'
  /api/v1/admin/storage-cleanups:
    post:
      operationId: postAdminStorageCleanup
      description: Skips the retention delay for all registered CAS payload that is still unreferenced when scheduled. Every Blob is rechecked against the protection registry before deletion.
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      responses:
        '202':
          $ref: '#/components/responses/StorageCleanupResponse'
components:
  schemas:
    DiagnosticsSnapshot:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - generatedAtMs
        - databaseSchemaVersion
        - runtimeProviders
        - counts
      properties:
        schemaVersion:
          type: integer
          enum:
            - 2
        generatedAtMs:
          type: integer
          format: int64
          minimum: 0
        databaseSchemaVersion:
          type: integer
          enum:
            - 10
        runtimeProviders:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/DiagnosticsRuntimeProvider'
        counts:
          $ref: '#/components/schemas/DiagnosticsCounts'
    DiagnosticsRuntimeProvider:
      type: object
      additionalProperties: false
      required:
        - providerId
        - providerVersion
        - bundleSha256
        - source
      properties:
        providerId:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        providerVersion:
          type: string
          minLength: 5
          maxLength: 128
        bundleSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        source:
          type: string
          enum:
            - candidate
            - production
    DiagnosticsCounts:
      type: object
      additionalProperties: false
      required:
        - games
        - saveStates
        - blobs
        - jobs
        - datVersions
      properties:
        games:
          $ref: '#/components/schemas/DiagnosticsGameCounts'
        saveStates:
          $ref: '#/components/schemas/DiagnosticsLifecycleCounts'
        blobs:
          type: integer
          format: int64
          minimum: 0
        jobs:
          $ref: '#/components/schemas/DiagnosticsJobCounts'
        datVersions:
          $ref: '#/components/schemas/DiagnosticsDATCounts'
    DiagnosticsLifecycleCounts:
      type: object
      additionalProperties: false
      required:
        - active
        - deleted
      properties:
        active:
          type: integer
          format: int64
          minimum: 0
        deleted:
          type: integer
          format: int64
          minimum: 0
    DiagnosticsGameCounts:
      type: object
      additionalProperties: false
      required:
        - published
        - deleted
      properties:
        published:
          type: integer
          format: int64
          minimum: 0
        deleted:
          type: integer
          format: int64
          minimum: 0
    DiagnosticsJobCounts:
      type: object
      additionalProperties: false
      required:
        - queued
        - running
        - cancelRequested
        - succeeded
        - failed
        - cancelled
      properties:
        queued: {type: integer, format: int64, minimum: 0}
        running: {type: integer, format: int64, minimum: 0}
        cancelRequested: {type: integer, format: int64, minimum: 0}
        succeeded: {type: integer, format: int64, minimum: 0}
        failed: {type: integer, format: int64, minimum: 0}
        cancelled: {type: integer, format: int64, minimum: 0}
    DiagnosticsDATCounts:
      type: object
      additionalProperties: false
      required:
        - pending
        - parsing
        - ready
        - failed
        - cancelled
      properties:
        pending: {type: integer, format: int64, minimum: 0}
        parsing: {type: integer, format: int64, minimum: 0}
        ready: {type: integer, format: int64, minimum: 0}
        failed: {type: integer, format: int64, minimum: 0}
        cancelled: {type: integer, format: int64, minimum: 0}
    StorageAnalysis:
      type: object
      additionalProperties: false
      required:
        - scope
        - generatedAtMs
        - totals
        - categories
        - details
        - excluded
      properties:
        scope:
          type: string
          enum:
            - REGISTERED_CAS_PAYLOAD_V1
        generatedAtMs:
          type: integer
          format: int64
          minimum: 0
        totals:
          $ref: '#/components/schemas/StorageAnalysisTotals'
        categories:
          type: array
          minItems: 9
          maxItems: 9
          items:
            $ref: '#/components/schemas/StorageAnalysisCategory'
        details:
          $ref: '#/components/schemas/StorageAnalysisDetails'
        excluded:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: string
            enum:
              - DATABASE_FILES
              - UPLOAD_PARTS
              - JOB_SCRATCH
              - DEPENDENCY_ROOT
              - FILESYSTEM_OVERHEAD
              - UNREGISTERED_ORPHANS
              - VOLUME_FREE_SPACE
    StorageAnalysisTotals:
      type: object
      additionalProperties: false
      required:
        - registeredBytes
        - protectedBytes
        - unreferencedBytes
        - blobCount
      properties:
        registeredBytes:
          type: string
          pattern: ^[0-9]+$
        protectedBytes:
          type: string
          pattern: ^[0-9]+$
        unreferencedBytes:
          type: string
          pattern: ^[0-9]+$
        blobCount:
          type: integer
          format: int64
          minimum: 0
    StorageAnalysisCategory:
      type: object
      additionalProperties: false
      required:
        - code
        - bytes
        - blobCount
      properties:
        code:
          type: string
          enum:
            - GAME_CONTENT
            - BIOS
            - SAVES
            - MEDIA
            - WORKFLOW
            - RUNTIME_SNAPSHOT
            - SHARED_DURABLE
            - OTHER_REFERENCED
            - UNREFERENCED
        bytes:
          type: string
          pattern: ^[0-9]+$
        blobCount:
          type: integer
          format: int64
          minimum: 0
    StorageAnalysisDetails:
      type: object
      additionalProperties: false
      required:
        - saveStates
        - cleanupCandidates
      properties:
        saveStates:
          $ref: '#/components/schemas/StorageAnalysisSaveStates'
        cleanupCandidates:
          $ref: '#/components/schemas/StorageAnalysisCleanupCandidates'
    StorageAnalysisSaveStates:
      type: object
      additionalProperties: false
      required:
        - activeCount
        - deletedCount
        - stateReferenceBytes
        - screenshotReferenceBytes
      properties:
        activeCount:
          type: integer
          format: int64
          minimum: 0
        deletedCount:
          type: integer
          format: int64
          minimum: 0
        stateReferenceBytes:
          type: string
          pattern: ^[0-9]+$
        screenshotReferenceBytes:
          type: string
          pattern: ^[0-9]+$
    StorageAnalysisCleanupCandidates:
      type: object
      additionalProperties: false
      required:
        - blobCount
        - bytes
      properties:
        blobCount:
          type: integer
          format: int64
          minimum: 0
        bytes:
          type: string
          pattern: ^[0-9]+$
    StorageCleanupResult:
      type: object
      additionalProperties: false
      required:
        - scheduledBlobCount
        - scheduledBytes
        - acceptedAtMs
      properties:
        scheduledBlobCount:
          type: integer
          format: int64
          minimum: 0
        scheduledBytes:
          type: string
          pattern: ^[0-9]+$
        acceptedAtMs:
          type: integer
          format: int64
          minimum: 0
  responses:
    DiagnosticsResponse:
      description: Runtime Provider and database diagnostic snapshot
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiagnosticsSnapshot'
    StorageAnalysisResponse:
      description: Registered CAS payload capacity snapshot
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StorageAnalysis'
    StorageCleanupResponse:
      description: Registered CAS payload accepted for immediate retention-aware garbage collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StorageCleanupResult'
