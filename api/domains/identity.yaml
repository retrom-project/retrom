paths:
  /health/live:
    get:
      security: []
      operationId: getHealthLive
      responses:
        '200':
          $ref: '#/components/responses/HealthLiveResponse'
  /health/ready:
    get:
      security: []
      operationId: getHealthReady
      responses:
        '200':
          $ref: '#/components/responses/HealthReadyResponse'
        '503':
          $ref: '#/components/responses/HealthNotReadyResponse'
  /api/v1/auth/context:
    get:
      security: []
      operationId: getAuthContext
      responses:
        '200':
          $ref: '#/components/responses/AuthContextResponse'
  /api/v1/auth/initialize:
    post:
      security: []
      operationId: postAuthInitialize
      requestBody:
        $ref: '#/components/requestBodies/AuthInitialize'
      responses:
        '201':
          $ref: '#/components/responses/AuthContextResponse'
  /api/v1/auth/login:
    post:
      security: []
      operationId: postAuthLogin
      requestBody:
        $ref: '#/components/requestBodies/AuthLogin'
      responses:
        '200':
          $ref: '#/components/responses/AuthContextResponse'
  /api/v1/auth/logout:
    post:
      security: []
      operationId: postAuthLogout
      requestBody:
        $ref: ../components/common.yaml#/components/requestBodies/Empty
      responses:
        '204':
          description: Logged out
  /api/v1/auth/change-password:
    post:
      operationId: postAuthChangePassword
      requestBody:
        $ref: '#/components/requestBodies/AuthChangePassword'
      responses:
        '200':
          $ref: '#/components/responses/AuthContextResponse'
  /api/v1/auth/account-links/inspect:
    post:
      security: []
      operationId: postAuthAccountLinkInspect
      requestBody:
        $ref: '#/components/requestBodies/AccountLinkInspect'
      responses:
        '200':
          $ref: '#/components/responses/AccountLinkInspectionResponse'
  /api/v1/auth/invitations/accept:
    post:
      security: []
      operationId: postAuthInvitationAccept
      requestBody:
        $ref: '#/components/requestBodies/InvitationAccept'
      responses:
        '201':
          $ref: '#/components/responses/AuthContextResponse'
  /api/v1/auth/password-resets/complete:
    post:
      security: []
      operationId: postAuthPasswordResetComplete
      requestBody:
        $ref: '#/components/requestBodies/PasswordResetComplete'
      responses:
        '200':
          description: Authenticated context for an enabled account, or the disabled-account completion state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthContext'
                  - $ref: '#/components/schemas/PasswordChangedDisabled'
  /api/v1/admin/invitations:
    get:
      operationId: getAdminInvitations
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/State
        - $ref: ../components/common.yaml#/components/parameters/Cursor
        - $ref: ../components/common.yaml#/components/parameters/Limit
      responses:
        '200':
          $ref: '#/components/responses/AccountLinkListResponse'
    post:
      operationId: postAdminInvitation
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      requestBody:
        $ref: '#/components/requestBodies/CreateInvitation'
      responses:
        '201':
          $ref: '#/components/responses/InvitationCreatedResponse'
  /api/v1/admin/users:
    get:
      operationId: getAdminUsers
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/Q80
        - $ref: '#/components/parameters/Role'
        - $ref: ../components/common.yaml#/components/parameters/Status
        - $ref: ../components/common.yaml#/components/parameters/Sort
        - $ref: ../components/common.yaml#/components/parameters/Cursor
        - $ref: ../components/common.yaml#/components/parameters/Limit
      responses:
        '200':
          $ref: '#/components/responses/AdminUserListResponse'
  /api/v1/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      operationId: getAdminUser
      responses:
        '200':
          $ref: '#/components/responses/AdminUserResponse'
    patch:
      operationId: patchAdminUser
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      requestBody:
        $ref: '#/components/requestBodies/PatchUser'
      responses:
        '200':
          $ref: '#/components/responses/AdminUserResponse'
    delete:
      operationId: deleteAdminUser
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      requestBody:
        $ref: '#/components/requestBodies/DeleteUser'
      responses:
        '204':
          description: User soft-deleted
  /api/v1/admin/users/{userId}/password-reset-links:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      operationId: getAdminUserPasswordResetLinks
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/State
        - $ref: ../components/common.yaml#/components/parameters/Cursor
        - $ref: ../components/common.yaml#/components/parameters/Limit
      responses:
        '200':
          $ref: '#/components/responses/AccountLinkListResponse'
    post:
      operationId: postAdminUserPasswordResetLink
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      requestBody:
        $ref: ../components/common.yaml#/components/requestBodies/Empty
      responses:
        '201':
          $ref: '#/components/responses/PasswordResetCreatedResponse'
  /api/v1/admin/account-links/{accountLinkId}:
    parameters:
      - $ref: '#/components/parameters/AccountLinkID'
    delete:
      operationId: deleteAdminAccountLink
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IfMatch
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
        - $ref: ../components/common.yaml#/components/parameters/CSRFToken
      requestBody:
        $ref: ../components/common.yaml#/components/requestBodies/Empty
      responses:
        '204':
          description: Account link revoked
components:
  schemas:
    AuthInitializeRequest:
      type: object
      additionalProperties: false
      required:
        - setupCode
        - username
        - displayName
        - password
        - passwordConfirmation
      properties:
        setupCode:
          type: string
          minLength: 43
          maxLength: 43
        username:
          type: string
          minLength: 3
          maxLength: 32
        displayName:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 512
        passwordConfirmation:
          type: string
          minLength: 1
          maxLength: 512
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 512
    AuthChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
        - newPasswordConfirmation
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 512
        newPassword:
          type: string
          minLength: 1
          maxLength: 512
        newPasswordConfirmation:
          type: string
          minLength: 1
          maxLength: 512
    AccountLinkInspectRequest:
      type: object
      additionalProperties: false
      required:
        - expectedKind
        - token
      properties:
        expectedKind:
          type: string
          enum:
            - INVITATION
            - PASSWORD_RESET
        token:
          type: string
          minLength: 64
          maxLength: 64
    InvitationAcceptRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - username
        - displayName
        - password
        - passwordConfirmation
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 64
        username:
          type: string
          minLength: 3
          maxLength: 32
        displayName:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 512
        passwordConfirmation:
          type: string
          minLength: 1
          maxLength: 512
    PasswordResetCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - password
        - passwordConfirmation
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 512
        passwordConfirmation:
          type: string
          minLength: 1
          maxLength: 512
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - role
        - confirmAdminRole
      properties:
        role:
          type: string
          enum:
            - ADMIN
            - USER
        confirmAdminRole:
          type: boolean
    PatchUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          type: string
          enum:
            - ADMIN
            - USER
        status:
          type: string
          enum:
            - ENABLED
            - DISABLED
        confirmAdminRole:
          type: boolean
    DeleteUserRequest:
      type: object
      additionalProperties: false
      required:
        - confirmUsername
      properties:
        confirmUsername:
          type: string
          minLength: 3
          maxLength: 32
    HealthLive:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    HealthReady:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
    HealthNotReady:
      type: object
      additionalProperties: false
      required:
        - status
        - reasonCode
      properties:
        status:
          type: string
          enum:
            - not_ready
        reasonCode:
          type: string
          enum:
            - DATABASE_UNAVAILABLE
            - CAS_UNAVAILABLE
            - DEPENDENCY_INVALID
            - DEPENDENCY_DAT_PARSE_FAILED
            - DEPENDENCY_INDEXING
    AuthUser:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - displayName
        - role
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - USER
    AuthContext:
      type: object
      additionalProperties: false
      required:
        - instanceState
        - mode
        - authenticationState
        - user
        - csrfToken
        - idleExpiresAtMs
        - absoluteExpiresAtMs
        - testDefaultAccountActive
        - netplayEnabled
      properties:
        instanceState:
          type: string
          enum:
            - INITIALIZATION_REQUIRED
            - READY
        mode:
          type: string
          enum:
            - release
            - test
        authenticationState:
          type: string
          enum:
            - NOT_APPLICABLE
            - UNAUTHENTICATED
            - AUTHENTICATED
        user:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AuthUser'
        csrfToken:
          type: string
          minLength: 43
          maxLength: 43
          nullable: true
        idleExpiresAtMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        absoluteExpiresAtMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        testDefaultAccountActive:
          type: boolean
        netplayEnabled:
          type: boolean
    AccountLinkInspection:
      type: object
      additionalProperties: false
      required:
        - kind
        - role
        - username
        - expiresAtMs
      properties:
        kind:
          type: string
          enum:
            - INVITATION
            - PASSWORD_RESET
        role:
          type: string
          enum:
            - ADMIN
            - USER
          nullable: true
        username:
          type: string
          nullable: true
        expiresAtMs:
          type: integer
          format: int64
          minimum: 0
    AdminUser:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - displayName
        - role
        - status
        - version
        - createdAtMs
        - lastLoginAtMs
        - activeSessionCount
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - USER
        status:
          type: string
          enum:
            - ENABLED
            - DISABLED
            - DELETED
        version:
          type: integer
          format: int64
          minimum: 1
        createdAtMs:
          type: integer
          format: int64
          minimum: 0
        lastLoginAtMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        activeSessionCount:
          type: integer
          format: int64
          minimum: 0
    AdminUserList:
      type: object
      additionalProperties: false
      required:
        - generatedAtMs
        - items
        - nextCursor
      properties:
        generatedAtMs:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        nextCursor:
          type: string
          nullable: true
    AccountLinkCreator:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
    AccountLink:
      type: object
      additionalProperties: false
      required:
        - accountLinkId
        - kind
        - role
        - targetUserId
        - createdBy
        - state
        - version
        - createdAtMs
        - expiresAtMs
        - consumedAtMs
        - revokedAtMs
      properties:
        accountLinkId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - INVITATION
            - PASSWORD_RESET
        role:
          type: string
          enum:
            - ADMIN
            - USER
          nullable: true
        targetUserId:
          type: string
          format: uuid
          nullable: true
        createdBy:
          $ref: '#/components/schemas/AccountLinkCreator'
        state:
          type: string
          enum:
            - ACTIVE
            - CONSUMED
            - REVOKED
            - EXPIRED
        version:
          type: integer
          format: int64
          minimum: 1
        createdAtMs:
          type: integer
          format: int64
          minimum: 0
        expiresAtMs:
          type: integer
          format: int64
          minimum: 0
        consumedAtMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        revokedAtMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
    AccountLinkList:
      type: object
      additionalProperties: false
      required:
        - generatedAtMs
        - items
        - nextCursor
      properties:
        generatedAtMs:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountLink'
        nextCursor:
          type: string
          nullable: true
    InvitationCreated:
      type: object
      additionalProperties: false
      required:
        - accountLinkId
        - role
        - state
        - version
        - createdAtMs
        - expiresAtMs
        - url
      properties:
        accountLinkId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - ADMIN
            - USER
        state:
          type: string
          enum:
            - ACTIVE
        version:
          type: integer
          format: int64
          minimum: 1
        createdAtMs:
          type: integer
          format: int64
          minimum: 0
        expiresAtMs:
          type: integer
          format: int64
          minimum: 0
        url:
          type: string
          format: uri
    PasswordResetCreated:
      type: object
      additionalProperties: false
      required:
        - accountLinkId
        - targetUserId
        - targetUserVersion
        - state
        - version
        - createdAtMs
        - expiresAtMs
        - url
      properties:
        accountLinkId:
          type: string
          format: uuid
        targetUserId:
          type: string
          format: uuid
        targetUserVersion:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum:
            - ACTIVE
        version:
          type: integer
          format: int64
          minimum: 1
        createdAtMs:
          type: integer
          format: int64
          minimum: 0
        expiresAtMs:
          type: integer
          format: int64
          minimum: 0
        url:
          type: string
          format: uri
    PasswordChangedDisabled:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PASSWORD_CHANGED_ACCOUNT_DISABLED
  requestBodies:
    AuthInitialize:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthInitializeRequest'
    AuthLogin:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthLoginRequest'
    AuthChangePassword:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthChangePasswordRequest'
    AccountLinkInspect:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountLinkInspectRequest'
    InvitationAccept:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationAcceptRequest'
    PasswordResetComplete:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetCompleteRequest'
    CreateInvitation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateInvitationRequest'
    PatchUser:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PatchUserRequest'
    DeleteUser:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteUserRequest'
  responses:
    HealthLiveResponse:
      description: Process is live
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthLive'
    HealthReadyResponse:
      description: Service is ready
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthReady'
    HealthNotReadyResponse:
      description: Service is not ready
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthNotReady'
    AuthContextResponse:
      description: Instance and current authenticated-session context
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthContext'
    AccountLinkInspectionResponse:
      description: Non-secret metadata visible to a valid account-link holder
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountLinkInspection'
    AdminUserListResponse:
      description: Account-security-only user list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUserList'
    AdminUserResponse:
      description: Account-security-only user detail
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUser'
    AccountLinkListResponse:
      description: Secretless account-link metadata list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountLinkList'
    InvitationCreatedResponse:
      description: Invitation metadata and the one-time capability URL
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationCreated'
    PasswordResetCreatedResponse:
      description: Password-reset metadata and the one-time capability URL
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetCreated'
  parameters:
    Role:
      name: role
      in: query
      schema:
        type: string
        enum:
          - ADMIN
          - USER
    UserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountLinkID:
      name: accountLinkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
