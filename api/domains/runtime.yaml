paths:
  /content/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    get:
      operationId: getContentAsset
      description: Serves only an asset owned by the published game's current metadata revision; retired asset IDs return 404.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      operationId: headContentAsset
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /content/save-states/{saveStateId}/screenshot:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/SaveStateID
    get:
      operationId: getSaveStateScreenshot
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      operationId: headSaveStateScreenshot
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /api/v1/admin/review-assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    get:
      operationId: getAdminReviewAsset
      parameters:
        - $ref: '#/components/parameters/ReviewSourceMediaKind'
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      operationId: headAdminReviewAsset
      parameters:
        - $ref: '#/components/parameters/ReviewSourceMediaKind'
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/providers/{providerId}/{bundleSha256}/{runtimePath}:
    x-retrom-router-template: /runtime/providers/{providerId}/{bundleSha256}/{runtimePath:.+}
    parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      - name: bundleSha256
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: runtimePath
        in: path
        required: true
        schema:
          type: string
    get:
      security: []
      operationId: getRuntimeProviderResource
      description: Serves only a manifest/integrity allowlisted file from the active content-addressed Provider Bundle.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
        '404':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
        '416':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
    head:
      security: []
      operationId: headRuntimeProviderResource
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
        '404':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
        '416':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /runtime/content/project/{contentIdentity}/{projectPath}:
    x-retrom-router-template: /runtime/content/project/{contentIdentity}/{projectPath:.+}
    parameters:
      - $ref: '#/components/parameters/ContentIdentity'
      - name: projectPath
        in: path
        required: true
        schema:
          type: string
    get:
      security: []
      operationId: getRuntimeProjectFile
      description: Serves one exact file from the immutable project identity locked by an authorized Launch; index.json is a reserved virtual index.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRuntimeProjectFile
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/launches/{launchId}/config:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    get:
      security: []
      operationId: getRuntimeLaunchConfig
      responses:
        '200':
          $ref: '#/components/responses/LaunchConfigResponse'
  /runtime/launches/{launchId}/start:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeLaunchStart
      requestBody:
        $ref: '#/components/requestBodies/PlayEvent'
      responses:
        '200':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /runtime/launches/{launchId}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeLaunchHeartbeat
      requestBody:
        $ref: '#/components/requestBodies/PlayEvent'
      responses:
        '200':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /runtime/launches/{launchId}/finish:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeLaunchFinish
      requestBody:
        $ref: '#/components/requestBodies/PlayEvent'
      responses:
        '200':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /runtime/launches/{launchId}/player-events:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeMultiDiscPlayerEvent
      description: Records a closed, low-cardinality multi-disc Player result after validating the Launch cookie. Names, paths, hashes, and capabilities are not accepted.
      requestBody:
        $ref: '#/components/requestBodies/MultiDiscPlayerEvent'
      responses:
        '204':
          description: Event accepted
  /runtime/launches/{launchId}/save-states:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeSaveState
      x-retrom-streaming-body: true
      description: Creates either a product SaveState or the single temporary checkpoint of a runtime-validation Launch. The metadata is strict RuntimeCheckpointMetadata JSON; Provider identity, Target compatibility, checkpoint format and dependency bindings are validated against the immutable Launch snapshot. Total multipart input is capped at 270 MiB only on this route.
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                metadata:
                  type: string
                  description: UTF-8 JSON serialized from RuntimeCheckpointMetadata; duplicate or unknown JSON fields are rejected.
                payload:
                  type: string
                  format: binary
                screenshot:
                  type: string
                  format: binary
              required:
                - metadata
                - payload
            encoding:
              metadata:
                contentType: application/json
              payload:
                contentType: application/octet-stream
              screenshot:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '201':
          $ref: '#/components/responses/RuntimeCheckpointCreateResponse'
        '409':
          $ref: ../components/common.yaml#/components/responses/RpgConflictResponse
        '413':
          $ref: '#/components/responses/RequestTooLargeResponse'
        '422':
          $ref: ../components/common.yaml#/components/responses/RpgUnprocessableResponse
  /runtime/launches/{launchId}/checkpoint-status:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    get:
      security: []
      operationId: getRuntimeCheckpointStatus
      description: Returns the frozen checkpoint format and the most recent ordered Provider availability projection; immediate Player state remains driven by Provider events.
      responses:
        '200':
          $ref: '#/components/responses/CheckpointStatusResponse'
        '409':
          $ref: ../components/common.yaml#/components/responses/RpgConflictResponse
  /runtime/launches/{launchId}/rpgmaker-gates/events:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeRpgMakerGateEvent
      description: Accepts strictly ordered, event-idempotent gates only from an RPG_RUNTIME_VALIDATION Launch. Positional gates are compared server-side so restore must equal the saved map/coordinates/fixture state and differ from the post-save state.
      requestBody:
        $ref: '#/components/requestBodies/RpgMakerGateEvent'
      responses:
        '200':
          $ref: '#/components/responses/RpgMakerGateEventResponse'
        '408':
          $ref: '#/components/responses/RpgTimeoutResponse'
        '409':
          $ref: ../components/common.yaml#/components/responses/RpgConflictResponse
        '422':
          $ref: ../components/common.yaml#/components/responses/RpgUnprocessableResponse
  /runtime/content/game/{contentIdentity}/{logicalName}:
    parameters:
      - $ref: '#/components/parameters/ContentIdentity'
      - $ref: '#/components/parameters/LogicalName'
    get:
      security: []
      operationId: getRuntimeGame
      description: Streams only an active Launch content grant's exact content-addressed game object. Multi-disc playlist.m3u uses audio/x-mpegurl with the common single-Range contract. Responses are private immutable and retain strong ETag validation.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRuntimeGame
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/content/external/{contentIdentity}/{logicalName}:
    parameters:
      - $ref: '#/components/parameters/ContentIdentity'
      - $ref: '#/components/parameters/LogicalName'
    get:
      security: []
      operationId: getRuntimeExternalFile
      description: Streams only an active Launch content grant's exact content-addressed BIOS or canonical disc-NNN.chd external file with the common single-Range contract.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRuntimeExternalFile
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/content/bios/{contentIdentity}/bundle.zip:
    parameters:
      - $ref: '#/components/parameters/ContentIdentity'
    get:
      security: []
      operationId: getRuntimeBIOSBundle
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRuntimeBIOSBundle
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/content/parent/{contentIdentity}/bundle.zip:
    parameters:
      - $ref: '#/components/parameters/ContentIdentity'
    get:
      security: []
      operationId: getRuntimeParentBundle
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRuntimeParentBundle
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/launches/{launchId}/state:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    get:
      security: []
      operationId: getRuntimeState
      description: Streams only the frozen binary checkpoint payload after compatibility validation; success never wraps bytes in JSON.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
        '409':
          $ref: ../components/common.yaml#/components/responses/RpgConflictResponse
    head:
      security: []
      operationId: headRuntimeState
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/launches/{launchId}/review-screenshot:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeReviewScreenshot
      x-retrom-streaming-body: true
      description: Stores one bounded PNG or JPEG using the path-scoped capability. The legacy branch accepts a current non-RPG review preview after five seconds, creates a review-runtime screenshot asset, and returns that asset ID and URL. The RPG branch accepts only PNG from the current validation's distinct restore Launch after the original Launch ended and RESTORE_POSITION_VERIFIED passed, binds it directly to the validation's immutable restore evidence, and returns the validation ID as screenshotId and review-asset URL. The original validation Launch, ordinary published Launch sessions, expired capabilities, duplicate evidence, and binding drift cannot use this route.
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        '201':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
components:
  schemas:
    StartupAction:
      type: object
      additionalProperties: false
      required:
        - event
        - kind
        - delayMs
        - player
        - control
        - durationMs
      properties:
        event:
          type: string
          enum:
            - GAME_START
        kind:
          type: string
          enum:
            - PRESS_CONTROL
        delayMs:
          type: integer
          minimum: 1
          maximum: 30000
        player:
          type: integer
          minimum: 1
          maximum: 3
        control:
          type: integer
          minimum: 0
          maximum: 255
        durationMs:
          type: integer
          minimum: 1
          maximum: 1000
    DiscEntry:
      type: object
      additionalProperties: false
      required:
        - index
        - label
        - virtualPath
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 7
        label:
          type: string
          minLength: 1
          maxLength: 32
        virtualPath:
          type: string
          pattern: ^/disc-[0-9]{3}\.chd$
    DiscSet:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - contentKind
        - count
        - initialDiscIndex
        - entries
      properties:
        contentKind:
          type: string
          enum:
            - MULTI_DISC_M3U_V1
        count:
          type: integer
          minimum: 2
          maximum: 8
        initialDiscIndex:
          type: integer
          minimum: 0
          maximum: 7
        entries:
          type: array
          minItems: 2
          maxItems: 8
          items:
            $ref: '#/components/schemas/DiscEntry'
    ReviewPreviewConfig:
      type: object
      additionalProperties: false
      required:
        - importItemId
        - captureAllowed
        - captureAfterMs
      properties:
        importItemId:
          type: string
          format: uuid
        captureAllowed:
          type: boolean
        captureAfterMs:
          type: integer
          minimum: 5000
          maximum: 5000
    LaunchConfig:
      $ref: ../runtime-provider/v1/launch-envelope.schema.json
    CheckpointUnavailableReason:
      type: string
      enum:
        - CORE_REPORTED_UNAVAILABLE
        - STARTUP_NOT_READY
        - SESSION_TERMINAL
    CheckpointAvailability:
      type: object
      additionalProperties: false
      required:
        - available
        - sequence
        - reason
      properties:
        available:
          type: boolean
        sequence:
          type: integer
          format: int64
          minimum: 0
        reason:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CheckpointUnavailableReason'
    RpgRuntimeGatePhase:
      type: string
      enum:
        - BEGIN
        - PASS
        - FAIL
    RpgMakerGateEventRequest:
      type: object
      additionalProperties: false
      required:
        - sequence
        - eventId
        - gate
        - phase
        - observedAtMs
        - evidence
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        eventId:
          type: string
          format: uuid
        gate:
          $ref: ../components/common.yaml#/components/schemas/RpgRuntimeGate
        phase:
          $ref: '#/components/schemas/RpgRuntimeGatePhase'
        observedAtMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 253402300799999
        evidence:
          $ref: ../components/common.yaml#/components/schemas/RpgRuntimeGateEvidence
    RpgMakerGateEventAccepted:
      type: object
      additionalProperties: false
      required:
        - sequence
        - eventId
        - validationState
        - idempotentReplay
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        eventId:
          type: string
          format: uuid
        validationState:
          $ref: ../components/common.yaml#/components/schemas/RpgRuntimeValidationState
        idempotentReplay:
          type: boolean
    RpgRuntimeValidationResume:
      type: object
      additionalProperties: false
      required:
        - validationId
        - state
        - originalLaunchId
        - restoreLaunchId
        - lastGateSequence
        - machineGates
        - checkpointEvidence
        - restoreScreenshotUploaded
      properties:
        validationId:
          type: string
          format: uuid
        state:
          $ref: ../components/common.yaml#/components/schemas/RpgRuntimeValidationState
        originalLaunchId:
          type: string
          format: uuid
        restoreLaunchId:
          type: string
          format: uuid
          nullable: true
        lastGateSequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 28
        machineGates:
          type: array
          minItems: 14
          maxItems: 14
          description: Ordered server-authoritative gate state used to resume a runtime-authorized page reload.
          items:
            $ref: ../components/common.yaml#/components/schemas/RpgRuntimeMachineGate
        checkpointEvidence:
          nullable: true
          allOf:
            - $ref: ../components/common.yaml#/components/schemas/RpgCheckpointGateEvidence
        restoreScreenshotUploaded:
          type: boolean
    ProductSaveStateCreated:
      type: object
      additionalProperties: false
      required:
        - resourceKind
        - saveStateId
        - checkpointFormat
        - screenshotUrl
        - createdAtMs
      properties:
        resourceKind:
          type: string
          enum:
            - SAVE_STATE
        saveStateId:
          type: string
          format: uuid
        checkpointFormat:
          $ref: ../components/common.yaml#/components/schemas/CheckpointFormat
        screenshotUrl:
          type: string
          nullable: true
          pattern: ^/content/save-states/
        createdAtMs:
          type: integer
          format: int64
          minimum: 0
    ValidationCheckpointCreated:
      type: object
      additionalProperties: false
      required:
        - resourceKind
        - validationId
        - checkpointFormat
        - sizeBytes
        - sha256
        - createdAtMs
      properties:
        resourceKind:
          type: string
          enum:
            - RPG_RUNTIME_VALIDATION_CHECKPOINT
        validationId:
          type: string
          format: uuid
        checkpointFormat:
          $ref: ../components/common.yaml#/components/schemas/CheckpointFormat
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 268435456
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        createdAtMs:
          type: integer
          format: int64
          minimum: 0
    RuntimeCheckpointCreated:
      oneOf:
        - $ref: '#/components/schemas/ProductSaveStateCreated'
        - $ref: '#/components/schemas/ValidationCheckpointCreated'
      discriminator:
        propertyName: resourceKind
        mapping:
          SAVE_STATE: '#/components/schemas/ProductSaveStateCreated'
          RPG_RUNTIME_VALIDATION_CHECKPOINT: '#/components/schemas/ValidationCheckpointCreated'
    CheckpointStatus:
      type: object
      additionalProperties: false
      required:
        - checkpointFormat
        - availability
      properties:
        checkpointFormat:
          $ref: ../components/common.yaml#/components/schemas/CheckpointFormat
        availability:
          $ref: '#/components/schemas/CheckpointAvailability'
    PlayEventRequest:
      type: object
      additionalProperties: false
      required:
        - clientSequence
        - clientObservedAtMs
        - previousInterval
      properties:
        clientSequence:
          type: integer
          format: int64
          minimum: 0
        clientObservedAtMs:
          type: integer
          format: int64
          minimum: 0
        previousInterval:
          nullable: true
          allOf:
            - type: object
              additionalProperties: false
              required:
                - running
                - visible
                - paused
              properties:
                running:
                  type: boolean
                visible:
                  type: boolean
                paused:
                  type: boolean
    MultiDiscPlayerEventRequest:
      type: object
      additionalProperties: false
      required:
        - eventType
        - resultCode
        - discCount
        - observedDiscCount
      properties:
        eventType:
          type: string
          enum:
            - START
            - DISK_COUNT_MISMATCH
            - SWITCH_SUCCESS
            - SWITCH_FAILURE
            - SAVE_RESTORE_SUCCESS
            - SAVE_RESTORE_FAILURE
        resultCode:
          type: string
          enum:
            - OK
            - PLAYER_DISC_SET_INVALID
            - PLAYER_DISC_API_UNAVAILABLE
            - PLAYER_DISC_SWITCH_UNAVAILABLE
            - PLAYER_DISC_SWITCH_FAILED
            - PLAYER_SAVE_STATE_UNAVAILABLE
            - PLAYER_SAVE_STATE_RESTORE_FAILED
        discCount:
          type: integer
          minimum: 2
          maximum: 8
        observedDiscCount:
          type: integer
          minimum: -1
          maximum: 64
          nullable: true
  requestBodies:
    RpgMakerGateEvent:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RpgMakerGateEventRequest'
    PlayEvent:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlayEventRequest'
    MultiDiscPlayerEvent:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MultiDiscPlayerEventRequest'
  responses:
    RuntimeCheckpointCreateResponse:
      description: Product save-state or temporary RPG runtime-validation checkpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuntimeCheckpointCreated'
    CheckpointStatusResponse:
      description: Current route payload kind and ordered checkpoint availability
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CheckpointStatus'
    RpgMakerGateEventResponse:
      description: Ordered validation gate accepted or replayed idempotently
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RpgMakerGateEventAccepted'
    RpgTimeoutResponse:
      description: RPG_RUNTIME_TIMEOUT (408)
      content:
        application/json:
          schema:
            $ref: ../components/common.yaml#/components/schemas/RpgErrorEnvelope
    RequestTooLargeResponse:
      description: REQUEST_TOO_LARGE (413); this generic transport limit is not an RPG detector result
      content:
        application/json:
          schema:
            $ref: ../components/common.yaml#/components/schemas/ErrorEnvelope
    LaunchConfigResponse:
      description: Exact Launch Envelope V1 derived from an immutable Provider Target and authorized resources
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LaunchConfig'
    BinaryResponse:
      description: Binary content
      headers:
        ETag:
          schema:
            type: string
        Accept-Ranges:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
  parameters:
    ReviewSourceMediaKind:
      name: kind
      in: query
      schema:
        type: string
        enum:
          - COVER
          - VIDEO
    AssetID:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LaunchID:
      name: launchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContentIdentity:
      name: contentIdentity
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    ConfiguredVersion:
      name: configuredVersion
      in: path
      required: true
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$
    LogicalName:
      name: logicalName
      in: path
      required: true
      schema:
        type: string
