paths:
  /content/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    get:
      operationId: getContentAsset
      description: Serves only an asset owned by the published game's current metadata revision; retired asset IDs return 404.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      operationId: headContentAsset
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /content/save-states/{saveStateId}/screenshot:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/SaveStateID
    get:
      operationId: getSaveStateScreenshot
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      operationId: headSaveStateScreenshot
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /api/v1/admin/review-assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    get:
      operationId: getAdminReviewAsset
      parameters:
        - $ref: '#/components/parameters/ReviewSourceMediaKind'
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      operationId: headAdminReviewAsset
      parameters:
        - $ref: '#/components/parameters/ReviewSourceMediaKind'
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/emulatorjs/{configuredVersion}/{runtimePath}:
    x-retrom-router-template: /runtime/emulatorjs/{configuredVersion}/{runtimePath:.+}
    parameters:
      - $ref: '#/components/parameters/ConfiguredVersion'
      - name: runtimePath
        in: path
        required: true
        schema:
          type: string
      - name: v
        in: query
        required: false
        description: EmulatorJS cache-buster; ignored for allowlist and file selection.
        schema:
          type: string
          maxLength: 128
    get:
      security: []
      operationId: getRuntimeEmulatorJS
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRuntimeEmulatorJS
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/retrom-runtime/{runtimeVersion}/{runtimePath}:
    x-retrom-router-template: /runtime/retrom-runtime/{runtimeVersion}/{runtimePath:.+}
    parameters:
      - name: runtimeVersion
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$
      - name: runtimePath
        in: path
        required: true
        schema:
          type: string
    get:
      security: []
      operationId: getRetromRuntimeArtifact
      description: Serves only a declared retrom-runtime Release asset from the dependency manifest allowlist.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRetromRuntimeArtifact
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/projects/{launchId}/{projectPath}:
    x-retrom-router-template: /runtime/projects/{launchId}/{projectPath:.+}
    parameters:
      - $ref: '#/components/parameters/LaunchID'
      - name: projectPath
        in: path
        required: true
        schema:
          type: string
    get:
      security: []
      operationId: getRuntimeProjectFile
      description: Serves one exact file from the immutable directory-runtime project fileset locked by the authorized Launch; index.json is a reserved virtual index.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRuntimeProjectFile
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/launches/{launchId}/config:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    get:
      security: []
      operationId: getRuntimeLaunchConfig
      responses:
        '200':
          $ref: '#/components/responses/LaunchConfigResponse'
  /runtime/launches/{launchId}/start:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeLaunchStart
      requestBody:
        $ref: '#/components/requestBodies/PlayEvent'
      responses:
        '200':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /runtime/launches/{launchId}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeLaunchHeartbeat
      requestBody:
        $ref: '#/components/requestBodies/PlayEvent'
      responses:
        '200':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /runtime/launches/{launchId}/finish:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeLaunchFinish
      requestBody:
        $ref: '#/components/requestBodies/PlayEvent'
      responses:
        '200':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
  /runtime/launches/{launchId}/player-events:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeMultiDiscPlayerEvent
      description: Records a closed, low-cardinality multi-disc Player result after validating the Launch cookie. Names, paths, hashes, and capabilities are not accepted.
      requestBody:
        $ref: '#/components/requestBodies/MultiDiscPlayerEvent'
      responses:
        '204':
          description: Event accepted
  /runtime/launches/{launchId}/save-states:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeSaveState
      x-retrom-streaming-body: true
      description: Creates either a product SaveState or the single temporary checkpoint of an RPG_RUNTIME_VALIDATION Launch. The metadata part is strict RuntimeCheckpointMetadata JSON; authoritative artifact, user, content revision, adapter ABI, save ABI and dependency bindings always come from the Launch. Total multipart input is capped at 270 MiB only on this route.
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                metadata:
                  type: string
                  description: UTF-8 JSON serialized from RuntimeCheckpointMetadata; duplicate or unknown JSON fields are rejected.
                payload:
                  type: string
                  format: binary
                screenshot:
                  type: string
                  format: binary
              required:
                - metadata
                - payload
            encoding:
              metadata:
                contentType: application/json
              payload:
                contentType: application/octet-stream
              screenshot:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '201':
          $ref: '#/components/responses/RuntimeCheckpointCreateResponse'
        '409':
          $ref: ../components/common.yaml#/components/responses/RpgConflictResponse
        '413':
          $ref: '#/components/responses/RequestTooLargeResponse'
        '422':
          $ref: ../components/common.yaml#/components/responses/RpgUnprocessableResponse
  /runtime/launches/{launchId}/checkpoint-status:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    get:
      security: []
      operationId: getRuntimeCheckpointStatus
      description: Returns the frozen payload kind and the most recent ordered adapter availability projection; immediate Player state remains driven by adapter events.
      responses:
        '200':
          $ref: '#/components/responses/CheckpointStatusResponse'
        '409':
          $ref: ../components/common.yaml#/components/responses/RpgConflictResponse
  /runtime/launches/{launchId}/rpgmaker-gates/events:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeRpgMakerGateEvent
      description: Accepts strictly ordered, event-idempotent gates only from an RPG_RUNTIME_VALIDATION Launch. Positional gates are compared server-side so restore must equal the saved map/coordinates/fixture state and differ from the post-save state.
      requestBody:
        $ref: '#/components/requestBodies/RpgMakerGateEvent'
      responses:
        '200':
          $ref: '#/components/responses/RpgMakerGateEventResponse'
        '408':
          $ref: '#/components/responses/RpgTimeoutResponse'
        '409':
          $ref: ../components/common.yaml#/components/responses/RpgConflictResponse
        '422':
          $ref: ../components/common.yaml#/components/responses/RpgUnprocessableResponse
  /runtime/content/game/{contentIdentity}/{logicalName}:
    parameters:
      - $ref: '#/components/parameters/ContentIdentity'
      - $ref: '#/components/parameters/LogicalName'
    get:
      security: []
      operationId: getRuntimeGame
      description: Streams only an active Launch content grant's exact content-addressed game object. Multi-disc playlist.m3u uses audio/x-mpegurl with the common single-Range contract. Responses are private immutable and retain strong ETag validation.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRuntimeGame
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/content/external/{contentIdentity}/{logicalName}:
    parameters:
      - $ref: '#/components/parameters/ContentIdentity'
      - $ref: '#/components/parameters/LogicalName'
    get:
      security: []
      operationId: getRuntimeExternalFile
      description: Streams only an active Launch content grant's exact content-addressed BIOS or canonical disc-NNN.chd external file with the common single-Range contract.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRuntimeExternalFile
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/content/bios/{contentIdentity}/bundle.zip:
    parameters:
      - $ref: '#/components/parameters/ContentIdentity'
    get:
      security: []
      operationId: getRuntimeBIOSBundle
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRuntimeBIOSBundle
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/content/parent/{contentIdentity}/bundle.zip:
    parameters:
      - $ref: '#/components/parameters/ContentIdentity'
    get:
      security: []
      operationId: getRuntimeParentBundle
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
    head:
      security: []
      operationId: headRuntimeParentBundle
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/launches/{launchId}/state:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    get:
      security: []
      operationId: getRuntimeState
      description: Streams only the frozen binary checkpoint payload after compatibility validation; success never wraps bytes in JSON.
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
        '409':
          $ref: ../components/common.yaml#/components/responses/RpgConflictResponse
    head:
      security: []
      operationId: headRuntimeState
      responses:
        '200':
          $ref: '#/components/responses/BinaryResponse'
  /runtime/launches/{launchId}/review-screenshot:
    parameters:
      - $ref: '#/components/parameters/LaunchID'
    post:
      security: []
      operationId: postRuntimeReviewScreenshot
      x-retrom-streaming-body: true
      description: Stores one bounded PNG using the path-scoped capability. The legacy branch accepts a current non-RPG review preview after five seconds, creates a review-runtime screenshot asset, and returns that asset ID and URL. The RPG branch accepts only the current validation's distinct restore Launch after the original Launch ended and RESTORE_POSITION_VERIFIED passed, binds the PNG directly to the validation's immutable restore evidence, and returns the validation ID as screenshotId and review-asset URL. The original validation Launch, ordinary published Launch sessions, expired capabilities, duplicate evidence, and binding drift cannot use this route.
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '201':
          $ref: ../components/common.yaml#/components/responses/JSONResponse
components:
  schemas:
    StartupAction:
      type: object
      additionalProperties: false
      required:
        - event
        - kind
        - delayMs
        - player
        - control
        - durationMs
      properties:
        event:
          type: string
          enum:
            - GAME_START
        kind:
          type: string
          enum:
            - PRESS_CONTROL
        delayMs:
          type: integer
          minimum: 1
          maximum: 30000
        player:
          type: integer
          minimum: 1
          maximum: 3
        control:
          type: integer
          minimum: 0
          maximum: 255
        durationMs:
          type: integer
          minimum: 1
          maximum: 1000
    DiscEntry:
      type: object
      additionalProperties: false
      required:
        - index
        - label
        - virtualPath
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 7
        label:
          type: string
          minLength: 1
          maxLength: 32
        virtualPath:
          type: string
          pattern: ^/disc-[0-9]{3}\.chd$
    DiscSet:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - contentKind
        - count
        - initialDiscIndex
        - entries
      properties:
        contentKind:
          type: string
          enum:
            - MULTI_DISC_M3U_V1
        count:
          type: integer
          minimum: 2
          maximum: 8
        initialDiscIndex:
          type: integer
          minimum: 0
          maximum: 7
        entries:
          type: array
          minItems: 2
          maxItems: 8
          items:
            $ref: '#/components/schemas/DiscEntry'
    ReviewPreviewConfig:
      type: object
      additionalProperties: false
      required:
        - importItemId
        - captureAllowed
        - captureAfterMs
      properties:
        importItemId:
          type: string
          format: uuid
        captureAllowed:
          type: boolean
        captureAfterMs:
          type: integer
          minimum: 5000
          maximum: 5000
    LaunchConfig:
      oneOf:
        - $ref: '#/components/schemas/EmulatorJSLaunchConfig'
        - $ref: '#/components/schemas/RpgMakerLaunchConfig'
        - $ref: '#/components/schemas/OnsLaunchConfig'
        - $ref: '#/components/schemas/KiriKiriLaunchConfig'
      discriminator:
        propertyName: runtimeFamily
        mapping:
          EMULATORJS: '#/components/schemas/EmulatorJSLaunchConfig'
          RPGMAKER: '#/components/schemas/RpgMakerLaunchConfig'
          ONS: '#/components/schemas/OnsLaunchConfig'
          KIRIKIRI: '#/components/schemas/KiriKiriLaunchConfig'
    EmulatorJSLaunchConfig:
      type: object
      additionalProperties: false
      required:
        - runtimeFamily
        - mode
        - launchId
        - emulatorjsVersion
        - playerAdapterId
        - core
        - runtimeCore
        - coreName
        - coreArtifactId
        - emulatorGameId
        - gameName
        - gameTitle
        - platformName
        - runtimeBaseUrl
        - loaderUrl
        - gameUrl
        - biosUrl
        - parentUrl
        - stateUrl
        - inputMode
        - startupActions
        - requiresThreads
        - runtimePathOverrides
        - defaultCoreOptions
        - externalFiles
        - discSet
        - dosEntry
        - warnings
        - returnTo
        - netplay
      properties:
        runtimeFamily:
          type: string
          enum:
            - EMULATORJS
        mode:
          type: string
          enum:
            - single
            - netplay
        launchId:
          type: string
          format: uuid
        emulatorjsVersion:
          type: string
        playerAdapterId:
          type: string
          enum:
            - ejs-4.2.3-v2
            - ejs-4.2.3-v3
            - ejs-4.3.0-pre-v2
        core:
          type: string
        runtimeCore:
          type: string
          pattern: ^[a-z0-9_]{1,64}$
        coreName:
          type: string
        coreArtifactId:
          type: string
          format: uuid
        emulatorGameId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        gameName:
          type: string
        gameTitle:
          type: string
        platformName:
          type: string
        runtimeBaseUrl:
          type: string
        loaderUrl:
          type: string
        gameUrl:
          type: string
          pattern: ^/runtime/content/game/[0-9a-f]{64}/[^/?#]+$
        biosUrl:
          type: string
          nullable: true
          pattern: ^/runtime/content/bios/[0-9a-f]{64}/bundle\.zip$
        parentUrl:
          type: string
          nullable: true
          pattern: ^/runtime/content/parent/[0-9a-f]{64}/bundle\.zip$
        stateUrl:
          type: string
          nullable: true
        inputMode:
          type: string
          enum:
            - STANDARD
            - POINTER
        startupActions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/StartupAction'
        requiresThreads:
          type: boolean
        runtimePathOverrides:
          type: object
          maxProperties: 8
          additionalProperties:
            type: string
        defaultCoreOptions:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
        externalFiles:
          type: object
          maxProperties: 16
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 1024
            pattern: ^/runtime/content/external/[0-9a-f]{64}/[^/?#]+$
        discSet:
          $ref: '#/components/schemas/DiscSet'
        dosEntry:
          type: string
          nullable: true
        warnings:
          type: array
          items:
            type: string
        returnTo:
          type: string
        reviewPreview:
          $ref: '#/components/schemas/ReviewPreviewConfig'
        netplay:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/NetplayLaunchConfig'
    NativeCheckpointProfile:
      type: string
      enum:
        - EASYRPG_V1
        - RPGMV_V1
        - RPGMZ_V1
    CheckpointUnavailableReason:
      type: string
      enum:
        - NOT_ON_MAP
        - SAVE_DISABLED
        - MESSAGE_ACTIVE
        - EVENT_ACTIVE
        - BUSY
        - RUNTIME_NOT_READY
        - RUNTIME_FAILED
        - CHECKPOINT_ALREADY_CREATED
        - NETPLAY_UNSUPPORTED
    CheckpointAvailability:
      type: object
      additionalProperties: false
      required:
        - available
        - reason
      properties:
        available:
          type: boolean
        reason:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CheckpointUnavailableReason'
      description: reason is null exactly when available is true and is required to be a stable enum when available is false.
    RpgCheckpointRestore:
      type: object
      additionalProperties: false
      required:
        - payloadKind
        - payloadUrl
      properties:
        payloadKind:
          $ref: ../components/common.yaml#/components/schemas/CheckpointPayloadKind
        payloadUrl:
          type: string
          pattern: ^/runtime/launches/[0-9a-f-]{36}/state$
    FileTreeSource:
      type: object
      additionalProperties: false
      required:
        - kind
        - indexUrl
      properties:
        kind:
          type: string
          enum:
            - FILE_TREE_V1
        indexUrl:
          type: string
          minLength: 1
          maxLength: 2048
    EasyRpgAdapterConfig:
      type: object
      additionalProperties: false
      required:
        - adapterKind
        - adapterId
        - engineMode
        - runtimeBaseUrl
        - projectRootUrl
        - projectIndexUrl
        - rtpSource
        - checkpointSlot
      properties:
        adapterKind:
          type: string
          enum:
            - EASYRPG_WEB
        adapterId:
          type: string
          enum:
            - easyrpg-web
        engineMode:
          type: string
          enum:
            - rpg2k
            - rpg2k3
        runtimeBaseUrl:
          type: string
          minLength: 1
          maxLength: 2048
        projectRootUrl:
          type: string
          minLength: 1
          maxLength: 2048
        projectIndexUrl:
          type: string
          minLength: 1
          maxLength: 2048
        rtpSource:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FileTreeSource'
        checkpointSlot:
          type: integer
          enum:
            - 100
    MkxpCoreArtifact:
      type: object
      additionalProperties: false
      required:
        - jsUrl
        - jsSizeBytes
        - jsSha256
        - wasmUrl
        - wasmSizeBytes
        - wasmSha256
        - artifactSetSha256
      properties:
        jsUrl:
          type: string
          minLength: 1
          maxLength: 2048
        jsSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1048576
        jsSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        wasmUrl:
          type: string
          minLength: 1
          maxLength: 2048
        wasmSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 67108864
        wasmSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        artifactSetSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    SeekableBlobSource:
      type: object
      additionalProperties: false
      required:
        - kind
        - rangeRequired
        - url
        - sha256
        - sizeBytes
      properties:
        kind:
          type: string
          enum:
            - SEEKABLE_BLOB_V1
        rangeRequired:
          type: boolean
          enum:
            - true
        url:
          type: string
          minLength: 1
          maxLength: 2048
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
    MkxpRtpArchive:
      type: object
      additionalProperties: false
      required:
        - declaredName
        - kind
        - rangeRequired
        - url
        - sha256
        - sizeBytes
      properties:
        declaredName:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          type: string
          enum:
            - SEEKABLE_BLOB_V1
        rangeRequired:
          type: boolean
          enum:
            - true
        url:
          type: string
          minLength: 1
          maxLength: 2048
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
    MkxpAdapterConfig:
      type: object
      additionalProperties: false
      required:
        - adapterKind
        - adapterId
        - core
        - runtimeBaseUrl
        - projectArchive
        - rtpArchives
        - rgssVersion
        - stateBufferBytes
      properties:
        adapterKind:
          type: string
          enum:
            - MKXP_LIBRETRO_WEB
        adapterId:
          type: string
          enum:
            - mkxp-libretro-web
        core:
          $ref: '#/components/schemas/MkxpCoreArtifact'
        runtimeBaseUrl:
          type: string
          minLength: 1
          maxLength: 2048
        projectArchive:
          $ref: '#/components/schemas/SeekableBlobSource'
        rtpArchives:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/MkxpRtpArchive'
        rgssVersion:
          type: integer
          enum:
            - 1
            - 2
            - 3
        stateBufferBytes:
          type: integer
          enum:
            - 268435456
    NativeWebAdapterConfig:
      type: object
      additionalProperties: false
      required:
        - adapterKind
        - adapterId
        - bridgeProfile
        - uniqueOrigin
        - bootstrapUrl
        - bootstrapTicket
      properties:
        adapterKind:
          type: string
          enum:
            - NATIVE_WEB
        adapterId:
          type: string
          enum:
            - native-web
        bridgeProfile:
          type: string
          enum:
            - RPGMV
            - RPGMZ
        uniqueOrigin:
          type: string
          format: uri
          pattern: ^https?://[^/?#]+$
        bootstrapUrl:
          type: string
          format: uri
          pattern: ^https?://[^/?#]+/__retrom/bootstrap$
        bootstrapTicket:
          type: string
          minLength: 43
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
    RpgAdapterConfig:
      oneOf:
        - $ref: '#/components/schemas/EasyRpgAdapterConfig'
        - $ref: '#/components/schemas/MkxpAdapterConfig'
        - $ref: '#/components/schemas/NativeWebAdapterConfig'
      discriminator:
        propertyName: adapterKind
        mapping:
          EASYRPG_WEB: '#/components/schemas/EasyRpgAdapterConfig'
          MKXP_LIBRETRO_WEB: '#/components/schemas/MkxpAdapterConfig'
          NATIVE_WEB: '#/components/schemas/NativeWebAdapterConfig'
    RpgMakerLaunchConfig:
      type: object
      additionalProperties: false
      required:
        - runtimeFamily
        - protocolVersion
        - mode
        - purpose
        - launchId
        - coreId
        - coreName
        - gameTitle
        - platformName
        - returnTo
        - warnings
        - generation
        - routeKey
        - artifactId
        - checkpoint
        - checkpointAvailability
        - runtimeValidation
        - adapter
      properties:
        runtimeFamily:
          type: string
          enum:
            - RPGMAKER
        protocolVersion:
          type: integer
          enum:
            - 1
        mode:
          type: string
          enum:
            - single
        purpose:
