          "favorite": {
            "type": "boolean"
          },
          "lastPlayedAtMs": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "nullable": true
          },
          "createdAtMs": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "updatedAtMs": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      },
      "GameDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "game",
          "files",
          "coreIds",
          "defaultCoreId",
          "runtimeConfig",
