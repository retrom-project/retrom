components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: retrom_session
  schemas:
    EmptyRequest:
      type: object
      additionalProperties: false
    TagReference:
      type: object
      additionalProperties: false
      required:
        - tagId
        - name
      properties:
        tagId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
    ClientCapabilities:
      type: object
      additionalProperties: false
      required:
        - secureContext
        - crossOriginIsolated
        - sharedArrayBuffer
      properties:
        secureContext:
          type: boolean
        crossOriginIsolated:
          type: boolean
        sharedArrayBuffer:
          type: boolean
    RpgGeneration:
      type: string
      enum:
        - RPG2000
        - RPG2003
        - RPGXP
        - RPGVX
        - RPGVXACE
        - RPGMV
        - RPGMZ
    RpgCoreID:
      type: string
      enum:
        - rpgmaker_2000
        - rpgmaker_2003
        - rpgmaker_xp
        - rpgmaker_vx
        - rpgmaker_vx_ace
        - rpgmaker_mv
        - rpgmaker_mz
    CheckpointPayloadKind:
      type: string
      enum:
        - RUNTIME_STATE
        - NATIVE_SAVE_BUNDLE_V1
        - ONS_SAVE_BUNDLE_V1
        - KIRIKIRI_SAVE_BUNDLE_V1
    RpgRuntimeValidationState:
      type: string
      enum:
        - CREATED
        - STARTING
        - RUNNING
        - CHECKPOINTED
        - RESTORED
        - AWAITING_DECISION
        - PASSED
        - FAILED
        - EXPIRED
    RpgRuntimeGate:
      type: string
      enum:
        - RUNTIME_READY
        - ENGINE_PROFILE
        - FRAMES_300
        - INPUT
        - AUDIO
        - INITIAL_POSITION_RECORDED
        - SAVE_POINT_RECORDED
        - CHECKPOINT_CREATED
        - POST_SAVE_STATE_DIVERGED
        - ORIGINAL_LAUNCH_ENDED
        - RESTORE_STARTED
        - RESTORE_POSITION_VERIFIED
        - RESTORE_SCREENSHOT
        - RESTORE_INPUT
    EmptyGateEvidence:
      type: object
      additionalProperties: false
    RpgPositionEvidence:
      type: object
      additionalProperties: false
      required:
        - mapId
        - playerX
        - playerY
        - fixtureState
      properties:
        mapId:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        playerX:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
        playerY:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
        fixtureState:
          type: integer
          format: int64
          minimum: -2147483648
          maximum: 2147483647
    RpgEngineProfileEvidence:
      type: object
      additionalProperties: false
      required:
        - generation
        - adapterId
        - engineProfile
      properties:
        generation:
          $ref: '#/components/schemas/RpgGeneration'
        adapterId:
          type: string
          enum:
            - easyrpg-web
            - mkxp-libretro-web
            - native-web
        engineProfile:
          type: string
          enum:
            - rpg2k
            - rpg2k3
            - rgss1
            - rgss2
            - rgss3
            - RPGMV
            - RPGMZ
    RpgFrameEvidence:
      type: object
      additionalProperties: false
      required:
        - continuousFrames
      properties:
        continuousFrames:
          type: integer
          minimum: 300
          maximum: 36000
    RpgBooleanGateEvidence:
      type: object
      additionalProperties: false
      required:
        - observed
      properties:
        observed:
          type: boolean
          enum:
            - true
    RpgCheckpointGateEvidence:
      type: object
      additionalProperties: false
      required:
        - payloadKind
        - sizeBytes
        - sha256
      properties:
        payloadKind:
          $ref: '#/components/schemas/CheckpointPayloadKind'
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 268435456
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    RpgRuntimeGateEvidence:
      oneOf:
        - $ref: '#/components/schemas/EmptyGateEvidence'
        - $ref: '#/components/schemas/RpgPositionEvidence'
        - $ref: '#/components/schemas/RpgEngineProfileEvidence'
        - $ref: '#/components/schemas/RpgFrameEvidence'
        - $ref: '#/components/schemas/RpgBooleanGateEvidence'
        - $ref: '#/components/schemas/RpgCheckpointGateEvidence'
      description: BEGIN and screenshot association use the empty object. The registry requires position evidence for INITIAL_POSITION_RECORDED, SAVE_POINT_RECORDED, POST_SAVE_STATE_DIVERGED, RESTORE_POSITION_VERIFIED and RESTORE_INPUT and compares those values server-side; other PASS/FAIL evidence is gate-specific. Blob IDs are never accepted.
    RpgRuntimeMachineGate:
      type: object
      additionalProperties: false
      required:
        - gate
        - status
        - begunAtMs
        - completedAtMs
        - evidence
        - failureCode
      properties:
        gate:
          $ref: '#/components/schemas/RpgRuntimeGate'
        status:
          type: string
          enum:
            - NOT_STARTED
            - IN_PROGRESS
            - PASSED
            - FAILED
        begunAtMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        completedAtMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        evidence:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RpgRuntimeGateEvidence'
        failureCode:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RpgErrorCode'
    RuntimeCheckpointMetadata:
      type: object
      additionalProperties: false
      required:
        - payloadKind
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        discIndex:
          type: integer
          minimum: 0
          maximum: 7
          nullable: true
        payloadKind:
          $ref: '#/components/schemas/CheckpointPayloadKind'
      description: PRODUCT requires name after trim to contain 1..120 Unicode code points; RPG_RUNTIME_VALIDATION omits name. discIndex is required and in range only for a multi-disc PRODUCT Launch and otherwise omitted or null. nativeProfile and resumeSlot are never client authority; the server derives and validates them from the frozen artifact and payload.
    ReasonRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    MetadataFields:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        developer:
          type: string
          maxLength: 200
        publisher:
          type: string
          maxLength: 200
        genre:
          type: string
          maxLength: 200
        players:
          type: integer
          format: int64
          minimum: 1
          maximum: 64
          nullable: true
        releaseYear:
          type: integer
          format: int64
          minimum: 1950
          nullable: true
    MetadataProviderRequest:
      type: object
      additionalProperties: false
      required:
        - metadataProvider
      properties:
        metadataProvider:
          type: string
          enum:
            - HASHEOUS
            - NONE
    PegasusItemFailureDetails:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - stage
        - operation
        - causeCode
        - technicalDetail
        - relativePath
        - observedFileCount
        - allowedFileCount
        - libraryImportJobId
        - libraryImportItemId
      properties:
        schemaVersion:
          type: integer
          format: int64
          enum:
            - 1
        stage:
          type: string
          enum:
            - SOURCE_COPY
            - SOURCE_ASSEMBLY
            - LIBRARY_IMPORT
            - RESULT_ATTACHMENT
            - METADATA
            - PUBLICATION
            - STORAGE
        operation:
          type: string
          maxLength: 80
        causeCode:
          type: string
          maxLength: 120
        technicalDetail:
          type: string
          maxLength: 2048
        relativePath:
          type: string
          maxLength: 4096
          nullable: true
        observedFileCount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        allowedFileCount:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        libraryImportJobId:
          type: string
          format: uuid
          nullable: true
        libraryImportItemId:
          type: string
          format: uuid
          nullable: true
    PegasusRuntimeDependency:
      type: object
      additionalProperties: false
      required:
        - kind
        - machine
        - requiredBy
        - expectedLogicalName
        - state
        - requiredEntries
      properties:
        kind:
          type: string
          enum:
            - PARENT
            - BIOS_OR_BASE
        machine:
          type: string
        requiredBy:
          type: string
          nullable: true
        expectedLogicalName:
          type: string
        state:
          type: string
          enum:
            - SATISFIED_BY_CONTENT
            - SATISFIED_EXTERNAL
            - HASH_WARNING
            - MISSING
            - MISMATCH
            - UNSUPPORTED
        requiredEntries:
          type: array
          items:
            type: string
    PegasusRuntimeBIOS:
      type: object
      additionalProperties: false
      required:
        - logicalName
        - requirementMode
        - conditionCode
        - installationStatus
      properties:
        logicalName:
          type: string
        requirementMode:
          type: string
          enum:
            - REQUIRED
            - OPTIONAL
            - CONDITIONAL
        conditionCode:
          type: string
          nullable: true
        installationStatus:
          type: string
          nullable: true
          enum:
            - MATCHED
            - HASH_WARNING
            - MISSING_ENTRY
            - INVALID
    PegasusRuntimeMissingDisc:
      type: object
      additionalProperties: false
      required:
        - ordinal
        - sourceReference
      properties:
        ordinal:
          type: integer
          format: int64
          minimum: 0
        sourceReference:
          type: string
    PegasusRuntimeCheck:
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - coreId
        - coreName
        - machine
        - missingEntries
        - mismatchedEntries
        - dependencies
        - bios
        - missingDiscs
      properties:
        status:
          type: string
          enum:
            - READY
            - BLOCKED
            - INCOMPATIBLE
        code:
          type: string
        coreId:
          type: string
        coreName:
          type: string
        machine:
          type: string
          nullable: true
        missingEntries:
          type: array
          items:
            type: string
        mismatchedEntries:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/PegasusRuntimeDependency'
        bios:
          type: array
          items:
            $ref: '#/components/schemas/PegasusRuntimeBIOS'
        missingDiscs:
          type: array
          items:
            $ref: '#/components/schemas/PegasusRuntimeMissingDisc'
    Session:
