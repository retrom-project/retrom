          },
          "url": {
            "type": "string"
          },
          "expiresAtMs": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      },
      "AccountLinkInspect": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "kind",
          "role",
          "expiresAtMs",
          "username"
        ],
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "invitation",
              "password_reset"
            ]
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "user"
            ]
          },
          "expiresAtMs": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "username": {
            "type": "string"
          }
        }
      },
      "CreateInvitationRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "role",
          "expiresInHours"
