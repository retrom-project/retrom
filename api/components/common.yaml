      "ReviewReadinessRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "gameIds"
        ],
        "properties": {
          "gameIds": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "coreId": {
            "type": "string",
            "pattern": "^[a-z0-9]+(?:[-_][a-z0-9]+)*$",
            "maxLength": 64,
            "description": "Optional allowed core to inspect; omitted batches use each game directory default."
          }
        }
      },
      "ReviewReadiness": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "version",
          "biosSatisfied",
          "error",
          "missingBios",
          "crcWarnings",
          "missingRomMembers"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "nullable": true
          },
          "biosSatisfied": {
            "type": "boolean",
            "nullable": true
          },
          "error": {
            "type": "object",
            "nullable": true,
            "additionalProperties": false,
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            }
          },
          "missingBios": {
            "type": "array",
            "description": "Only required BIOS absent from the current installation, as resolved by runtime for this game. Empty on success with no missing requirements or on error; inspect biosSatisfied/error first.",
            "items": {
              "$ref": "#/components/schemas/ReviewMissingBIOS"
            }
          },
          "crcWarnings": {
            "type": "array",
            "description": "CRC mismatches in ROM, Parent, or embedded BIOS members. Informational for manual approval and optional test play; quick approval must skip this game. Computed from current content and runtime facts, never persisted.",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "role",
                "file",
                "member",
                "expectedCRC32",
                "actualCRC32"
              ],
              "properties": {
                "role": {
                  "type": "string",
                  "enum": [
                    "ROM",
                    "PARENT",
                    "BIOS"
                  ]
                },
                "file": {
                  "type": "string"
                },
                "member": {
                  "type": "string"
                },
                "expectedCRC32": {
                  "type": "string",
                  "pattern": "^[0-9a-f]{8}$"
                },
                "actualCRC32": {
                  "type": "string",
                  "pattern": "^[0-9a-f]{8}$"
                }
              }
            }
          },
          "missingRomMembers": {
            "type": "array",
            "description": "Required DAT game/Parent members missing or incorrectly sized, and BIOS members missing or failing size/content digest verification. Invalid required BIOS blocks readiness and launch; ROM/Parent member auditing remains informational. Empty on error; check error first.",
            "items": {
              "$ref": "#/components/schemas/ReviewMissingROMMember"
            }
          }
        },
        "description": "Current saved configuration review checks for the selected allowed core (directory default if omitted). Failed checks have null biosSatisfied and a safe per-item error. Manual approval rechecks required files; CRC differences alone remain informational."
      },
      "ReviewReadinessList": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items"
        ],
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 100,
            "items": {
