      "DirectoryUpdateRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version",
          "platformId",
          "name",
          "slug",
          "description",
          "defaultCoreId",
          "coreIds",
          "enabled"
        ],
        "properties": {
          "version": {
            "type": "integer",
