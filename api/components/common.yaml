        "type": "object",
        "additionalProperties": false,
        "required": [
          "token",
          "username",
          "displayName",
          "password"
        ],
        "properties": {
          "token": {
            "type": "string"
          },
          "username": {
            "type": "string"
          },
          "displayName": {
            "type": "string"
          },
          "password": {
            "type": "string",
            "minLength": 12
          }
        }
      },
      "PasswordResetRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "token",
          "newPassword"
        ],
        "properties": {
          "token": {
            "type": "string"
          },
          "newPassword": {
            "type": "string",
            "minLength": 12
          }
        }
      },
