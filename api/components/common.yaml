        "properties": {
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "displayName": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "user"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "disabled",
              "deleted"
            ]
          }
        }
      },
      "VersionRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      },
      "Platform": {
        "type": "object",
