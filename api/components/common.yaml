          "platformInstanceId": {
            "type": "string",
            "format": "uuid"
          },
          "platformId": {
            "type": "string"
          },
          "directoryName": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "developer": {
            "type": "string"
          },
          "publisher": {
            "type": "string"
          },
          "genre": {
            "type": "string"
          },
          "players": {
            "type": "string",
            "nullable": true,
            "maxLength": 64
          },
          "releaseYear": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "nullable": true
          },
          "status": {
            "type": "string",
            "enum": [
              "pending_review",
              "published"
            ]
          },
          "source": {
            "type": "string",
            "enum": [
              "server_import"
            ]
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "contentHash": {
            "type": "string"
