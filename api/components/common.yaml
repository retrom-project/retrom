      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "User": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "username",
          "displayName",
          "role",
          "status",
          "version",
          "createdAtMs",
          "lastLoginAtMs"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "username": {
            "type": "string"
          },
          "displayName": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "user"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "disabled",
              "deleted"
            ]
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "createdAtMs": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "lastLoginAtMs": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "nullable": true
          }
        }
      },
      "AuthContext": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "initialized",
          "user",
          "csrfToken"
        ],
        "properties": {
          "initialized": {
            "type": "boolean"
          },
          "user": {
            "allOf": [
              {
                "$ref": "#/components/schemas/User"
              }
            ],
            "nullable": true
          },
          "csrfToken": {
            "type": "string"
          }
        }
      },
      "LoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string"
          },
          "password": {
            "type": "string",
            "minLength": 1
          }
        }
      },
      "InitializeRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "displayName",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string"
          },
          "displayName": {
            "type": "string"
          },
          "password": {
            "type": "string",
            "minLength": 12
          }
        }
      },
      "PasswordRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "currentPassword",
