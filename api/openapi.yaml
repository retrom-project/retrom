        '202': { $ref: '#/components/responses/PegasusImportResponse' }
  /api/v1/admin/bios/{requirementId}/installations:
    parameters: [{ $ref: '#/components/parameters/RequirementID' }]
    post:
      operationId: postAdminBIOSInstallation
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
