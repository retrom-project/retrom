      responses:
        '200': { $ref: '#/components/responses/LaunchConfigResponse' }
  /runtime/launches/{launchId}/start:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeLaunchStart
      requestBody: { $ref: '#/components/requestBodies/PlayEvent' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/heartbeat:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeLaunchHeartbeat
      requestBody: { $ref: '#/components/requestBodies/PlayEvent' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/finish:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeLaunchFinish
      requestBody: { $ref: '#/components/requestBodies/PlayEvent' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/player-events:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeMultiDiscPlayerEvent
      description: Records a closed, low-cardinality multi-disc Player result after validating the Launch cookie. Names, paths, hashes, and capabilities are not accepted.
      requestBody: { $ref: '#/components/requestBodies/MultiDiscPlayerEvent' }
      responses:
        '204': { description: Event accepted }
  /runtime/launches/{launchId}/save-states:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeSaveState
      x-retrom-streaming-body: true
      description: Creates either a product SaveState or the single temporary checkpoint of an RPG_RUNTIME_VALIDATION Launch. The metadata part is strict RuntimeCheckpointMetadata JSON; authoritative artifact, user, content revision, adapter ABI and dependency bindings always come from the Launch. Total multipart input is capped at 270 MiB only on this route.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                metadata:
                  type: string
                  description: UTF-8 JSON serialized from RuntimeCheckpointMetadata; duplicate or unknown JSON fields are rejected.
                payload: { type: string, format: binary }
                screenshot: { type: string, format: binary }
              required: [metadata, payload]
            encoding:
              metadata: { contentType: application/json }
              payload: { contentType: application/octet-stream }
              screenshot: { contentType: 'image/png, image/jpeg, image/webp' }
      responses:
        '201': { $ref: '#/components/responses/RuntimeCheckpointCreateResponse' }
        '409': { $ref: '#/components/responses/RpgConflictResponse' }
        '413': { $ref: '#/components/responses/RequestTooLargeResponse' }
        '422': { $ref: '#/components/responses/RpgUnprocessableResponse' }
  /runtime/launches/{launchId}/checkpoint-status:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      security: []
      operationId: getRuntimeCheckpointStatus
      description: Returns the frozen payload kind and the most recent ordered adapter availability projection; immediate Player state remains driven by adapter events.
      responses:
        '200': { $ref: '#/components/responses/CheckpointStatusResponse' }
        '409': { $ref: '#/components/responses/RpgConflictResponse' }
  /runtime/launches/{launchId}/rpgmaker-gates/events:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeRpgMakerGateEvent
      description: Accepts strictly ordered, event-idempotent gates only from an RPG_RUNTIME_VALIDATION Launch. Positional gates are compared server-side so restore must equal the saved map/coordinates/fixture state and differ from the post-save state.
      requestBody: { $ref: '#/components/requestBodies/RpgMakerGateEvent' }
      responses:
        '200': { $ref: '#/components/responses/RpgMakerGateEventResponse' }
        '408': { $ref: '#/components/responses/RpgTimeoutResponse' }
        '409': { $ref: '#/components/responses/RpgConflictResponse' }
        '422': { $ref: '#/components/responses/RpgUnprocessableResponse' }
  /runtime/content/game/{contentIdentity}/{logicalName}:
    parameters: [{ $ref: '#/components/parameters/ContentIdentity' }, { $ref: '#/components/parameters/LogicalName' }]
    get:
      security: []
      operationId: getRuntimeGame
      description: Streams only an active Launch content grant's exact content-addressed game object. Multi-disc playlist.m3u uses audio/x-mpegurl with the common single-Range contract. Responses are private immutable and retain strong ETag validation.
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      security: []
      operationId: headRuntimeGame
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/content/external/{contentIdentity}/{logicalName}:
    parameters: [{ $ref: '#/components/parameters/ContentIdentity' }, { $ref: '#/components/parameters/LogicalName' }]
    get:
      security: []
      operationId: getRuntimeExternalFile
      description: Streams only an active Launch content grant's exact content-addressed BIOS or canonical disc-NNN.chd external file with the common single-Range contract.
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      security: []
      operationId: headRuntimeExternalFile
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/content/bios/{contentIdentity}/bundle.zip:
    parameters: [{ $ref: '#/components/parameters/ContentIdentity' }]
    get:
      security: []
      operationId: getRuntimeBIOSBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      security: []
      operationId: headRuntimeBIOSBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/content/parent/{contentIdentity}/bundle.zip:
    parameters: [{ $ref: '#/components/parameters/ContentIdentity' }]
    get:
      security: []
      operationId: getRuntimeParentBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      security: []
      operationId: headRuntimeParentBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/state:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      security: []
      operationId: getRuntimeState
      description: Streams only the frozen binary checkpoint payload after compatibility validation; success never wraps bytes in JSON.
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
        '409': { $ref: '#/components/responses/RpgConflictResponse' }
    head:
      security: []
      operationId: headRuntimeState
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/review-screenshot:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeReviewScreenshot
      x-retrom-streaming-body: true
      description: Stores one bounded PNG using the path-scoped capability. The legacy branch accepts a current non-RPG review preview after five seconds, creates a review-runtime screenshot asset, and returns that asset ID and URL. The RPG branch accepts only the current validation's distinct restore Launch after the original Launch ended and RESTORE_POSITION_VERIFIED passed, binds the PNG directly to the validation's immutable restore evidence, and returns the validation ID as screenshotId and review-asset URL. The original validation Launch, ordinary published Launch sessions, expired capabilities, duplicate evidence, and binding drift cannot use this route.
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: retrom_session
  schemas:
    StorageAnalysis:
      type: object
      additionalProperties: false
      required: [scope, generatedAtMs, totals, categories, details, excluded]
      properties:
        scope: { type: string, enum: [REGISTERED_CAS_PAYLOAD_V1] }
        generatedAtMs: { type: integer, format: int64, minimum: 0 }
        totals: { $ref: '#/components/schemas/StorageAnalysisTotals' }
        categories:
          type: array
          minItems: 9
          maxItems: 9
          items: { $ref: '#/components/schemas/StorageAnalysisCategory' }
        details: { $ref: '#/components/schemas/StorageAnalysisDetails' }
        excluded:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: string
            enum: [DATABASE_FILES, UPLOAD_PARTS, JOB_SCRATCH, DEPENDENCY_ROOT, FILESYSTEM_OVERHEAD, UNREGISTERED_ORPHANS, VOLUME_FREE_SPACE]
    StorageAnalysisTotals:
      type: object
      additionalProperties: false
      required: [registeredBytes, protectedBytes, unreferencedBytes, blobCount]
      properties:
        registeredBytes: { type: string, pattern: '^[0-9]+$' }
        protectedBytes: { type: string, pattern: '^[0-9]+$' }
        unreferencedBytes: { type: string, pattern: '^[0-9]+$' }
        blobCount: { type: integer, format: int64, minimum: 0 }
    StorageAnalysisCategory:
      type: object
      additionalProperties: false
      required: [code, bytes, blobCount]
      properties:
        code:
          type: string
          enum: [GAME_CONTENT, BIOS, SAVES, MEDIA, WORKFLOW, RUNTIME_SNAPSHOT, SHARED_DURABLE, OTHER_REFERENCED, UNREFERENCED]
        bytes: { type: string, pattern: '^[0-9]+$' }
        blobCount: { type: integer, format: int64, minimum: 0 }
    StorageAnalysisDetails:
      type: object
      additionalProperties: false
      required: [saveStates, cleanupCandidates]
      properties:
        saveStates: { $ref: '#/components/schemas/StorageAnalysisSaveStates' }
        cleanupCandidates: { $ref: '#/components/schemas/StorageAnalysisCleanupCandidates' }
    StorageAnalysisSaveStates:
      type: object
      additionalProperties: false
      required: [activeCount, deletedCount, stateReferenceBytes, screenshotReferenceBytes]
      properties:
        activeCount: { type: integer, format: int64, minimum: 0 }
        deletedCount: { type: integer, format: int64, minimum: 0 }
        stateReferenceBytes: { type: string, pattern: '^[0-9]+$' }
        screenshotReferenceBytes: { type: string, pattern: '^[0-9]+$' }
    StorageAnalysisCleanupCandidates:
      type: object
      additionalProperties: false
      required: [blobCount, bytes]
      properties:
        blobCount: { type: integer, format: int64, minimum: 0 }
        bytes: { type: string, pattern: '^[0-9]+$' }
    StorageCleanupResult:
      type: object
      additionalProperties: false
      required: [scheduledBlobCount, scheduledBytes, acceptedAtMs]
      properties:
        scheduledBlobCount: { type: integer, format: int64, minimum: 0 }
        scheduledBytes: { type: string, pattern: '^[0-9]+$' }
        acceptedAtMs: { type: integer, format: int64, minimum: 0 }
    ImportOverviewSummary:
      type: object
      additionalProperties: false
      required: [running, reviewPending, publishedItems, completed, failed, ordinaryFailed, pegasusFailed, emulationStationFailed, processingItems, issueItems]
      properties:
        running:
          type: integer
          format: int64
          minimum: 0
          description: User-visible non-terminal batches, counting each browser/reconfigure ImportJob or Pegasus import once.
        reviewPending:
          type: integer
          format: int64
          minimum: 0
          description: ImportItems whose current state is exactly REVIEW_PENDING.
        publishedItems:
          type: integer
          format: int64
          minimum: 0
          description: ImportItems whose current state is exactly PUBLISHED.
        completed:
          type: integer
          format: int64
          minimum: 0
          description: User-visible completed batches, counting each browser/reconfigure ImportJob or Pegasus import once.
        failed:
          type: integer
          format: int64
          minimum: 0
          description: User-visible batches in PARTIAL_FAILURE or FAILED; cancelled batches are excluded.
        ordinaryFailed:
          type: integer
          format: int64
          minimum: 0
          description: Browser/reconfigure ImportJobs included in failed.
        pegasusFailed:
          type: integer
          format: int64
          minimum: 0
          description: Pegasus imports included in failed.
        emulationStationFailed:
          type: integer
          format: int64
          minimum: 0
          description: EmulationStation imports included in failed.
        processingItems:
          type: integer
          format: int64
          minimum: 0
          description: Known game/item count in currently non-terminal user-visible batches.
        issueItems:
          type: integer
          format: int64
          minimum: 0
          description: Failed or blocked items plus unresolved rejected files in user-visible attention batches.
    AuthInitializeRequest:
      type: object
      additionalProperties: false
      required: [setupCode, username, displayName, password, passwordConfirmation]
      properties:
        setupCode: { type: string, minLength: 43, maxLength: 43 }
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, minLength: 1, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 512 }
        passwordConfirmation: { type: string, minLength: 1, maxLength: 512 }
