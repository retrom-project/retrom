openapi: 3.0.3
info:
  title: Retrom HTTP API
  version: 1.0.0
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getHealthLive
      responses:
        '200': { $ref: '#/components/responses/HealthLiveResponse' }
  /health/ready:
    get:
      operationId: getHealthReady
      responses:
        '200': { $ref: '#/components/responses/HealthReadyResponse' }
        '503': { $ref: '#/components/responses/HealthNotReadyResponse' }
  /api/v1/session:
    get:
      operationId: getSession
      deprecated: true
      description: Legacy compatibility token; it is not used for authorization.
      responses:
        '200': { $ref: '#/components/responses/SessionResponse' }
  /api/v1/home:
    get:
      operationId: getHome
      description: Homepage aggregate from enabled platform directories. It includes library counters, the ten games with the most recently started play sessions, the ten most recently added published games ordered by game creation time, the latest started session's game with a save created by that exact launch when available, all supported platforms in deterministic order, and four quick platforms ranked by play-session count.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/recent-games:
    get:
      operationId: getRecentGames
      description: All visible games with play history, ordered by the newest play-session start, with aggregate active duration and session count. The response includes generatedAtMs so client-side day and rolling-window filters use the same clock as the server-rendered page.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/games:
    get:
      operationId: getGames
      description: Published game summaries from enabled platform directories. Each item includes its platform, directory, recommended core, created time, nullable latest play time and nullable primary cover URL; generatedAtMs gives client-side filtering and relative-time labels a stable response clock.
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/PlatformIDQuery' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/games/{gameId}:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    get:
      operationId: getGame
      description: Published game detail from an enabled platform directory; coverUrl is the nullable logical URL of the current metadata revision's primary COVER asset, saveStateCount is the total non-deleted save count, and saveStates contains at most the eight newest entries.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/saves:
    get:
      operationId: getSaves
      description: Save states whose games belong to enabled platform directories. Each item includes its base platform, platform directory, locked core, availability and screenshot URL; generatedAtMs gives grouped save views a stable response clock.
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/GameIDQuery' }, { $ref: '#/components/parameters/PlatformIDQuery' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/CoreIDQuery' }, { $ref: '#/components/parameters/Availability' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/saves/{saveStateId}:
    parameters: [{ $ref: '#/components/parameters/SaveStateID' }]
    patch:
      operationId: patchSave
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { $ref: '#/components/requestBodies/RenameSave' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    delete:
      operationId: deleteSave
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Deleted }
  /api/v1/launches:
    post:
      operationId: postLaunch
      description: Creates a launch only for a published game in an enabled platform directory.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Launch' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/uploads:
    post:
      operationId: postAdminUpload
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreateUpload' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/uploads/{uploadId}:
    parameters: [{ $ref: '#/components/parameters/UploadID' }]
    get:
      operationId: getAdminUpload
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    delete:
      operationId: deleteAdminUpload
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Cancelled }
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/uploads/{uploadId}/files/{fileId}/parts/{partNo}:
    parameters:
      - { $ref: '#/components/parameters/UploadID' }
      - { $ref: '#/components/parameters/FileID' }
      - { $ref: '#/components/parameters/PartNo' }
    put:
      operationId: putAdminUploadPart
      x-retrom-streaming-body: true
      parameters:
        - { $ref: '#/components/parameters/ContentRange' }
        - { $ref: '#/components/parameters/ContentDigest' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Stored }
  /api/v1/admin/uploads/{uploadId}/complete:
    parameters: [{ $ref: '#/components/parameters/UploadID' }]
    post:
      operationId: postAdminUploadComplete
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/imports/summary:
    get:
      operationId: getAdminImportsSummary
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/imports:
    get:
      operationId: getAdminImports
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/State' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit20' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    post:
      operationId: postAdminImport
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreateImport' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/imports/{importJobId}:
    parameters: [{ $ref: '#/components/parameters/ImportJobID' }]
    get:
      operationId: getAdminImport
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/imports/{importJobId}/events:
    parameters: [{ $ref: '#/components/parameters/ImportJobID' }]
    get:
      operationId: getAdminImportEvents
      parameters: [{ $ref: '#/components/parameters/LastEventID' }]
      responses:
        '200': { $ref: '#/components/responses/SSEResponse' }
  /api/v1/admin/imports/{importJobId}/cancel:
    parameters: [{ $ref: '#/components/parameters/ImportJobID' }]
    post:
      operationId: postAdminImportCancel
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/imports/{importJobId}/reconfigure:
    parameters: [{ $ref: '#/components/parameters/ImportJobID' }]
    post:
      operationId: postAdminImportReconfigure
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ReconfigureImport' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/import-items/{importItemId}/retry:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminImportItemRetry
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/jobs/{jobId}:
    parameters: [{ $ref: '#/components/parameters/JobID' }]
    get:
      operationId: getAdminJob
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/jobs/{jobId}/events:
    parameters: [{ $ref: '#/components/parameters/JobID' }]
    get:
      operationId: getAdminJobEvents
      parameters: [{ $ref: '#/components/parameters/LastEventID' }]
      responses:
        '200': { $ref: '#/components/responses/SSEResponse' }
  /api/v1/admin/jobs/{jobId}/cancel:
    parameters: [{ $ref: '#/components/parameters/JobID' }]
    post:
      operationId: postAdminJobCancel
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/jobs/{jobId}/retry:
    parameters: [{ $ref: '#/components/parameters/JobID' }]
    post:
      operationId: postAdminJobRetry
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews:
    get:
      operationId: getAdminReviews
      description: Pending review summaries including sourceTotalSizeBytes, sourceMd5, and a nullable coverUrl for compact queue previews.
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/ImportJobIDQuery' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/BlockerCode' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit20' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    get:
      operationId: getAdminReview
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    patch:
      operationId: patchAdminReview
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { $ref: '#/components/requestBodies/ReviewDraft' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/scrape-candidates:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewScrapeCandidates
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/MetadataProvider' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/assets:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewAsset
      description: Validates a completed local image upload and records an immutable manual review asset. Selection is persisted separately through the review draft PATCH.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ReviewAsset' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/arcade-parent-attachments:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewArcadeParentAttachment
      description: Queues strict validation of one completed ZIP upload against a missing or mismatched Parent machine in the review draft's locked Arcade DAT closure.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ReviewArcadeParentAttachment' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/approve:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewApprove
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Approval' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/discard:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewDiscard
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ApprovalReason' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/review-history:
    get:
      operationId: getAdminReviewHistory
      description: Review decision summaries; selecting a row can load the immutable metadata snapshot captured at decision time.
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/Decision' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/FromAtMs' }, { $ref: '#/components/parameters/ToAtMs' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/review-history/{reviewEventId}:
    parameters: [{ $ref: '#/components/parameters/ReviewEventID' }]
    get:
      operationId: getAdminReviewHistoryEvent
      description: Immutable before/after metadata and evidence captured for an approved or discarded review decision.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/games:
    get:
      operationId: getAdminGames
      description: Lists every managed game with platform/directory/default-core identity, cover, release year, metadata completeness, current default-core runtime status, visibility, creation/update/play timestamps, and cursor pagination.
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/PlatformIDQuery' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/games/{gameId}:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    get:
      operationId: getAdminGame
      description: Returns the complete management workbench projection and a generatedAtMs timestamp for deterministic relative-time presentation.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    patch:
      operationId: patchAdminGame
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { $ref: '#/components/requestBodies/MetadataFields' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    delete:
      operationId: deleteAdminGame
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/DeleteGame' }
      responses:
        '204': { description: Deleted }
  /api/v1/admin/games/{gameId}/assets:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    post:
      operationId: postAdminGameAsset
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/GameAsset' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/games/{gameId}/content-revisions:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    post:
      operationId: postAdminGameContentRevision
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/UploadReference' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/games/{gameId}/scrape-candidates:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    get:
      operationId: getAdminGameScrapeCandidates
      description: Returns the latest candidate metadata, evidence, hit counts, and candidate media assets for the current content revision.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    post:
      operationId: postAdminGameScrapeCandidates
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/MetadataProvider' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/games/{gameId}/scrape-candidates/{candidateId}/apply:
    parameters: [{ $ref: '#/components/parameters/GameID' }, { $ref: '#/components/parameters/CandidateID' }]
    post:
      operationId: postAdminGameScrapeCandidateApply
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ApplyCandidate' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/games/{gameId}/move-preview:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    post:
      operationId: postAdminGameMovePreview
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/MovePreview' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/games/{gameId}/move:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    post:
      operationId: postAdminGameMove
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/MoveGame' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/platforms:
    get:
      operationId: getAdminPlatforms
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/core-artifacts:
    get:
      operationId: getAdminCoreArtifacts
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/platform-instances:
    get:
      operationId: getAdminPlatformInstances
      description: Platform directory summaries ordered by sortOrder; each item includes gameCount so destructive and disable actions can be guarded in the UI.
      parameters: [{ $ref: '#/components/parameters/PlatformIDQuery' }, { $ref: '#/components/parameters/Enabled' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    post:
      operationId: postAdminPlatformInstance
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreatePlatformInstance' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/platform-instances/order:
    put:
      operationId: putAdminPlatformInstanceOrder
      description: Atomically replaces the visual order of all non-deleted platform directories using optimistic item versions.
      requestBody: { $ref: '#/components/requestBodies/ReorderPlatformInstances' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/platform-instances/{platformInstanceId}:
    parameters: [{ $ref: '#/components/parameters/PlatformInstanceID' }]
    get:
      operationId: getAdminPlatformInstance
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    patch:
      operationId: patchAdminPlatformInstance
      description: Updates directory fields; enabled controls user-side visibility and may be changed while the directory contains games.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { $ref: '#/components/requestBodies/PatchPlatformInstance' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    delete:
      operationId: deleteAdminPlatformInstance
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Deleted }
  /api/v1/admin/platform-instances/{platformInstanceId}/default-core-preview:
    parameters: [{ $ref: '#/components/parameters/PlatformInstanceID' }]
    post:
      operationId: postAdminPlatformDefaultCorePreview
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { $ref: '#/components/requestBodies/DefaultCorePreview' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/platform-instances/{platformInstanceId}/default-core:
    parameters: [{ $ref: '#/components/parameters/PlatformInstanceID' }]
    post:
      operationId: postAdminPlatformDefaultCore
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/DefaultCore' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/bios:
    get:
      operationId: getAdminBIOS
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/PlatformIDQuery' }, { $ref: '#/components/parameters/CoreIDQuery' }, { $ref: '#/components/parameters/CoreArtifactIDQuery' }, { $ref: '#/components/parameters/Scope' }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/bios/{requirementId}/installations:
    parameters: [{ $ref: '#/components/parameters/RequirementID' }]
    post:
      operationId: postAdminBIOSInstallation
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/InstallBIOS' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/bios/{requirementId}/entries:
    parameters: [{ $ref: '#/components/parameters/RequirementID' }]
    get:
      operationId: getAdminBIOSEntries
      description: Compare the active DAT-backed BIOS archive catalog with the exact DAT requirement version.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
        '404': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/arcade-dats:
    get:
      operationId: getAdminArcadeDATs
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/CoreIDQuery' }, { $ref: '#/components/parameters/CoreArtifactIDQuery' }, { $ref: '#/components/parameters/Source' }, { $ref: '#/components/parameters/ParseStatus' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    post:
      operationId: postAdminArcadeDAT
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreateDAT' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/arcade-dats/{datVersionId}/diff:
    parameters: [{ $ref: '#/components/parameters/DATVersionID' }]
    get:
      operationId: getAdminArcadeDATDiff
      parameters: [{ $ref: '#/components/parameters/Section' }, { $ref: '#/components/parameters/Change' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    post:
      operationId: postAdminArcadeDATDiff
      description: Queue or restart asynchronous materialization of the diff against the currently active DAT.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/arcade-dats/{datVersionId}/activate:
    parameters: [{ $ref: '#/components/parameters/DATVersionID' }]
    post:
      operationId: postAdminArcadeDATActivate
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ActivateDAT' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/arcade-dats/{datVersionId}/rollback:
    parameters: [{ $ref: '#/components/parameters/DATVersionID' }]
    post:
      operationId: postAdminArcadeDATRollback
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ActivateDAT' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/arcade-dats/{datVersionId}:
    parameters: [{ $ref: '#/components/parameters/DATVersionID' }]
    delete:
      operationId: deleteAdminArcadeDAT
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Deleted }
  /api/v1/admin/diagnostics:
    get:
      operationId: getAdminDiagnostics
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /content/assets/{assetId}:
    parameters: [{ $ref: '#/components/parameters/AssetID' }]
    get:
      operationId: getContentAsset
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headContentAsset
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /content/save-states/{saveStateId}/screenshot:
    parameters: [{ $ref: '#/components/parameters/SaveStateID' }]
    get:
      operationId: getSaveStateScreenshot
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headSaveStateScreenshot
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /api/v1/admin/review-assets/{assetId}:
    parameters: [{ $ref: '#/components/parameters/AssetID' }]
    get:
      operationId: getAdminReviewAsset
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headAdminReviewAsset
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/emulatorjs/{configuredVersion}/{runtimePath}:
    x-retrom-router-template: /runtime/emulatorjs/{configuredVersion}/{runtimePath:.+}
    parameters:
      - { $ref: '#/components/parameters/ConfiguredVersion' }
      - name: runtimePath
        in: path
        required: true
        schema: { type: string }
      - name: v
        in: query
        required: false
        description: EmulatorJS cache-buster; ignored for allowlist and file selection.
        schema: { type: string, maxLength: 128 }
    get:
      operationId: getRuntimeEmulatorJS
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headRuntimeEmulatorJS
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/config:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      operationId: getRuntimeLaunchConfig
      responses:
        '200': { $ref: '#/components/responses/LaunchConfigResponse' }
  /runtime/launches/{launchId}/start:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      operationId: postRuntimeLaunchStart
      requestBody: { $ref: '#/components/requestBodies/PlayEvent' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/heartbeat:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      operationId: postRuntimeLaunchHeartbeat
      requestBody: { $ref: '#/components/requestBodies/PlayEvent' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/finish:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      operationId: postRuntimeLaunchFinish
      requestBody: { $ref: '#/components/requestBodies/PlayEvent' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/save-states:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      operationId: postRuntimeSaveState
      x-retrom-streaming-body: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                metadata: { type: string }
                state: { type: string, format: binary }
                screenshot: { type: string, format: binary }
              required: [metadata, state, screenshot]
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/persistent-save:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      operationId: getRuntimePersistentSave
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
        '204': { description: No persistent save }
    put:
      operationId: putRuntimePersistentSave
      x-retrom-streaming-body: true
      parameters:
        - { $ref: '#/components/parameters/ContentDigest' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: X-Retrom-Save-Sequence
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: X-Retrom-Save-Event
          in: header
          required: true
          schema: { type: string, enum: [AUTO_INTERVAL, MANUAL_EXPORT, EXIT] }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/game/{logicalName}:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }, { $ref: '#/components/parameters/LogicalName' }]
    get:
      operationId: getRuntimeGame
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headRuntimeGame
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/external-files/{logicalName}:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }, { $ref: '#/components/parameters/LogicalName' }]
    get:
      operationId: getRuntimeExternalFile
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headRuntimeExternalFile
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/bios/bundle.zip:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      operationId: getRuntimeBIOSBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headRuntimeBIOSBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/parent/bundle.zip:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      operationId: getRuntimeParentBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headRuntimeParentBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/state:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      operationId: getRuntimeState
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headRuntimeState
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
components:
  schemas:
    EmptyRequest:
      type: object
      additionalProperties: false
    RenameSaveRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    LaunchRequest:
      type: object
      additionalProperties: false
      required: [gameId, coreId, saveStateId, dosEntry, returnTo, clientCapabilities]
      properties:
        gameId: { type: string, format: uuid }
        coreId: { type: string, nullable: true }
        saveStateId: { type: string, format: uuid, nullable: true }
        dosEntry: { type: string, nullable: true }
        returnTo: { type: string }
        clientCapabilities:
          type: object
          additionalProperties: false
          required: [secureContext, crossOriginIsolated, sharedArrayBuffer]
          properties:
            secureContext: { type: boolean }
            crossOriginIsolated: { type: boolean }
            sharedArrayBuffer: { type: boolean }
    StartupAction:
      type: object
      additionalProperties: false
      required: [event, kind, delayMs, player, control, durationMs]
      properties:
        event: { type: string, enum: [GAME_START] }
        kind: { type: string, enum: [PRESS_CONTROL] }
        delayMs: { type: integer, minimum: 0, maximum: 10000 }
        player: { type: integer, minimum: 0, maximum: 3 }
        control: { type: integer, minimum: 0, maximum: 255 }
        durationMs: { type: integer, minimum: 1, maximum: 1000 }
    LaunchConfig:
      type: object
      additionalProperties: false
      required: [launchId, emulatorjsVersion, playerAdapterId, core, runtimeCore, coreName,
        coreArtifactId, emulatorGameId, gameName, gameTitle, platformName, runtimeBaseUrl,
        loaderUrl, gameUrl, biosUrl, parentUrl, stateUrl, persistentSaveMode,
        persistentSaveUrl, inputMode, startupActions, requiresThreads, runtimePathOverrides,
        defaultCoreOptions, externalFiles, dosEntry, warnings, returnTo]
      properties:
        launchId: { type: string, format: uuid }
        emulatorjsVersion: { type: string }
        playerAdapterId: { type: string }
        core: { type: string }
        runtimeCore: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
        coreName: { type: string }
        coreArtifactId: { type: string, format: uuid }
        emulatorGameId: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        gameName: { type: string }
        gameTitle: { type: string }
        platformName: { type: string }
        runtimeBaseUrl: { type: string }
        loaderUrl: { type: string }
        gameUrl: { type: string }
        biosUrl: { type: string, nullable: true }
        parentUrl: { type: string, nullable: true }
        stateUrl: { type: string, nullable: true }
        persistentSaveMode: { type: string, enum: [SINGLE_FILE, DOS_OVERLAY, NONE] }
        persistentSaveUrl: { type: string, nullable: true }
        inputMode: { type: string, enum: [STANDARD, POINTER] }
        startupActions:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/StartupAction' }
        requiresThreads: { type: boolean }
        runtimePathOverrides:
          type: object
          maxProperties: 8
          additionalProperties: { type: string }
        defaultCoreOptions:
          type: object
          maxProperties: 32
          additionalProperties: { type: string }
        externalFiles:
          type: object
          maxProperties: 16
          propertyNames: { type: string, minLength: 1, maxLength: 512, pattern: '^/' }
          additionalProperties: { type: string, minLength: 1, maxLength: 1024 }
        dosEntry: { type: string, nullable: true }
        warnings: { type: array, items: { type: string } }
        returnTo: { type: string }
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [sourceType, files]
      properties:
        sourceType: { type: string, enum: [FILES, DIRECTORY] }
        files:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [clientFileId, relativePath, sizeBytes]
            properties:
              clientFileId: { type: string, maxLength: 200 }
              relativePath: { type: string, maxLength: 4096 }
              sizeBytes: { type: integer, format: int64, minimum: 0 }
    CreateImportRequest:
      type: object
      additionalProperties: false
      required: [uploadId, targetPlatformInstanceId, metadataProvider]
      properties:
        uploadId: { type: string, format: uuid }
        targetPlatformInstanceId: { type: string, format: uuid }
        metadataProvider: { type: string, enum: [HASHEOUS, NONE] }
    ReconfigureImportRequest:
      type: object
      additionalProperties: false
      required: [targetPlatformInstanceId, metadataProvider]
      properties:
        targetPlatformInstanceId: { type: string, format: uuid }
        metadataProvider: { type: string, enum: [HASHEOUS, NONE] }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 500 } }
    ApprovalReasonRequest:
      type: object
      additionalProperties: false
      properties: { reason: { type: string, nullable: true, maxLength: 500 } }
    ApprovalRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, nullable: true, maxLength: 500 }
        duplicatePolicy: { type: string, enum: [ALLOW_NEW] }
        acknowledgedGameIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    MetadataFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        developer: { type: string, maxLength: 200 }
        publisher: { type: string, maxLength: 200 }
        genre: { type: string, maxLength: 200 }
        players: { type: integer, format: int64, minimum: 1, maximum: 64, nullable: true }
        releaseYear: { type: integer, format: int64, minimum: 1950, nullable: true }
    SelectedAssetsRequest:
      type: object
      additionalProperties: false
      required: [coverCandidateAssetId, backgroundCandidateAssetId, screenshotCandidateAssetIds]
      properties:
        coverCandidateAssetId: { type: string, format: uuid, nullable: true }
        backgroundCandidateAssetId: { type: string, format: uuid, nullable: true }
        screenshotCandidateAssetIds: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, format: uuid } }
    ReviewSelectedAssetsRequest:
      type: object
      additionalProperties: false
      required: [coverCandidateAssetId, coverUploadedAssetId, backgroundCandidateAssetId, screenshotCandidateAssetIds]
      properties:
        coverCandidateAssetId: { type: string, format: uuid, nullable: true }
        coverUploadedAssetId: { type: string, format: uuid, nullable: true }
        backgroundCandidateAssetId: { type: string, format: uuid, nullable: true }
        screenshotCandidateAssetIds: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, format: uuid } }
    ReviewDraftRequest:
      type: object
      additionalProperties: false
      properties:
        targetPlatformInstanceId: { type: string, format: uuid }
        metadata: { $ref: '#/components/schemas/MetadataFields' }
        selectedValidationId: { type: string, format: uuid }
        selectedCandidateId: { type: string, format: uuid, nullable: true }
        selectedAssets: { $ref: '#/components/schemas/ReviewSelectedAssetsRequest' }
        defaultDosEntry: { type: string, nullable: true }
      minProperties: 1
    MetadataProviderRequest:
      type: object
      additionalProperties: false
      required: [metadataProvider]
      properties: { metadataProvider: { type: string, enum: [HASHEOUS, NONE] } }
    DeleteGameRequest:
      type: object
      additionalProperties: false
      required: [confirmTitle]
      properties: { confirmTitle: { type: string, minLength: 1, maxLength: 200 } }
    GameAssetRequest:
      type: object
      additionalProperties: false
      required: [uploadFileId, kind, ordinal]
      properties:
        uploadFileId: { type: string, format: uuid }
        kind: { type: string, enum: [COVER, BACKGROUND, SCREENSHOT] }
        ordinal: { type: integer, minimum: 0, maximum: 31 }
    ReviewAssetRequest:
      type: object
      additionalProperties: false
      required: [uploadFileId, kind]
      properties:
        uploadFileId: { type: string, format: uuid }
        kind: { type: string, enum: [COVER] }
    ReviewArcadeParentAttachmentRequest:
      type: object
      additionalProperties: false
      required: [validationId, baseSourceSnapshotId, dependencyMachine, uploadFileId]
      properties:
        validationId: { type: string, format: uuid }
        baseSourceSnapshotId: { type: string, format: uuid }
        dependencyMachine: { type: string, minLength: 1, maxLength: 255 }
        uploadFileId: { type: string, format: uuid }
    UploadReferenceRequest:
      type: object
      additionalProperties: false
      required: [uploadId]
      properties: { uploadId: { type: string, format: uuid } }
    ApplyCandidateRequest:
      type: object
      additionalProperties: false
      required: [fields, selectedAssets]
      properties:
        fields:
          type: array
          uniqueItems: true
          items: { type: string, enum: [title, description, developer, publisher, genre, players, releaseYear] }
        selectedAssets: { $ref: '#/components/schemas/SelectedAssetsRequest' }
    MovePreviewRequest:
      type: object
      additionalProperties: false
      required: [targetPlatformInstanceId]
      properties: { targetPlatformInstanceId: { type: string, format: uuid } }
    MoveGameRequest:
      type: object
      additionalProperties: false
      required: [targetPlatformInstanceId, impactDigest, confirmBlocked]
      properties:
        targetPlatformInstanceId: { type: string, format: uuid }
        impactDigest: { type: string }
        confirmBlocked: { type: boolean }
    CreatePlatformInstanceRequest:
      type: object
      additionalProperties: false
      required: [platformId, defaultCoreId, name, description, sortOrder]
      properties:
        platformId: { type: string }
        defaultCoreId: { type: string }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        sortOrder: { type: integer, format: int64 }
    PatchPlatformInstanceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        sortOrder: { type: integer, format: int64 }
        enabled: { type: boolean }
    ReorderPlatformInstanceItem:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
    ReorderPlatformInstancesRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ReorderPlatformInstanceItem' }
    DefaultCorePreviewRequest:
      type: object
      additionalProperties: false
      required: [coreId]
      properties:
        coreId: { type: string }
        cursor: { type: string, nullable: true, maxLength: 8192 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    DefaultCoreRequest:
      type: object
      additionalProperties: false
      required: [coreId, impactDigest, confirmBlocked]
      properties:
        coreId: { type: string }
        impactDigest: { type: string }
        confirmBlocked: { type: boolean }
    InstallBIOSRequest:
      type: object
      additionalProperties: false
      required: [uploadFileId]
      properties: { uploadFileId: { type: string, format: uuid } }
    CreateDATRequest:
      type: object
      additionalProperties: false
      required: [uploadFileId, coreArtifactId]
      properties:
        uploadFileId: { type: string, format: uuid }
        coreArtifactId: { type: string, format: uuid }
    ActivateDATRequest:
      type: object
      additionalProperties: false
      required: [impactDigest, confirmBlocked, confirmUnknownCompatibility]
      properties:
        impactDigest: { type: string }
        confirmBlocked: { type: boolean }
        confirmUnknownCompatibility: { type: boolean }
    PlayEventRequest:
      type: object
      additionalProperties: false
      required: [clientSequence, clientObservedAtMs, previousInterval]
      properties:
        clientSequence: { type: integer, format: int64, minimum: 0 }
        clientObservedAtMs: { type: integer, format: int64, minimum: 0 }
        previousInterval:
          nullable: true
          allOf:
            - type: object
              additionalProperties: false
              required: [running, visible, paused]
              properties:
                running: { type: boolean }
                visible: { type: boolean }
                paused: { type: boolean }
    HealthLive:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    HealthReady:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ready] }
    HealthNotReady:
      type: object
