    get:
      operationId: getAdminArcadeDATDiff
      parameters: [{ $ref: '#/components/parameters/Section' }, { $ref: '#/components/parameters/Change' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    post:
      operationId: postAdminArcadeDATDiff
      description: Queue or restart asynchronous materialization of the diff against the currently active DAT.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
