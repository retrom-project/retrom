        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/arcade-dats/{datVersionId}/rollback:
    parameters: [{ $ref: '#/components/parameters/DATVersionID' }]
    post:
      operationId: postAdminArcadeDATRollback
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ActivateDAT' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/arcade-dats/{datVersionId}:
    parameters: [{ $ref: '#/components/parameters/DATVersionID' }]
    delete:
      operationId: deleteAdminArcadeDAT
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Deleted }
  /api/v1/admin/diagnostics:
    get:
      operationId: getAdminDiagnostics
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /content/assets/{assetId}:
    parameters: [{ $ref: '#/components/parameters/AssetID' }]
    get:
      operationId: getContentAsset
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headContentAsset
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /content/save-states/{saveStateId}/screenshot:
    parameters: [{ $ref: '#/components/parameters/SaveStateID' }]
    get:
      operationId: getSaveStateScreenshot
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headSaveStateScreenshot
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /api/v1/admin/review-assets/{assetId}:
    parameters: [{ $ref: '#/components/parameters/AssetID' }]
    get:
      operationId: getAdminReviewAsset
      parameters: [{ $ref: '#/components/parameters/ReviewSourceMediaKind' }]
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      operationId: headAdminReviewAsset
      parameters: [{ $ref: '#/components/parameters/ReviewSourceMediaKind' }]
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/emulatorjs/{configuredVersion}/{runtimePath}:
    x-retrom-router-template: /runtime/emulatorjs/{configuredVersion}/{runtimePath:.+}
    parameters:
      - { $ref: '#/components/parameters/ConfiguredVersion' }
      - name: runtimePath
        in: path
        required: true
        schema: { type: string }
      - name: v
        in: query
        required: false
        description: EmulatorJS cache-buster; ignored for allowlist and file selection.
        schema: { type: string, maxLength: 128 }
    get:
      security: []
      operationId: getRuntimeEmulatorJS
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      security: []
      operationId: headRuntimeEmulatorJS
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/config:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      security: []
      operationId: getRuntimeLaunchConfig
      responses:
        '200': { $ref: '#/components/responses/LaunchConfigResponse' }
  /runtime/launches/{launchId}/start:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeLaunchStart
      requestBody: { $ref: '#/components/requestBodies/PlayEvent' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/heartbeat:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeLaunchHeartbeat
      requestBody: { $ref: '#/components/requestBodies/PlayEvent' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/finish:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeLaunchFinish
      requestBody: { $ref: '#/components/requestBodies/PlayEvent' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/player-events:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeMultiDiscPlayerEvent
      description: Records a closed, low-cardinality multi-disc Player result after validating the Launch cookie. Names, paths, hashes, and capabilities are not accepted.
      requestBody: { $ref: '#/components/requestBodies/MultiDiscPlayerEvent' }
      responses:
        '204': { description: Event accepted }
  /runtime/launches/{launchId}/save-states:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeSaveState
      x-retrom-streaming-body: true
      description: The metadata part is strict JSON `{name,discIndex}`. discIndex is required and in range for a multi-disc launch, and must be null or omitted for single-file/DOS launches.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                metadata: { type: string }
                state: { type: string, format: binary }
                screenshot: { type: string, format: binary }
              required: [metadata, state, screenshot]
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/persistent-save:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      security: []
      operationId: getRuntimePersistentSave
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
        '204': { description: No persistent save }
    put:
      security: []
      operationId: putRuntimePersistentSave
      x-retrom-streaming-body: true
      parameters:
        - { $ref: '#/components/parameters/ContentDigest' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: X-Retrom-Save-Sequence
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: X-Retrom-Save-Event
          in: header
          required: true
          schema: { type: string, enum: [AUTO_INTERVAL, MANUAL_EXPORT, EXIT] }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /runtime/launches/{launchId}/game/{logicalName}:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }, { $ref: '#/components/parameters/LogicalName' }]
    get:
      security: []
      operationId: getRuntimeGame
      description: Streams only the Launch-locked game object. Multi-disc playlist.m3u uses audio/x-mpegurl with the common single-Range contract.
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      security: []
      operationId: headRuntimeGame
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/external-files/{logicalName}:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }, { $ref: '#/components/parameters/LogicalName' }]
    get:
      security: []
      operationId: getRuntimeExternalFile
      description: Streams only a Launch-locked BIOS or canonical disc-NNN.chd external file with the common single-Range contract.
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      security: []
      operationId: headRuntimeExternalFile
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/bios/bundle.zip:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      security: []
      operationId: getRuntimeBIOSBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      security: []
      operationId: headRuntimeBIOSBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/parent/bundle.zip:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      security: []
      operationId: getRuntimeParentBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      security: []
      operationId: headRuntimeParentBundle
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/state:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    get:
      security: []
      operationId: getRuntimeState
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
    head:
      security: []
      operationId: headRuntimeState
      responses:
        '200': { $ref: '#/components/responses/BinaryResponse' }
  /runtime/launches/{launchId}/review-screenshot:
    parameters: [{ $ref: '#/components/parameters/LaunchID' }]
    post:
      security: []
      operationId: postRuntimeReviewScreenshot
      x-retrom-streaming-body: true
      description: Stores one bounded PNG captured by a current review preview five seconds after game start, including best-effort previews with missing dependencies. The path-scoped preview capability is required and ordinary published Launch sessions cannot use this route.
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: retrom_session
  schemas:
    ImportOverviewSummary:
      type: object
      additionalProperties: false
      required: [running, reviewPending, publishedItems, completed, failed, ordinaryFailed, pegasusFailed, processingItems, issueItems]
      properties:
        running:
          type: integer
          format: int64
          minimum: 0
          description: User-visible non-terminal batches, counting each browser/reconfigure ImportJob or Pegasus import once.
        reviewPending:
          type: integer
          format: int64
          minimum: 0
          description: ImportItems whose current state is exactly REVIEW_PENDING.
        publishedItems:
          type: integer
          format: int64
          minimum: 0
          description: ImportItems whose current state is exactly PUBLISHED.
        completed:
          type: integer
          format: int64
          minimum: 0
          description: User-visible completed batches, counting each browser/reconfigure ImportJob or Pegasus import once.
        failed:
          type: integer
          format: int64
          minimum: 0
          description: User-visible batches in PARTIAL_FAILURE or FAILED; cancelled batches are excluded.
        ordinaryFailed:
          type: integer
          format: int64
          minimum: 0
          description: Browser/reconfigure ImportJobs included in failed.
        pegasusFailed:
          type: integer
          format: int64
          minimum: 0
          description: Pegasus imports included in failed.
        processingItems:
          type: integer
          format: int64
          minimum: 0
          description: Known game/item count in currently non-terminal user-visible batches.
        issueItems:
          type: integer
          format: int64
          minimum: 0
          description: Failed or blocked items plus unresolved rejected files in user-visible attention batches.
    AuthInitializeRequest:
      type: object
      additionalProperties: false
      required: [setupCode, username, displayName, password, passwordConfirmation]
      properties:
        setupCode: { type: string, minLength: 43, maxLength: 43 }
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, minLength: 1, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 512 }
        passwordConfirmation: { type: string, minLength: 1, maxLength: 512 }
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 512 }
    AuthChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword, newPasswordConfirmation]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 512 }
        newPassword: { type: string, minLength: 1, maxLength: 512 }
        newPasswordConfirmation: { type: string, minLength: 1, maxLength: 512 }
    AccountLinkInspectRequest:
      type: object
      additionalProperties: false
      required: [expectedKind, token]
      properties:
        expectedKind: { type: string, enum: [INVITATION, PASSWORD_RESET] }
        token: { type: string, minLength: 64, maxLength: 64 }
    InvitationAcceptRequest:
      type: object
      additionalProperties: false
      required: [token, username, displayName, password, passwordConfirmation]
      properties:
        token: { type: string, minLength: 64, maxLength: 64 }
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, minLength: 1, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 512 }
        passwordConfirmation: { type: string, minLength: 1, maxLength: 512 }
    PasswordResetCompleteRequest:
      type: object
      additionalProperties: false
      required: [token, password, passwordConfirmation]
      properties:
        token: { type: string, minLength: 64, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 512 }
        passwordConfirmation: { type: string, minLength: 1, maxLength: 512 }
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [role, confirmAdminRole]
      properties:
        role: { type: string, enum: [ADMIN, USER] }
        confirmAdminRole: { type: boolean }
    PatchUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { type: string, enum: [ADMIN, USER] }
        status: { type: string, enum: [ENABLED, DISABLED] }
        confirmAdminRole: { type: boolean }
    DeleteUserRequest:
      type: object
      additionalProperties: false
      required: [confirmUsername]
      properties:
        confirmUsername: { type: string, minLength: 3, maxLength: 32 }
    EmptyRequest:
      type: object
      additionalProperties: false
    ReplaceFavoriteFoldersRequest:
      type: object
      additionalProperties: false
      required: [folderIds]
      properties:
        folderIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    OrganizeFavoritesRequest:
      type: object
      additionalProperties: false
      required: [gameIds, addFolderIds, removeFolderIds]
      properties:
        gameIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
        addFolderIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        removeFolderIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
    UnfavoriteRequest:
      type: object
      additionalProperties: false
      required: [gameIds]
      properties:
        gameIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    FavoriteRestoreItemRequest:
      type: object
      additionalProperties: false
      required: [gameId, folderIds]
      properties:
        gameId: { type: string, format: uuid }
        folderIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    RestoreFavoritesRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/FavoriteRestoreItemRequest' }
    CreateFavoriteFolderRequest:
      type: object
      additionalProperties: false
      required: [name, initialGameIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        initialGameIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    PatchFavoriteFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
    TagReference:
      type: object
      additionalProperties: false
      required: [tagId, name]
      properties:
        tagId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
    TagUsage:
      type: object
      additionalProperties: false
      required: [publishedGameCount, deletedGameCount, reviewDraftCount, pegasusCollectionCount]
      properties:
        publishedGameCount: { type: integer, format: int64, minimum: 0 }
        deletedGameCount: { type: integer, format: int64, minimum: 0 }
        reviewDraftCount: { type: integer, format: int64, minimum: 0 }
        pegasusCollectionCount: { type: integer, format: int64, minimum: 0 }
    TagAdminItem:
      type: object
      additionalProperties: false
      required: [tagId, name, status, version, usage, createdAtMs, updatedAtMs, deletedAtMs]
      properties:
        tagId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        status: { type: string, enum: [ACTIVE, DELETED] }
        version: { type: integer, format: int64, minimum: 1 }
        usage: { $ref: '#/components/schemas/TagUsage' }
        createdAtMs: { type: integer, format: int64, minimum: 0 }
        updatedAtMs: { type: integer, format: int64, minimum: 0 }
        deletedAtMs: { type: integer, format: int64, minimum: 0, nullable: true }
    TagSummary:
      type: object
      additionalProperties: false
      required: [activeTagCount, taggedGameCount, pendingReviewCount]
      properties:
        activeTagCount: { type: integer, format: int64, minimum: 0, maximum: 1000 }
        taggedGameCount: { type: integer, format: int64, minimum: 0 }
        pendingReviewCount: { type: integer, format: int64, minimum: 0 }
    TagList:
      type: object
      additionalProperties: false
      required: [generatedAtMs, summary, items, nextCursor]
      properties:
        generatedAtMs: { type: integer, format: int64, minimum: 0 }
        summary: { $ref: '#/components/schemas/TagSummary' }
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/TagAdminItem' } }
        nextCursor: { type: string, maxLength: 8192, nullable: true }
    CreateTagRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
    RenameTagRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
    DeleteTagRequest:
      type: object
      additionalProperties: false
      required: [confirmName]
      properties:
        confirmName: { type: string, minLength: 1, maxLength: 160 }
    ReplaceGameTagsRequest:
      type: object
      additionalProperties: false
      required: [tagIds]
      properties:
        tagIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
    GameTagsResult:
      type: object
      additionalProperties: false
      required: [gameId, version, tags]
      properties:
        gameId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        tags: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/TagReference' } }
    FavoriteReference:
      type: object
      additionalProperties: false
      required: [favoritedAtMs, folderIds]
      properties:
        favoritedAtMs: { type: integer, format: int64, minimum: 0 }
        folderIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    FavoriteState:
      type: object
      additionalProperties: false
      required: [gameId, favoritedAtMs, folderIds]
      properties:
        gameId: { type: string, format: uuid }
        favoritedAtMs: { type: integer, format: int64, minimum: 0 }
        folderIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    FavoriteFolder:
      type: object
      additionalProperties: false
      required: [folderId, name, version, visibleGameCount, createdAtMs, updatedAtMs]
      properties:
        folderId: { type: string, format: uuid }
