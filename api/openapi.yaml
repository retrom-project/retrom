        role: { type: string, enum: [HOST, GUEST] }
        displayName: { type: string }
        avatarRef: { type: string, nullable: true }
        ready: { type: boolean }
        connectionState: { type: string, enum: [NOT_CONNECTED, LOCKED, LAUNCH_READY, RUNTIME_READY, SYNCHRONIZED, CONNECTED, DISCONNECTED, LEFT] }
    NetplayRoomGame:
      type: object
      additionalProperties: false
      required: [gameId, title, status, availability, platformName, profileId, coreName, emulatorjsVersion, maxPlayers]
      properties:
        gameId: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [PUBLISHED, DELETED] }
        availability: { type: string, enum: [PUBLISHED, DELETED] }
        platformName: { type: string }
        profileId: { type: string }
        coreName: { type: string }
        emulatorjsVersion: { type: string }
        maxPlayers: { type: integer, minimum: 2, maximum: 4 }
    NetplaySessionSummary:
      type: object
      additionalProperties: false
      required: [sessionId, sessionNo, state]
      properties:
        sessionId: { type: string, format: uuid }
        sessionNo: { type: integer, minimum: 1 }
        state: { type: string, enum: [PREPARING, LOADING, SYNCHRONIZING, RUNNING, PAUSED_RECONNECT, RESYNCHRONIZING, FINISHED, FAILED] }
    NetplayRoomPermissions:
      type: object
      additionalProperties: false
      required: [host, member, canSelectGame, canJoin, canReady, canStart, canClose]
      properties:
        host: { type: boolean }
        member: { type: boolean }
        canSelectGame: { type: boolean }
        canJoin: { type: boolean }
        canReady: { type: boolean }
        canStart: { type: boolean }
        canClose: { type: boolean }
    NetplayRoom:
      type: object
      additionalProperties: false
      required: [roomId, state, version, game, members, currentSession, permissions, selfMemberId, expiresAtMs, serverNowMs, endedAtMs, endReason]
      properties:
        roomId: { type: string, format: uuid }
        state: { type: string, enum: [DRAFT, WAITING, STARTING, RUNNING, ENDED, EXPIRED] }
        version: { type: integer, format: int64, minimum: 1 }
        game: { nullable: true, allOf: [{ $ref: '#/components/schemas/NetplayRoomGame' }] }
        members: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/NetplayRoomMember' } }
        currentSession: { nullable: true, allOf: [{ $ref: '#/components/schemas/NetplaySessionSummary' }] }
        permissions: { $ref: '#/components/schemas/NetplayRoomPermissions' }
        selfMemberId: { type: string, format: uuid, nullable: true }
        expiresAtMs: { type: integer, format: int64 }
        serverNowMs: { type: integer, format: int64 }
        endedAtMs: { type: integer, format: int64, nullable: true }
        endReason:
          type: string
          nullable: true
          enum: [NORMAL, USER_EXIT, HOST_CLOSED, HOST_LOST, PEER_TIMEOUT, AUTH_REVOKED, START_TIMEOUT, PREPARE_FAILED, PROFILE_REVOKED, SERVER_RESTARTED, RESTORE, HARD_EXPIRED, ROLLBACK_WINDOW_EXCEEDED, STATE_RING_CAPACITY_EXCEEDED, STATE_TRANSFER_TIMEOUT, STATE_INVALID, NETPLAY_UNSTABLE, PEER_TOO_SLOW, PROTOCOL_VIOLATION, INTERNAL_ERROR, GAME_DELETED, GAME_CONTENT_REPLACED, BIOS_REPLACED]
    NetplayRoomList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NetplayRoom' } }
        nextCursor: { type: string, nullable: true }
    NetplayLaunchResponseBody:
      type: object
      additionalProperties: false
      required: [launchId, playUrl, warnings, bootstrapExpiresAtMs, hardExpiresAtMs]
      properties:
        launchId: { type: string, format: uuid }
        playUrl: { type: string }
        warnings: { type: array, items: { type: string } }
        bootstrapExpiresAtMs: { type: integer, format: int64 }
        hardExpiresAtMs: { type: integer, format: int64 }
    StartupAction:
      type: object
      additionalProperties: false
      required: [event, kind, delayMs, player, control, durationMs]
      properties:
        event: { type: string, enum: [GAME_START] }
        kind: { type: string, enum: [PRESS_CONTROL] }
        delayMs: { type: integer, minimum: 0, maximum: 30000 }
        player: { type: integer, minimum: 0, maximum: 3 }
        control: { type: integer, minimum: 0, maximum: 255 }
        durationMs: { type: integer, minimum: 1, maximum: 1000 }
    DiscEntry:
      type: object
      additionalProperties: false
      required: [index, label, virtualPath]
      properties:
        index: { type: integer, minimum: 0, maximum: 7 }
        label: { type: string, minLength: 1, maxLength: 32 }
        virtualPath: { type: string, pattern: '^/disc-[0-9]{3}\.chd$' }
    DiscSet:
      type: object
      nullable: true
      additionalProperties: false
      required: [contentKind, count, initialDiscIndex, entries]
      properties:
        contentKind: { type: string, enum: [MULTI_DISC_M3U_V1] }
        count: { type: integer, minimum: 2, maximum: 8 }
        initialDiscIndex: { type: integer, minimum: 0, maximum: 7 }
        entries:
          type: array
          minItems: 2
          maxItems: 8
          items: { $ref: '#/components/schemas/DiscEntry' }
    ReviewPreviewConfig:
      type: object
      additionalProperties: false
      required: [importItemId, captureAllowed, captureAfterMs]
      properties:
        importItemId: { type: string, format: uuid }
        captureAllowed: { type: boolean }
        captureAfterMs: { type: integer, minimum: 5000, maximum: 5000 }
    LaunchConfig:
      oneOf:
        - { $ref: '#/components/schemas/EmulatorJSLaunchConfig' }
        - { $ref: '#/components/schemas/RpgMakerLaunchConfig' }
      discriminator:
        propertyName: runtimeFamily
        mapping:
          EMULATORJS: '#/components/schemas/EmulatorJSLaunchConfig'
          RPGMAKER: '#/components/schemas/RpgMakerLaunchConfig'
    EmulatorJSLaunchConfig:
      type: object
      additionalProperties: false
      required: [runtimeFamily, mode, launchId, emulatorjsVersion, playerAdapterId, core, runtimeCore, coreName,
        coreArtifactId, emulatorGameId, gameName, gameTitle, platformName, runtimeBaseUrl,
        loaderUrl, gameUrl, biosUrl, parentUrl, stateUrl, inputMode, startupActions, requiresThreads, runtimePathOverrides,
        defaultCoreOptions, externalFiles, discSet, dosEntry, warnings, returnTo, netplay]
      properties:
        runtimeFamily: { type: string, enum: [EMULATORJS] }
        mode: { type: string, enum: [single, netplay] }
        launchId: { type: string, format: uuid }
        emulatorjsVersion: { type: string }
        playerAdapterId: { type: string, enum: ['ejs-4.2.3-v2', 'ejs-4.2.3-v3', 'ejs-4.3.0-pre-v2'] }
        core: { type: string }
        runtimeCore: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
        coreName: { type: string }
        coreArtifactId: { type: string, format: uuid }
        emulatorGameId: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        gameName: { type: string }
        gameTitle: { type: string }
        platformName: { type: string }
        runtimeBaseUrl: { type: string }
        loaderUrl: { type: string }
        gameUrl: { type: string, pattern: '^/runtime/content/game/[0-9a-f]{64}/[^/?#]+$' }
        biosUrl: { type: string, nullable: true, pattern: '^/runtime/content/bios/[0-9a-f]{64}/bundle\.zip$' }
        parentUrl: { type: string, nullable: true, pattern: '^/runtime/content/parent/[0-9a-f]{64}/bundle\.zip$' }
        stateUrl: { type: string, nullable: true }
        inputMode: { type: string, enum: [STANDARD, POINTER] }
        startupActions:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/StartupAction' }
        requiresThreads: { type: boolean }
        runtimePathOverrides:
          type: object
          maxProperties: 8
          additionalProperties: { type: string }
        defaultCoreOptions:
          type: object
          maxProperties: 32
          additionalProperties: { type: string }
        externalFiles:
          type: object
          maxProperties: 16
          propertyNames: { type: string, minLength: 1, maxLength: 512, pattern: '^/' }
          additionalProperties: { type: string, minLength: 1, maxLength: 1024, pattern: '^/runtime/content/external/[0-9a-f]{64}/[^/?#]+$' }
        discSet: { $ref: '#/components/schemas/DiscSet' }
        dosEntry: { type: string, nullable: true }
        warnings: { type: array, items: { type: string } }
        returnTo: { type: string }
        reviewPreview: { $ref: '#/components/schemas/ReviewPreviewConfig' }
        netplay:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/NetplayLaunchConfig' }]
    RpgGeneration:
      type: string
      enum: [RPG2000, RPG2003, RPGXP, RPGVX, RPGVXACE, RPGMV, RPGMZ]
    RpgCoreID:
      type: string
      enum: [rpgmaker_2000, rpgmaker_2003, rpgmaker_xp, rpgmaker_vx, rpgmaker_vx_ace, rpgmaker_mv, rpgmaker_mz]
    CheckpointPayloadKind:
      type: string
      enum: [RUNTIME_STATE, NATIVE_SAVE_BUNDLE_V1]
    NativeCheckpointProfile:
      type: string
      enum: [EASYRPG_V1, RPGMV_V1, RPGMZ_V1]
    CheckpointUnavailableReason:
      type: string
      enum: [NOT_ON_MAP, SAVE_DISABLED, MESSAGE_ACTIVE, EVENT_ACTIVE, BUSY, RUNTIME_NOT_READY, RUNTIME_FAILED, CHECKPOINT_ALREADY_CREATED, NETPLAY_UNSUPPORTED]
    CheckpointAvailability:
      type: object
      additionalProperties: false
      required: [available, reason]
      properties:
        available: { type: boolean }
        reason:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/CheckpointUnavailableReason' }]
      description: reason is null exactly when available is true and is required to be a stable enum when available is false.
    RpgCheckpointRestore:
      type: object
      additionalProperties: false
      required: [payloadKind, payloadUrl]
      properties:
        payloadKind: { $ref: '#/components/schemas/CheckpointPayloadKind' }
        payloadUrl: { type: string, pattern: '^/runtime/launches/[0-9a-f-]{36}/state$' }
    EasyRpgRtpArchive:
      type: object
      additionalProperties: false
      required: [url, sha256, mountPath]
      properties:
        url: { type: string, minLength: 1, maxLength: 2048 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        mountPath: { type: string, enum: [/data/rtp/2000, /data/rtp/2003] }
    EasyRpgAdapterConfig:
      type: object
      additionalProperties: false
      required: [adapterKind, adapterId, engineMode, runtimeBaseUrl, projectRootUrl, projectIndexUrl, rtpArchive, checkpointSlot]
      properties:
        adapterKind: { type: string, enum: [EASYRPG_WEB] }
        adapterId: { type: string, enum: [easyrpg-web-v1] }
        engineMode: { type: string, enum: [rpg2k, rpg2k3] }
        runtimeBaseUrl: { type: string, minLength: 1, maxLength: 2048 }
        projectRootUrl: { type: string, minLength: 1, maxLength: 2048 }
        projectIndexUrl: { type: string, minLength: 1, maxLength: 2048 }
        rtpArchive:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/EasyRpgRtpArchive' }]
        checkpointSlot: { type: integer, enum: [100] }
    MkxpCoreArtifact:
      type: object
      additionalProperties: false
      required: [jsUrl, jsSizeBytes, jsSha256, wasmUrl, wasmSizeBytes, wasmSha256, artifactSetSha256]
      properties:
        jsUrl: { type: string, minLength: 1, maxLength: 2048 }
        jsSizeBytes: { type: integer, format: int64, minimum: 1, maximum: 1048576 }
        jsSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        wasmUrl: { type: string, minLength: 1, maxLength: 2048 }
        wasmSizeBytes: { type: integer, format: int64, minimum: 1, maximum: 67108864 }
        wasmSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        artifactSetSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    RpgRuntimeArchive:
      type: object
      additionalProperties: false
      required: [url, sha256, sizeBytes]
      properties:
        url: { type: string, minLength: 1, maxLength: 2048 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        sizeBytes: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
    MkxpRtpArchive:
      type: object
      additionalProperties: false
      required: [declaredName, url, sha256, sizeBytes]
      properties:
        declaredName: { type: string, minLength: 1, maxLength: 255 }
        url: { type: string, minLength: 1, maxLength: 2048 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        sizeBytes: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
    MkxpAdapterConfig:
      type: object
      additionalProperties: false
      required: [adapterKind, adapterId, core, runtimeBaseUrl, projectArchive, rtpArchives, rgssVersion, stateBufferBytes]
      properties:
        adapterKind: { type: string, enum: [MKXP_LIBRETRO_WEB] }
        adapterId: { type: string, enum: [mkxp-z-libretro-v4] }
        core: { $ref: '#/components/schemas/MkxpCoreArtifact' }
        runtimeBaseUrl: { type: string, minLength: 1, maxLength: 2048 }
        projectArchive: { $ref: '#/components/schemas/RpgRuntimeArchive' }
        rtpArchives:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/MkxpRtpArchive' }
        rgssVersion: { type: integer, enum: [1, 2, 3] }
        stateBufferBytes: { type: integer, enum: [268435456] }
    NativeWebAdapterConfig:
      type: object
      additionalProperties: false
      required: [adapterKind, adapterId, bridgeProfile, uniqueOrigin, bootstrapUrl, bootstrapTicket]
      properties:
        adapterKind: { type: string, enum: [NATIVE_WEB] }
        adapterId: { type: string, enum: [rpg-native-web-v1, rpg-native-web-v2, rpg-native-web-v3, rpg-native-web-v4, rpg-native-web-v5] }
        bridgeProfile: { type: string, enum: [mv-v1, mz-v1] }
        uniqueOrigin: { type: string, format: uri, pattern: '^https?://[^/?#]+$' }
        bootstrapUrl: { type: string, format: uri, pattern: '^https?://[^/?#]+/__retrom/bootstrap$' }
        bootstrapTicket: { type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    RpgAdapterConfig:
      oneOf:
        - { $ref: '#/components/schemas/EasyRpgAdapterConfig' }
        - { $ref: '#/components/schemas/MkxpAdapterConfig' }
        - { $ref: '#/components/schemas/NativeWebAdapterConfig' }
      discriminator:
        propertyName: adapterKind
        mapping:
          EASYRPG_WEB: '#/components/schemas/EasyRpgAdapterConfig'
          MKXP_LIBRETRO_WEB: '#/components/schemas/MkxpAdapterConfig'
          NATIVE_WEB: '#/components/schemas/NativeWebAdapterConfig'
    RpgMakerLaunchConfig:
      type: object
      additionalProperties: false
      required: [runtimeFamily, protocolVersion, mode, purpose, launchId, coreId, coreName, gameTitle, platformName, returnTo, warnings, generation, routeKey, artifactId, checkpoint, checkpointAvailability, runtimeValidation, adapter]
      properties:
        runtimeFamily: { type: string, enum: [RPGMAKER] }
        protocolVersion: { type: integer, enum: [1] }
        mode: { type: string, enum: [single] }
        purpose: { type: string, enum: [PRODUCT, RPG_RUNTIME_VALIDATION] }
        launchId: { type: string, format: uuid }
        coreId: { $ref: '#/components/schemas/RpgCoreID' }
        coreName: { type: string, minLength: 1, maxLength: 200 }
        gameTitle: { type: string, minLength: 1, maxLength: 200 }
        platformName: { type: string, enum: [RPG Maker] }
        returnTo: { type: string, minLength: 1, maxLength: 2048 }
        warnings: { type: array, maxItems: 32, items: { type: string, maxLength: 500 } }
        generation: { $ref: '#/components/schemas/RpgGeneration' }
        routeKey: { type: string, pattern: '^RPG[A-Z0-9_]{1,95}$' }
        artifactId: { type: string, format: uuid }
        checkpoint:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgCheckpointRestore' }]
        checkpointAvailability: { $ref: '#/components/schemas/CheckpointAvailability' }
        runtimeValidation:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgRuntimeValidationResume' }]
        adapter: { $ref: '#/components/schemas/RpgAdapterConfig' }
    RuntimeAssetPackKind:
      type: string
      enum: [RPG2000_RTP, RPG2003_RTP, RGSS1_RTP_STANDARD, RGSS2_RTP_RPGVX, RGSS3_RTP_RPGVXAce, RGSS_CUSTOM_RTP]
    CoreArtifactAdminItem:
      type: object
      additionalProperties: false
      required: [id, coreId, coreName, routeKey, runtimeFamily, runtimeAdapterKind, runtimeVersion, adapterId, selectedForNewBindings, availableForLaunch, version, sizeBytes]
      properties:
        id: { type: string, format: uuid }
        coreId: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
        coreName: { type: string, minLength: 1, maxLength: 200 }
        routeKey: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,159}$' }
        runtimeFamily: { type: string, minLength: 1, maxLength: 64 }
        runtimeAdapterKind: { type: string, minLength: 1, maxLength: 64 }
        runtimeVersion: { type: string, minLength: 1, maxLength: 160 }
        adapterId: { type: string, minLength: 1, maxLength: 160 }
        selectedForNewBindings: { type: boolean }
        availableForLaunch: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
    CoreArtifactList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CoreArtifactAdminItem' } }
        nextCursor: { type: string, nullable: true }
    RuntimeAssetPackDefinition:
      type: object
      additionalProperties: false
      required: [definitionId, kind, generation, declaredName, normalizedDeclaredName, displayName, requiredLayoutVersion, origin, enabled]
      properties:
        definitionId: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
        kind: { $ref: '#/components/schemas/RuntimeAssetPackKind' }
        generation: { $ref: '#/components/schemas/RpgGeneration' }
        declaredName: { type: string, minLength: 1, maxLength: 512 }
        normalizedDeclaredName: { type: string, minLength: 1, maxLength: 2048, description: Server-computed Unicode NFKC full case-fold key used for exact runtime-pack matching. }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        requiredLayoutVersion: { type: string, minLength: 1, maxLength: 160 }
        origin: { type: string, enum: [BUILTIN, CUSTOM] }
        enabled: { type: boolean }
    RuntimeAssetPackReferenceCounts:
      type: object
      additionalProperties: false
      required: [variantRevisionCount, checkpointCount]
      properties:
        variantRevisionCount: { type: integer, format: int64, minimum: 0 }
        checkpointCount: { type: integer, format: int64, minimum: 0 }
    RuntimeAssetPackDiagnostic:
      type: object
      additionalProperties: false
      required: [code, level, message]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,119}$' }
        level: { type: string, enum: [INFO, WARNING, ERROR] }
        message: { type: string, maxLength: 1000 }
    RuntimeAssetPackInstallation:
      type: object
      additionalProperties: false
      required: [installationId, definitionId, filesDigest, fileCount, totalBytes, bundleSha256, status, diagnostics, sourceNote, references, version, createdAtMs, validatedAtMs, deletedAtMs]
      properties:
        installationId: { type: string, format: uuid }
        definitionId: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
        filesDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        fileCount: { type: integer, minimum: 1, maximum: 10000 }
        totalBytes: { type: integer, format: int64, minimum: 0, maximum: 536870912 }
        bundleSha256: { type: string, nullable: true, pattern: '^[0-9a-f]{64}$' }
        status: { type: string, enum: [VALIDATING, READY, FAILED, DELETE_PENDING, DELETED] }
        diagnostics: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/RuntimeAssetPackDiagnostic' } }
        sourceNote: { type: string, nullable: true, maxLength: 500 }
        references: { $ref: '#/components/schemas/RuntimeAssetPackReferenceCounts' }
        version: { type: integer, format: int64, minimum: 1 }
        createdAtMs: { type: integer, format: int64, minimum: 0 }
        validatedAtMs: { type: integer, format: int64, minimum: 0, nullable: true }
        deletedAtMs: { type: integer, format: int64, minimum: 0, nullable: true }
    RuntimeAssetPackList:
      type: object
      additionalProperties: false
      required: [definitions, installations]
      properties:
        definitions: { type: array, items: { $ref: '#/components/schemas/RuntimeAssetPackDefinition' } }
        installations: { type: array, items: { $ref: '#/components/schemas/RuntimeAssetPackInstallation' } }
    InstallRuntimeAssetPackRequest:
      type: object
      additionalProperties: false
      required: [uploadId, kind]
      description: generation and declaredName are both required exactly for RGSS_CUSTOM_RTP and must both be omitted for built-in kinds; sourceNote is optional and may be empty.
      properties:
        uploadId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RuntimeAssetPackKind' }
        generation: { $ref: '#/components/schemas/RpgGeneration' }
        declaredName: { type: string, minLength: 1, maxLength: 512 }
        sourceNote:
          type: string
          maxLength: 500
          description: The server also enforces NFC, at most 2,000 UTF-8 bytes, Unicode-whitespace trim and the validation-note control-character denylist; an empty value is allowed.
    RuntimeAssetPackInstallAccepted:
      type: object
      additionalProperties: false
      required: [installationId, jobId, status]
      properties:
        installationId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [VALIDATING] }
    RpgRuntimePackSelectionRequest:
      type: object
      additionalProperties: false
      required: [slot, installationId]
      properties:
        slot: { type: integer, enum: [0, 1, 2, 3] }
        installationId: { type: string, format: uuid }
    RpgRuntimeValidationState:
      type: string
      enum: [CREATED, STARTING, RUNNING, CHECKPOINTED, RESTORED, AWAITING_DECISION, PASSED, FAILED, EXPIRED]
    RpgRuntimeGate:
      type: string
      enum: [RUNTIME_READY, ENGINE_PROFILE, FRAMES_300, INPUT, AUDIO, INITIAL_POSITION_RECORDED, SAVE_POINT_RECORDED, CHECKPOINT_CREATED, POST_SAVE_STATE_DIVERGED, ORIGINAL_LAUNCH_ENDED, RESTORE_STARTED, RESTORE_POSITION_VERIFIED, RESTORE_SCREENSHOT, RESTORE_INPUT]
    RpgRuntimeGatePhase:
      type: string
      enum: [BEGIN, PASS, FAIL]
    EmptyGateEvidence:
      type: object
      additionalProperties: false
    RpgPositionEvidence:
      type: object
      additionalProperties: false
      required: [mapId, playerX, playerY, fixtureState]
      properties:
        mapId: { type: integer, format: int64, minimum: 1, maximum: 2147483647 }
        playerX: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        playerY: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        fixtureState: { type: integer, format: int64, minimum: -2147483648, maximum: 2147483647 }
    RpgEngineProfileEvidence:
      type: object
      additionalProperties: false
      required: [generation, adapterId, engineProfile]
      properties:
        generation: { $ref: '#/components/schemas/RpgGeneration' }
        adapterId: { type: string, enum: [easyrpg-web-v1, mkxp-z-libretro-v4, rpg-native-web-v1, rpg-native-web-v2, rpg-native-web-v3, rpg-native-web-v4, rpg-native-web-v5] }
        engineProfile: { type: string, enum: [rpg2k, rpg2k3, rgss1, rgss2, rgss3, mv-v1, mz-v1] }
    RpgFrameEvidence:
      type: object
      additionalProperties: false
      required: [continuousFrames]
      properties:
        continuousFrames: { type: integer, minimum: 300, maximum: 36000 }
    RpgBooleanGateEvidence:
      type: object
      additionalProperties: false
      required: [observed]
      properties:
        observed: { type: boolean, enum: [true] }
    RpgCheckpointGateEvidence:
      type: object
      additionalProperties: false
      required: [payloadKind, sizeBytes, sha256]
      properties:
        payloadKind: { $ref: '#/components/schemas/CheckpointPayloadKind' }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 268435456 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    RpgRuntimeGateEvidence:
      oneOf:
        - { $ref: '#/components/schemas/EmptyGateEvidence' }
        - { $ref: '#/components/schemas/RpgPositionEvidence' }
        - { $ref: '#/components/schemas/RpgEngineProfileEvidence' }
        - { $ref: '#/components/schemas/RpgFrameEvidence' }
        - { $ref: '#/components/schemas/RpgBooleanGateEvidence' }
        - { $ref: '#/components/schemas/RpgCheckpointGateEvidence' }
      description: BEGIN and screenshot association use the empty object. The registry requires position evidence for INITIAL_POSITION_RECORDED, SAVE_POINT_RECORDED, POST_SAVE_STATE_DIVERGED, RESTORE_POSITION_VERIFIED and RESTORE_INPUT and compares those values server-side; other PASS/FAIL evidence is gate-specific. Blob IDs are never accepted.
    RpgMakerGateEventRequest:
      type: object
      additionalProperties: false
      required: [sequence, eventId, gate, phase, observedAtMs, evidence]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        eventId: { type: string, format: uuid }
        gate: { $ref: '#/components/schemas/RpgRuntimeGate' }
        phase: { $ref: '#/components/schemas/RpgRuntimeGatePhase' }
        observedAtMs: { type: integer, format: int64, minimum: 0, maximum: 253402300799999 }
        evidence: { $ref: '#/components/schemas/RpgRuntimeGateEvidence' }
    RpgMakerGateEventAccepted:
      type: object
      additionalProperties: false
      required: [sequence, eventId, validationState, idempotentReplay]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        eventId: { type: string, format: uuid }
        validationState: { $ref: '#/components/schemas/RpgRuntimeValidationState' }
        idempotentReplay: { type: boolean }
    RpgRuntimeMachineGate:
      type: object
      additionalProperties: false
      required: [gate, status, begunAtMs, completedAtMs, evidence, failureCode]
      properties:
        gate: { $ref: '#/components/schemas/RpgRuntimeGate' }
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, PASSED, FAILED] }
        begunAtMs: { type: integer, format: int64, minimum: 0, nullable: true }
        completedAtMs: { type: integer, format: int64, minimum: 0, nullable: true }
        evidence:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgRuntimeGateEvidence' }]
        failureCode:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgErrorCode' }]
    RpgRuntimeValidationResume:
      type: object
      additionalProperties: false
      required: [validationId, state, originalLaunchId, restoreLaunchId, lastGateSequence, machineGates, checkpointEvidence, restoreScreenshotUploaded]
      properties:
        validationId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/RpgRuntimeValidationState' }
        originalLaunchId: { type: string, format: uuid }
        restoreLaunchId: { type: string, format: uuid, nullable: true }
        lastGateSequence: { type: integer, format: int64, minimum: 0, maximum: 28 }
        machineGates:
          type: array
          minItems: 14
          maxItems: 14
          description: Ordered server-authoritative gate state used to resume a runtime-authorized page reload.
          items: { $ref: '#/components/schemas/RpgRuntimeMachineGate' }
        checkpointEvidence:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgCheckpointGateEvidence' }]
        restoreScreenshotUploaded: { type: boolean }
    RpgRuntimeRouteEvidence:
      type: object
      additionalProperties: false
      required: [effectiveSourceSnapshotId, coreId, generation, evidenceGeneration, evidenceConfidence, routeKey, artifactId, artifactSetSha256, adapterId, adapterAbi, dependencySnapshotSha256, projectFingerprint]
      properties:
        effectiveSourceSnapshotId: { type: string, format: uuid }
        coreId: { $ref: '#/components/schemas/RpgCoreID' }
        generation: { $ref: '#/components/schemas/RpgGeneration' }
        evidenceGeneration:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgGeneration' }]
        evidenceConfidence: { type: string, enum: [MATCHED, FAMILY_ONLY] }
        routeKey: { type: string, pattern: '^RPG[A-Z0-9_]{1,95}$' }
        artifactId: { type: string, format: uuid }
        artifactSetSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        adapterId: { type: string, enum: [easyrpg-web-v1, mkxp-z-libretro-v4, rpg-native-web-v1, rpg-native-web-v2, rpg-native-web-v3, rpg-native-web-v4, rpg-native-web-v5] }
        adapterAbi: { type: string, minLength: 1, maxLength: 160 }
        dependencySnapshotSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        projectFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
    RpgCheckpointRoundTrip:
      type: object
      additionalProperties: false
      required: [created, payloadKind, resumeSlot, sizeBytes, sha256, originalLaunchId, initialPosition, savedPosition, divergedPosition, originalLaunchEnded, restoreLaunchId, restoreStarted, restoredPosition, positionVerified, screenshotUrl, restoreInputPosition, restoreInputVerified]
      properties:
        created: { type: boolean }
        payloadKind:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/CheckpointPayloadKind' }]
        resumeSlot: { type: integer, format: int64, minimum: 1, maximum: 2147483647, nullable: true }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 268435456, nullable: true }
        sha256: { type: string, nullable: true, pattern: '^[0-9a-f]{64}$' }
        originalLaunchId: { type: string, format: uuid, nullable: true }
        initialPosition:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgPositionEvidence' }]
        savedPosition:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgPositionEvidence' }]
        divergedPosition:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgPositionEvidence' }]
        originalLaunchEnded: { type: boolean }
        restoreLaunchId: { type: string, format: uuid, nullable: true }
        restoreStarted: { type: boolean }
        restoredPosition:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgPositionEvidence' }]
        positionVerified: { type: boolean }
        screenshotUrl: { type: string, nullable: true, pattern: '^/api/v1/admin/review-assets/' }
        restoreInputPosition:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgPositionEvidence' }]
        restoreInputVerified: { type: boolean }
      description: positionVerified is true only when restoreLaunchId differs from originalLaunchId, restoredPosition equals savedPosition field-for-field, and savedPosition differs from initialPosition and divergedPosition. restoreInputVerified additionally requires post-screenshot input to produce a position different from restoredPosition; screenshotUrl must represent the restored saved marker.
    RpgRuntimeReviewerDecision:
      type: object
      nullable: true
      additionalProperties: false
      required: [decision, note, decidedAtMs]
      properties:
        decision: { type: string, enum: [PASS, FAIL] }
        note: { type: string, maxLength: 500 }
        decidedAtMs: { type: integer, format: int64, minimum: 0 }
    RpgRuntimeValidation:
      type: object
      additionalProperties: false
      required: [validationId, importItemId, reviewVersionAtCreate, runtimeBindingRevision, launchId, restoreLaunchId, state, lastGateSequence, routeEvidence, machineGates, checkpointRoundTrip, failureCode, decision, createdAtMs, updatedAtMs, expiresAtMs]
      properties:
        validationId: { type: string, format: uuid }
        importItemId: { type: string, format: uuid }
        reviewVersionAtCreate: { type: integer, format: int64, minimum: 1 }
        runtimeBindingRevision: { type: integer, format: int64, minimum: 1 }
        launchId:
          type: string
          format: uuid
          nullable: true
          description: Null only when validation reached FAILED before its initial Launch was issued.
        restoreLaunchId: { type: string, format: uuid, nullable: true }
        state: { $ref: '#/components/schemas/RpgRuntimeValidationState' }
        lastGateSequence: { type: integer, format: int64, minimum: 0 }
        routeEvidence: { $ref: '#/components/schemas/RpgRuntimeRouteEvidence' }
        machineGates:
          type: array
          minItems: 14
          maxItems: 14
          description: Exactly one entry for every RpgRuntimeGate in enum order.
          items: { $ref: '#/components/schemas/RpgRuntimeMachineGate' }
        checkpointRoundTrip: { $ref: '#/components/schemas/RpgCheckpointRoundTrip' }
        failureCode:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RpgErrorCode' }]
        decision: { $ref: '#/components/schemas/RpgRuntimeReviewerDecision' }
        createdAtMs: { type: integer, format: int64, minimum: 0 }
        updatedAtMs: { type: integer, format: int64, minimum: 0 }
        expiresAtMs: { type: integer, format: int64, minimum: 0 }
    RpgRuntimeValidationLaunch:
      type: object
      additionalProperties: false
      required: [validationId, launchId, playerUrl, expiresAtMs]
      properties:
        validationId: { type: string, format: uuid }
        launchId: { type: string, format: uuid }
        playerUrl: { type: string, pattern: '^/play/[0-9a-f-]{36}$' }
        expiresAtMs: { type: integer, format: int64, minimum: 0 }
    RpgRuntimeValidationDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, note]
      properties:
        decision: { type: string, enum: [PASS, FAIL] }
        note:
          type: string
          maxLength: 500
          description: FAIL requires a non-empty normalized value. Both decisions enforce LF normalization, NFC, Unicode-whitespace trim, at most 500 Unicode scalars and 2,000 UTF-8 bytes, and reject the documented control-character set.
    RuntimeCheckpointMetadata:
      type: object
      additionalProperties: false
      required: [payloadKind]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        discIndex: { type: integer, minimum: 0, maximum: 7, nullable: true }
        payloadKind: { $ref: '#/components/schemas/CheckpointPayloadKind' }
      description: >-
        PRODUCT requires name after trim to contain 1..120 Unicode code points; RPG_RUNTIME_VALIDATION omits name.
        discIndex is required and in range only for a multi-disc PRODUCT Launch and otherwise omitted or null.
        nativeProfile and resumeSlot are never client authority; the server derives and validates them from the frozen artifact and payload.
    ProductSaveStateCreated:
      type: object
      additionalProperties: false
      required: [resourceKind, saveStateId, payloadKind, nativeProfile, resumeSlot, screenshotUrl, createdAtMs]
      properties:
        resourceKind: { type: string, enum: [SAVE_STATE] }
        saveStateId: { type: string, format: uuid }
        payloadKind: { $ref: '#/components/schemas/CheckpointPayloadKind' }
        nativeProfile:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/NativeCheckpointProfile' }]
        resumeSlot: { type: integer, format: int64, minimum: 1, maximum: 2147483647, nullable: true }
        screenshotUrl: { type: string, nullable: true, pattern: '^/content/save-states/' }
        createdAtMs: { type: integer, format: int64, minimum: 0 }
    ValidationCheckpointCreated:
      type: object
      additionalProperties: false
      required: [resourceKind, validationId, payloadKind, nativeProfile, resumeSlot, sizeBytes, sha256, createdAtMs]
      properties:
        resourceKind: { type: string, enum: [RPG_RUNTIME_VALIDATION_CHECKPOINT] }
        validationId: { type: string, format: uuid }
        payloadKind: { $ref: '#/components/schemas/CheckpointPayloadKind' }
        nativeProfile:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/NativeCheckpointProfile' }]
        resumeSlot: { type: integer, format: int64, minimum: 1, maximum: 2147483647, nullable: true }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 268435456 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdAtMs: { type: integer, format: int64, minimum: 0 }
    RuntimeCheckpointCreated:
      oneOf:
        - { $ref: '#/components/schemas/ProductSaveStateCreated' }
        - { $ref: '#/components/schemas/ValidationCheckpointCreated' }
      discriminator:
        propertyName: resourceKind
        mapping:
          SAVE_STATE: '#/components/schemas/ProductSaveStateCreated'
          RPG_RUNTIME_VALIDATION_CHECKPOINT: '#/components/schemas/ValidationCheckpointCreated'
    CheckpointStatus:
      type: object
      additionalProperties: false
      required: [payloadKind, availability]
      properties:
        payloadKind: { $ref: '#/components/schemas/CheckpointPayloadKind' }
        availability: { $ref: '#/components/schemas/CheckpointAvailability' }
    NetplayLaunchConfig:
      type: object
      additionalProperties: false
      required: [roomId, sessionId, playerNo, netplayProfile, runtimeSocketUrl]
      properties:
        roomId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        playerNo: { type: integer, minimum: 1, maximum: 4 }
        netplayProfile: { $ref: '#/components/schemas/NetplayCanonicalProfile' }
        runtimeSocketUrl: { type: string, pattern: '^/runtime/netplay/rooms/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/socket$' }
    NetplayCanonicalProfile:
      type: object
      additionalProperties: false
      required: [schemaVersion, protocolVersion, profileId, emulatorjsVersion, playerAdapterId, netplayAdapterId, coreArtifactId, coreArtifactSha256, gameVariantRevisionId, sourceManifestDigest, dependencySnapshotDigest, defaultCoreOptions, controlCount, maxPlayers, maxPredictionFrames, maxRollbackFrames, checkpointEveryFrames, canonicalHistoryFrames, maxStateBytes]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        protocolVersion: { type: string, enum: [retrom-netplay-v2] }
        profileId: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        emulatorjsVersion: { type: string, enum: ['4.2.3'] }
        playerAdapterId: { type: string, enum: ['ejs-4.2.3-v2'] }
        netplayAdapterId: { type: string, enum: ['ejs-netplay-4.2.3-v1'] }
        coreArtifactId: { type: string, format: uuid }
        coreArtifactSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        gameVariantRevisionId: { type: string, format: uuid }
        sourceManifestDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        dependencySnapshotDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        defaultCoreOptions:
          type: object
          maxProperties: 32
          additionalProperties: { type: string }
        controlCount: { type: integer, enum: [24] }
        maxPlayers: { type: integer, minimum: 2, maximum: 4 }
        maxPredictionFrames: { type: integer, minimum: 0, maximum: 8 }
        maxRollbackFrames: { type: integer, enum: [120] }
        checkpointEveryFrames: { type: integer, enum: [120] }
        canonicalHistoryFrames: { type: integer, enum: [600] }
        maxStateBytes: { type: integer, enum: [1048576] }
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [sourceType, files]
      properties:
        purpose:
          type: string
          enum: [GENERAL, RPG_MAKER_PROJECT, RUNTIME_ASSET_PACK]
          default: GENERAL
          description: GENERAL preserves ordinary uploads; RPG purposes are consumed only by their matching project-import or runtime-pack operation.
        sourceType: { type: string, enum: [FILES, DIRECTORY] }
        files:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [clientFileId, relativePath, sizeBytes]
            properties:
              clientFileId: { type: string, maxLength: 200 }
              relativePath: { type: string, maxLength: 4096 }
              sizeBytes: { type: integer, format: int64, minimum: 0 }
    CreateImportRequest:
      type: object
      additionalProperties: false
      required: [uploadId, targetPlatformInstanceId, metadataProvider, tagIds]
      properties:
        uploadId: { type: string, format: uuid }
        targetPlatformInstanceId: { type: string, format: uuid }
        metadataProvider: { type: string, enum: [HASHEOUS, NONE] }
        tagIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        contentMode:
          type: string
          enum: [STANDARD, MULTI_DISC_M3U_V1, RPG_MAKER_PROJECT_V1]
          description: Omitted requests use STANDARD.
    ReconfigureImportRequest:
      type: object
      additionalProperties: false
      required: [targetPlatformInstanceId, metadataProvider, tagIds]
