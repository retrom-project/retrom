openapi: 3.0.3
info:
  title: Retrom HTTP API
  version: 1.0.0
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /health/live:
    get:
      security: []
      operationId: getHealthLive
      responses:
        '200': { $ref: '#/components/responses/HealthLiveResponse' }
  /health/ready:
    get:
      security: []
      operationId: getHealthReady
      responses:
        '200': { $ref: '#/components/responses/HealthReadyResponse' }
        '503': { $ref: '#/components/responses/HealthNotReadyResponse' }
  /api/v1/auth/context:
    get:
      security: []
      operationId: getAuthContext
      responses:
        '200': { $ref: '#/components/responses/AuthContextResponse' }
  /api/v1/auth/initialize:
    post:
      security: []
      operationId: postAuthInitialize
      requestBody: { $ref: '#/components/requestBodies/AuthInitialize' }
      responses:
        '201': { $ref: '#/components/responses/AuthContextResponse' }
  /api/v1/auth/login:
    post:
      security: []
      operationId: postAuthLogin
      requestBody: { $ref: '#/components/requestBodies/AuthLogin' }
      responses:
        '200': { $ref: '#/components/responses/AuthContextResponse' }
  /api/v1/auth/logout:
    post:
      security: []
      operationId: postAuthLogout
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '204': { description: Logged out }
  /api/v1/auth/change-password:
    post:
      operationId: postAuthChangePassword
      requestBody: { $ref: '#/components/requestBodies/AuthChangePassword' }
      responses:
        '200': { $ref: '#/components/responses/AuthContextResponse' }
  /api/v1/auth/account-links/inspect:
    post:
      security: []
      operationId: postAuthAccountLinkInspect
      requestBody: { $ref: '#/components/requestBodies/AccountLinkInspect' }
      responses:
        '200': { $ref: '#/components/responses/AccountLinkInspectionResponse' }
  /api/v1/auth/invitations/accept:
    post:
      security: []
      operationId: postAuthInvitationAccept
      requestBody: { $ref: '#/components/requestBodies/InvitationAccept' }
      responses:
        '201': { $ref: '#/components/responses/AuthContextResponse' }
  /api/v1/auth/password-resets/complete:
    post:
      security: []
      operationId: postAuthPasswordResetComplete
      requestBody: { $ref: '#/components/requestBodies/PasswordResetComplete' }
      responses:
        '200':
          description: Authenticated context for an enabled account, or the disabled-account completion state
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/AuthContext' }
                  - { $ref: '#/components/schemas/PasswordChangedDisabled' }
  /api/v1/admin/invitations:
    get:
      operationId: getAdminInvitations
      parameters: [{ $ref: '#/components/parameters/State' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/AccountLinkListResponse' }
    post:
      operationId: postAdminInvitation
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/CreateInvitation' }
      responses:
        '201': { $ref: '#/components/responses/InvitationCreatedResponse' }
  /api/v1/admin/users:
    get:
      operationId: getAdminUsers
      parameters:
        - { $ref: '#/components/parameters/Q80' }
        - { $ref: '#/components/parameters/Role' }
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/AdminUserListResponse' }
  /api/v1/admin/users/{userId}:
    parameters: [{ $ref: '#/components/parameters/UserID' }]
    get:
      operationId: getAdminUser
      responses:
        '200': { $ref: '#/components/responses/AdminUserResponse' }
    patch:
      operationId: patchAdminUser
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody: { $ref: '#/components/requestBodies/PatchUser' }
      responses:
        '200': { $ref: '#/components/responses/AdminUserResponse' }
    delete:
      operationId: deleteAdminUser
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody: { $ref: '#/components/requestBodies/DeleteUser' }
      responses:
        '204': { description: User soft-deleted }
  /api/v1/admin/users/{userId}/password-reset-links:
    parameters: [{ $ref: '#/components/parameters/UserID' }]
    get:
      operationId: getAdminUserPasswordResetLinks
      parameters: [{ $ref: '#/components/parameters/State' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/AccountLinkListResponse' }
    post:
      operationId: postAdminUserPasswordResetLink
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '201': { $ref: '#/components/responses/PasswordResetCreatedResponse' }
  /api/v1/admin/account-links/{accountLinkId}:
    parameters: [{ $ref: '#/components/parameters/AccountLinkID' }]
    delete:
      operationId: deleteAdminAccountLink
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '204': { description: Account link revoked }
  /api/v1/home:
    get:
      operationId: getHome
      description: Homepage aggregate from enabled platform directories. It includes library counters, the ten games with the most recently started play sessions, the ten most recently added published games ordered by game creation time, the latest started session's game with a save created by that exact launch when available, all supported platforms in deterministic order, and four quick platforms ranked by play-session count.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/recent-games:
    get:
      operationId: getRecentGames
      description: All visible games with play history, ordered by the newest play-session start, with aggregate active duration and session count. The response includes generatedAtMs so client-side day and rolling-window filters use the same clock as the server-rendered page.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/games:
    get:
      operationId: getGames
      description: Cursor-paginated published game summaries from enabled platform directories. Each item includes its platform, directory, recommended core, created time, nullable latest play time and nullable primary cover URL. The first page also includes filteredCount and complete visible-library platform, directory and active-tag facets so clients can render accurate filters without downloading every game; generatedAtMs gives relative-time labels a stable response clock.
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/TagIDQuery' }, { $ref: '#/components/parameters/PlatformIDQuery' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/GameListSort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/games/{gameId}:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    get:
      operationId: getGame
      description: Published game detail from an enabled platform directory; coverUrl and videoUrl are nullable logical URLs of the current metadata revision's ordinal-zero COVER and VIDEO assets. No ordinary game list DTO exposes videoUrl; the dedicated immersive platform projection is the only additional user read model. saveStateCount is the total non-deleted save count, and saveStates contains at most the eight newest owner-filtered entries with nullable discIndex/discLabel.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/immersive/platforms:
    get:
      operationId: getImmersivePlatforms
      description: Returns visible base platforms with shared-library counts and up to three cover previews ordered by the authenticated Profile's recent play history, then recent additions.
      responses:
        '200': { $ref: '#/components/responses/ImmersivePlatformListResponse' }
  /api/v1/immersive/platforms/{platformId}/games:
    parameters: [{ $ref: '#/components/parameters/PlatformID' }]
    get:
      operationId: getImmersivePlatformGames
      description: Returns one visible platform and its title-ordered immersive game page. Text, COVER and VIDEO are projected only from each game's current metadata revision, and play history is isolated to the authenticated Profile.
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit50' }]
      responses:
        '200': { $ref: '#/components/responses/ImmersiveGameListResponse' }
  /api/v1/immersive/destinations:
    get:
      operationId: getImmersiveDestinations
      description: Returns the four Profile-scoped library destinations first, followed by visible base platforms. Counts, recent-play clocks and cover previews are read from one snapshot.
      responses:
        '200': { $ref: '#/components/responses/ImmersiveDestinationListResponse' }
  /api/v1/immersive/libraries/{libraryKind}/games:
    parameters: [{ $ref: '#/components/parameters/ImmersiveLibraryKind' }]
    get:
      operationId: getImmersiveLibraryGames
      description: Returns the authenticated Profile's all, recent, favorite or saved games. Only recent is ordered by play time; the other scopes use the persisted title initial, title and game id. Favorite folders are available only for the favorites scope.
      parameters:
        - { $ref: '#/components/parameters/FavoriteFolderIDQuery' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit50' }
      responses:
        '200': { $ref: '#/components/responses/ImmersiveLibraryGameListResponse' }
  /api/v1/favorites:
    get:
      operationId: getFavorites
      description: Returns the authenticated Profile's visible favorites, derived counts, folders and platform summary from one read transaction.
      parameters:
        - { $ref: '#/components/parameters/FavoriteScope' }
        - { $ref: '#/components/parameters/FavoriteFolderIDQuery' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/PlatformIDQuery' }
        - { $ref: '#/components/parameters/FavoriteSort' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/FavoriteListJSONResponse' }
  /api/v1/favorites/{gameId}:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    put:
      operationId: putFavorite
      description: Idempotently favorites one currently visible game without changing an existing favoritedAtMs.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200': { $ref: '#/components/responses/FavoriteStateJSONResponse' }
  /api/v1/favorites/{gameId}/folders:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    put:
      operationId: putFavoriteFolders
      description: Atomically replaces the complete favorite-folder set for one visible game and favorites it when necessary.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/ReplaceFavoriteFolders' }
      responses:
        '200': { $ref: '#/components/responses/FavoriteStateJSONResponse' }
  /api/v1/favorites/organize:
    post:
      operationId: postFavoriteOrganize
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/OrganizeFavorites' }
      responses:
        '200': { $ref: '#/components/responses/FavoriteBatchJSONResponse' }
  /api/v1/favorites/unfavorite:
    post:
      operationId: postFavoriteUnfavorite
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/Unfavorite' }
      responses:
        '200': { $ref: '#/components/responses/UnfavoriteJSONResponse' }
  /api/v1/favorites/restore:
    post:
      operationId: postFavoriteRestore
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/RestoreFavorites' }
      responses:
        '200': { $ref: '#/components/responses/FavoriteRestoreJSONResponse' }
  /api/v1/favorite-folders:
    post:
      operationId: postFavoriteFolder
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/CreateFavoriteFolder' }
      responses:
        '201': { $ref: '#/components/responses/FavoriteFolderJSONResponse' }
  /api/v1/favorite-folders/{folderId}:
    parameters: [{ $ref: '#/components/parameters/FavoriteFolderID' }]
    patch:
      operationId: patchFavoriteFolder
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/PatchFavoriteFolder' }
      responses:
        '200': { $ref: '#/components/responses/FavoriteFolderJSONResponse' }
    delete:
      operationId: deleteFavoriteFolder
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '204': { description: Favorite folder deleted; favorites are retained }
  /api/v1/saves:
    get:
      operationId: getSaves
      description: Save states whose games belong to enabled platform directories. Each owner-filtered item includes its base platform, platform directory, locked core, availability, screenshot URL and nullable discIndex/discLabel; generatedAtMs gives grouped save views a stable response clock.
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/GameIDQuery' }, { $ref: '#/components/parameters/PlatformIDQuery' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/CoreIDQuery' }, { $ref: '#/components/parameters/Availability' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/saves/{saveStateId}:
    parameters: [{ $ref: '#/components/parameters/SaveStateID' }]
    patch:
      operationId: patchSave
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { $ref: '#/components/requestBodies/RenameSave' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    delete:
      operationId: deleteSave
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Deleted }
  /api/v1/launches:
    post:
      operationId: postLaunch
      description: Creates a launch only for a published game in an enabled platform directory.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Launch' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/netplay/games:
    get:
      operationId: getNetplayGames
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/NetplayAvailability' }]
      responses:
        '200': { $ref: '#/components/responses/NetplayGameListResponse' }
  /api/v1/netplay/rooms:
    get:
      operationId: getNetplayRooms
      parameters: [{ $ref: '#/components/parameters/NetplayRoomView' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/NetplayRoomListResponse' }
    post:
      operationId: postNetplayRoom
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '201': { $ref: '#/components/responses/NetplayRoomResponse' }
  /api/v1/netplay/rooms/{roomId}:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }]
    get:
      operationId: getNetplayRoom
      responses:
        '200': { $ref: '#/components/responses/NetplayRoomResponse' }
    delete:
      operationId: deleteNetplayRoom
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '204': { description: Room closed }
  /api/v1/netplay/rooms/{roomId}/game:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }]
    put:
      operationId: putNetplayRoomGame
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/NetplaySelectGame' }
      responses:
        '200': { $ref: '#/components/responses/NetplayRoomResponse' }
    delete:
      operationId: deleteNetplayRoomGame
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '200': { $ref: '#/components/responses/NetplayRoomResponse' }
  /api/v1/netplay/rooms/{roomId}/members/me/seat:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }]
    put:
      operationId: putNetplaySelfSeat
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/NetplaySeat' }
      responses:
        '200': { $ref: '#/components/responses/NetplayRoomResponse' }
  /api/v1/netplay/rooms/{roomId}/members/me/ready:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }]
    put:
      operationId: putNetplaySelfReady
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/NetplayReady' }
      responses:
        '200': { $ref: '#/components/responses/NetplayRoomResponse' }
  /api/v1/netplay/rooms/{roomId}/members/me:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }]
    delete:
      operationId: deleteNetplaySelfMember
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '204': { description: Member left }
  /api/v1/netplay/rooms/{roomId}/members/{memberId}:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }, { $ref: '#/components/parameters/NetplayMemberID' }]
    delete:
      operationId: deleteNetplayMember
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '204': { description: Guest removed }
  /api/v1/netplay/rooms/{roomId}/start:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }]
    post:
      operationId: postNetplayStart
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '202': { $ref: '#/components/responses/NetplayRoomResponse' }
  /api/v1/netplay/rooms/{roomId}/sessions/{sessionId}/launch:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }, { $ref: '#/components/parameters/NetplaySessionID' }]
    post:
      operationId: postNetplayLaunch
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/NetplayLaunch' }
      responses:
        '200': { $ref: '#/components/responses/NetplayLaunchResponse' }
        '201': { $ref: '#/components/responses/NetplayLaunchResponse' }
  /api/v1/netplay/rooms/{roomId}/sessions/{sessionId}/pause:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }, { $ref: '#/components/parameters/NetplaySessionID' }]
    post:
      operationId: postNetplayPause
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/netplay/rooms/{roomId}/sessions/{sessionId}/resume:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }, { $ref: '#/components/parameters/NetplaySessionID' }]
    post:
      operationId: postNetplayResume
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/netplay/rooms/{roomId}/sessions/{sessionId}/end:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }, { $ref: '#/components/parameters/NetplaySessionID' }]
    post:
      operationId: postNetplayEnd
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/netplay/rooms/{roomId}/events:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }]
    get:
      operationId: getNetplayRoomEvents
      parameters: [{ $ref: '#/components/parameters/LastEventID' }]
      responses:
        '200': { $ref: '#/components/responses/SSEResponse' }
  /runtime/netplay/rooms/{roomId}/socket:
    parameters: [{ $ref: '#/components/parameters/NetplayRoomID' }]
    get:
      operationId: getNetplaySocket
      description: WebSocket upgrade using subprotocol retrom.netplay.v1; credentials are accepted only from HttpOnly cookies.
      responses:
        '101': { description: WebSocket upgraded }
  /api/v1/admin/uploads:
    post:
      operationId: postAdminUpload
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreateUpload' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/uploads/{uploadId}:
    parameters: [{ $ref: '#/components/parameters/UploadID' }]
    get:
      operationId: getAdminUpload
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    delete:
      operationId: deleteAdminUpload
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Cancelled }
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/uploads/{uploadId}/files/{fileId}/parts/{partNo}:
    parameters:
      - { $ref: '#/components/parameters/UploadID' }
      - { $ref: '#/components/parameters/FileID' }
      - { $ref: '#/components/parameters/PartNo' }
    put:
      operationId: putAdminUploadPart
      x-retrom-streaming-body: true
      parameters:
        - { $ref: '#/components/parameters/ContentRange' }
        - { $ref: '#/components/parameters/ContentDigest' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Stored }
  /api/v1/admin/uploads/{uploadId}/complete:
    parameters: [{ $ref: '#/components/parameters/UploadID' }]
    post:
      operationId: postAdminUploadComplete
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/imports/summary:
    get:
      operationId: getAdminImportsSummary
      description: User-visible import overview. Browser/reconfigure ImportJobs, Pegasus imports, and EmulationStation imports each count once; per-game ImportJobs created only for server-import review handoff are excluded. `reviewPending` is the exact count of `REVIEW_PENDING` import items.
      responses:
        '200': { $ref: '#/components/responses/ImportOverviewSummaryResponse' }
  /api/v1/admin/imports:
    get:
      operationId: getAdminImports
      description: Cursor-paged browser/reconfigure ImportJobs. Per-game ImportJobs created internally by Pegasus or EmulationStation review handoff are excluded; aggregate server-import history is available from `/api/v1/admin/pegasus-imports` and `/api/v1/admin/emulationstation-imports`.
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/State' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit20' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    post:
      operationId: postAdminImport
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreateImport' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/imports/{importJobId}:
    parameters: [{ $ref: '#/components/parameters/ImportJobID' }]
    get:
      operationId: getAdminImport
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/imports/{importJobId}/events:
    parameters: [{ $ref: '#/components/parameters/ImportJobID' }]
    get:
      operationId: getAdminImportEvents
      parameters: [{ $ref: '#/components/parameters/LastEventID' }]
      responses:
        '200': { $ref: '#/components/responses/SSEResponse' }
  /api/v1/admin/imports/{importJobId}/cancel:
    parameters: [{ $ref: '#/components/parameters/ImportJobID' }]
    post:
      operationId: postAdminImportCancel
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/imports/{importJobId}/reconfigure:
    parameters: [{ $ref: '#/components/parameters/ImportJobID' }]
    post:
      operationId: postAdminImportReconfigure
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ReconfigureImport' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/import-items/{importItemId}/retry:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminImportItemRetry
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/jobs/{jobId}:
    parameters: [{ $ref: '#/components/parameters/JobID' }]
    get:
      operationId: getAdminJob
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/jobs/{jobId}/events:
    parameters: [{ $ref: '#/components/parameters/JobID' }]
    get:
      operationId: getAdminJobEvents
      parameters: [{ $ref: '#/components/parameters/LastEventID' }]
      responses:
        '200': { $ref: '#/components/responses/SSEResponse' }
  /api/v1/admin/jobs/{jobId}/cancel:
    parameters: [{ $ref: '#/components/parameters/JobID' }]
    post:
      operationId: postAdminJobCancel
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/jobs/{jobId}/retry:
    parameters: [{ $ref: '#/components/parameters/JobID' }]
    post:
      operationId: postAdminJobRetry
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/runtime-asset-packs:
    get:
      operationId: getAdminRuntimeAssetPacks
      description: Lists immutable RPG Maker runtime-pack definitions and their installations without exposing host paths or Blob identifiers.
      responses:
        '200': { $ref: '#/components/responses/RuntimeAssetPackListResponse' }
  /api/v1/admin/runtime-asset-packs/installations:
    post:
      operationId: postAdminRuntimeAssetPackInstallation
      description: Consumes one completed RUNTIME_ASSET_PACK upload and schedules bounded validation of one immutable installation.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/InstallRuntimeAssetPack' }
      responses:
        '202': { $ref: '#/components/responses/RuntimeAssetPackInstallResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '409': { $ref: '#/components/responses/RpgConflictResponse' }
        '413': { $ref: '#/components/responses/RpgPayloadTooLargeResponse' }
        '422': { $ref: '#/components/responses/RpgUnprocessableResponse' }
        '503': { $ref: '#/components/responses/RpgServiceUnavailableResponse' }
  /api/v1/admin/runtime-asset-packs/installations/{installationId}:
    parameters: [{ $ref: '#/components/parameters/RuntimeAssetPackInstallationID' }]
    delete:
      operationId: deleteAdminRuntimeAssetPackInstallation
      description: Deletes only an installation with zero variant and checkpoint references; referenced immutable installations cannot be removed.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Runtime asset pack installation scheduled for payload release }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '404': { $ref: '#/components/responses/RpgNotFoundResponse' }
        '409': { $ref: '#/components/responses/RpgConflictResponse' }
        '412': { $ref: '#/components/responses/RpgPreconditionFailedResponse' }
        '428': { $ref: '#/components/responses/PreconditionRequiredResponse' }
  /api/v1/admin/reviews:
    get:
      operationId: getAdminReviews
      description: Pending review summaries including sourceTotalSizeBytes, sourceMd5, a nullable coverUrl, and STANDARD/PEGASUS/EMULATIONSTATION source identity for compact queue previews.
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/TagIDQuery' }, { $ref: '#/components/parameters/ImportJobIDQuery' }, { $ref: '#/components/parameters/PegasusImportIDQuery' }, { $ref: '#/components/parameters/EmulationStationImportIDQuery' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/BlockerCode' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit20' }]
      responses:
        '200': { $ref: '#/components/responses/ReviewQueueListResponse' }
  /api/v1/admin/review-bulk-approval-preview:
    get:
      operationId: getAdminReviewBulkApprovalPreview
      description: Recomputes the current filtered review scope and returns only strict READY candidates; screenshot-only overrides and duplicates are excluded.
      parameters:
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/TagIDQuery' }
        - { $ref: '#/components/parameters/ImportJobIDQuery' }
        - { $ref: '#/components/parameters/PegasusImportIDQuery' }
        - { $ref: '#/components/parameters/EmulationStationImportIDQuery' }
        - { $ref: '#/components/parameters/PlatformInstanceIDQuery' }
        - { $ref: '#/components/parameters/BlockerCode' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/review-bulk-approvals:
    post:
      operationId: postAdminReviewBulkApproval
      description: Freezes the previewed strict READY candidates and starts a resumable sequential publication job.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ReviewBulkApproval' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/review-bulk-approvals/{bulkApprovalId}:
    parameters: [{ $ref: '#/components/parameters/BulkApprovalID' }]
    get:
      operationId: getAdminReviewBulkApproval
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/review-bulk-approvals/{bulkApprovalId}/items:
    parameters: [{ $ref: '#/components/parameters/BulkApprovalID' }]
    get:
      operationId: getAdminReviewBulkApprovalItems
      parameters:
        - name: outcome
          in: query
          schema: { type: string, enum: [PUBLISHED, SKIPPED_DUPLICATE, SKIPPED_CHANGED, SKIPPED_NOT_READY, FAILED_FINAL, CANCELLED] }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit50' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/review-bulk-approvals/{bulkApprovalId}/cancel:
    parameters: [{ $ref: '#/components/parameters/BulkApprovalID' }]
    post:
      operationId: postAdminReviewBulkApprovalCancel
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/review-bulk-approvals/{bulkApprovalId}/retry:
    parameters: [{ $ref: '#/components/parameters/BulkApprovalID' }]
    post:
      operationId: postAdminReviewBulkApprovalRetry
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    get:
      operationId: getAdminReview
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    patch:
      operationId: patchAdminReview
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { $ref: '#/components/requestBodies/ReviewDraft' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/runtime-validations:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewRuntimeValidation
      description: Freezes the current RPG Maker source, selected version core, route, artifact and runtime-pack binding into a fifteen-minute validation Launch.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/RpgRuntimeValidationLaunchBody' }
      responses:
        '201': { $ref: '#/components/responses/RpgRuntimeValidationLaunchResponse' }
        '404': { $ref: '#/components/responses/RpgNotFoundResponse' }
        '409': { $ref: '#/components/responses/RpgConflictResponse' }
        '422': { $ref: '#/components/responses/RpgUnprocessableResponse' }
  /api/v1/admin/reviews/{importItemId}/runtime-validations/{validationId}:
    parameters:
      - { $ref: '#/components/parameters/ImportItemID' }
      - { $ref: '#/components/parameters/RpgRuntimeValidationID' }
    get:
      operationId: getAdminReviewRuntimeValidation
      description: Returns frozen route evidence, ordered machine gates, the cross-Launch checkpoint round trip and the immutable reviewer decision without returning credentials.
      responses:
        '200': { $ref: '#/components/responses/RpgRuntimeValidationResponse' }
        '404': { $ref: '#/components/responses/RpgNotFoundResponse' }
  /api/v1/admin/reviews/{importItemId}/runtime-validations/{validationId}/restore-launch:
    parameters:
      - { $ref: '#/components/parameters/ImportItemID' }
      - { $ref: '#/components/parameters/RpgRuntimeValidationID' }
    post:
      operationId: postAdminReviewRuntimeValidationRestoreLaunch
      description: Creates exactly one restore Launch after the original validation Launch ended and its temporary checkpoint was fully persisted; idempotent replay returns that same distinct Launch.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/RpgRuntimeValidationLaunchBody' }
      responses:
        '201': { $ref: '#/components/responses/RpgRuntimeValidationLaunchResponse' }
        '404': { $ref: '#/components/responses/RpgNotFoundResponse' }
        '409': { $ref: '#/components/responses/RpgConflictResponse' }
        '422': { $ref: '#/components/responses/RpgUnprocessableResponse' }
  /api/v1/admin/reviews/{importItemId}/runtime-validations/{validationId}/decision:
    parameters:
      - { $ref: '#/components/parameters/ImportItemID' }
      - { $ref: '#/components/parameters/RpgRuntimeValidationID' }
    post:
      operationId: postAdminReviewRuntimeValidationDecision
      description: Records PASS only after every required machine gate proves a new-Launch restore at the saved in-game position; any binding drift or failed gate is non-overridable.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/RpgRuntimeValidationDecision' }
      responses:
        '200': { $ref: '#/components/responses/RpgRuntimeValidationResponse' }
        '404': { $ref: '#/components/responses/RpgNotFoundResponse' }
        '409': { $ref: '#/components/responses/RpgConflictResponse' }
        '422': { $ref: '#/components/responses/RpgUnprocessableResponse' }
  /api/v1/admin/reviews/{importItemId}/scrape-candidates:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewScrapeCandidates
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/MetadataProvider' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/assets:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewAsset
      description: Validates a completed local image upload and records an immutable manual review asset. Selection is persisted separately through the review draft PATCH.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ReviewAsset' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/previews:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewPreview
      description: Creates a short-lived, capability-scoped browser preview from the immutable review source. Missing Parent or BIOS dependencies are omitted instead of blocking preview creation. Every preview captures one runtime screenshot five seconds after the core reports game start; a current screenshot may be used by an administrator to publish despite dependency blockers.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ReviewPreview' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/arcade-parent-attachments:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewArcadeParentAttachment
      description: Queues strict validation of one completed ZIP upload against a missing or mismatched Parent machine in the review draft's locked Arcade DAT closure.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ReviewArcadeParentAttachment' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/multi-disc-attachments:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewMultiDiscAttachment
      description: Queues validation of one completed FILES upload containing exactly every currently missing CHD.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ReviewMultiDiscAttachment' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/approve:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewApprove
      description: Publishes a current READY validation, or a current blocked validation that has a five-second runtime screenshot captured by its matching review preview. Screenshot overrides remain explicit in immutable review evidence and the published Variant compatibility code.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Approval' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/reviews/{importItemId}/discard:
    parameters: [{ $ref: '#/components/parameters/ImportItemID' }]
    post:
      operationId: postAdminReviewDiscard
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ApprovalReason' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/review-history:
    get:
      operationId: getAdminReviewHistory
      description: Review decision summaries; selecting a row can load the immutable metadata snapshot captured at decision time.
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/Decision' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/FromAtMs' }, { $ref: '#/components/parameters/ToAtMs' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/review-history/{reviewEventId}:
    parameters: [{ $ref: '#/components/parameters/ReviewEventID' }]
    get:
      operationId: getAdminReviewHistoryEvent
      description: Immutable textual and structured metadata/evidence captured for an approved or discarded review decision. Terminal review history intentionally contains no replayable cover, video, Blob, URL, path, hash, dimensions, MIME type, or other CAS payload reference.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/tags:
    get:
      operationId: getAdminTags
      description: Lists instance-wide administrator-managed tags and current or historical usage counts.
      parameters:
        - { $ref: '#/components/parameters/Q80' }
        - { $ref: '#/components/parameters/TagStatus' }
        - { $ref: '#/components/parameters/TagSort' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/TagListResponse' }
    post:
      operationId: postAdminTag
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreateTag' }
      responses:
        '201': { $ref: '#/components/responses/TagAdminItemResponse' }
  /api/v1/admin/tags/defaults:
    post:
      operationId: postAdminTagDefaults
      description: Atomically creates every missing tag from the editable common-tag template and leaves existing active tags unchanged.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200': { $ref: '#/components/responses/CommonTagsApplyResponse' }
  /api/v1/admin/tags/{tagId}:
    parameters: [{ $ref: '#/components/parameters/TagID' }]
    get:
      operationId: getAdminTag
      responses:
        '200': { $ref: '#/components/responses/TagAdminItemResponse' }
    patch:
      operationId: patchAdminTag
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/RenameTag' }
      responses:
        '200': { $ref: '#/components/responses/TagAdminItemResponse' }
    delete:
      operationId: deleteAdminTag
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/DeleteTag' }
      responses:
        '204':
          description: Tag soft-deleted; retained relationships are historical only.
          headers: { ETag: { schema: { type: string } } }
  /api/v1/admin/games:
    get:
      operationId: getAdminGames
      description: Lists every managed game with platform/directory/default-core identity, cover, release year, metadata completeness, current default-core runtime status, visibility, creation/update/play timestamps, and cursor pagination.
      parameters: [{ $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/TagIDQuery' }, { $ref: '#/components/parameters/PlatformIDQuery' }, { $ref: '#/components/parameters/PlatformInstanceIDQuery' }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/games/{gameId}:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    get:
      operationId: getAdminGame
      description: Returns the complete management workbench projection and a generatedAtMs timestamp for deterministic relative-time presentation.
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    patch:
      operationId: patchAdminGame
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { $ref: '#/components/requestBodies/MetadataFields' }
      responses:
        '200': { $ref: '#/components/responses/JSONResponse' }
    delete:
      operationId: deleteAdminGame
      description: Permanently releases every game-owned and game-runtime payload while retaining a textual tombstone and relationship/history records. The impact digest must match the current management projection.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/DeleteGame' }
      responses:
        '200':
          $ref: '#/components/responses/JSONResponse'
        '202':
          $ref: '#/components/responses/JSONResponse'
  /api/v1/admin/games/{gameId}/tags:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    put:
      operationId: putAdminGameTags
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ReplaceGameTags' }
      responses:
        '200': { $ref: '#/components/responses/GameTagsResponse' }
  /api/v1/admin/games/{gameId}/assets:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    post:
      operationId: postAdminGameAsset
      description: Creates a complete current media revision, retires all prior GameAsset leaves, and stages newly unreferenced payload for retention-aware GC.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/GameAsset' }
      responses:
        '201': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/games/{gameId}/assets/{assetKind}:
    parameters: [{ $ref: '#/components/parameters/GameID' }, { $ref: '#/components/parameters/GameAssetKind' }]
    delete:
      operationId: deleteAdminGameAsset
      description: Removes the selected media kind by creating a new immutable metadata revision with the remaining complete media set, then retires prior GameAsset leaves.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Asset kind removed }
  /api/v1/admin/games/{gameId}/content-revisions:
    parameters: [{ $ref: '#/components/parameters/GameID' }]
    post:
      operationId: postAdminGameContentRevision
      description: Schedules a destructive complete content replacement. Byte-identical single-ROM content or the same ordered multi-disc hashes fail terminally with GAME_CONTENT_UNCHANGED. A successful switch retires old content/runtime payload and deletes saves bound to superseded revisions; a failed replacement changes none of them. contentMode defaults strictly to STANDARD; MULTI_DISC_M3U_V1 requires a complete DIRECTORY upload and never uses review attachment repair.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/UploadReference' }
      responses:
        '202': { $ref: '#/components/responses/JSONResponse' }
  /api/v1/admin/games/{gameId}/scrape-candidates:
