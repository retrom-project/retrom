      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/PegasusImportResponse' }
        '202': { $ref: '#/components/responses/PegasusImportResponse' }
  /api/v1/admin/pegasus-imports/{pegasusImportId}/retry:
    parameters: [{ $ref: '#/components/parameters/PegasusImportID' }]
    post:
