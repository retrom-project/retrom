        reasonCode: { type: string, enum: [DATABASE_UNAVAILABLE, CAS_UNAVAILABLE, DEPENDENCY_INVALID, DEPENDENCY_DAT_PARSE_FAILED, DEPENDENCY_INDEXING] }
    Session:
