  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;
  margin: 0 !important;

}

.text-destructive {

}

            &lt;tr&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;MAME 2003&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;Core 0.78 · DAT MAME 0.78&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rt-bios-file&quot;&gt;&lt;span class=&quot;rt-file-icon&quot;&gt;&lt;i data-lucide=&quot;file-archive&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;rt-table-title&quot;&gt;neogeo.zip&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;与 FBNeo 同名但要求独立&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/td&gt;&lt;td&gt;4 个变体&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-mono&quot;&gt;未上传&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-badge rt-badge-red&quot;&gt;缺失&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button rt-button-primary&quot;&gt;上传&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;MAME 2003 Plus&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;EmulatorJS 4.2.3 · bound source 09e84fe&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rt-bios-file&quot;&gt;&lt;span class=&quot;rt-file-icon&quot;&gt;&lt;i data-lucide=&quot;file-archive&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;rt-table-title&quot;&gt;pgm.zip&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;PGM System BIOS&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/td&gt;&lt;td&gt;2 个变体&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-mono&quot;&gt;按活动 DAT 校验&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-badge rt-badge-amber&quot;&gt;2 项哈希不同&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button&quot;&gt;查看 / 替换&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;FBNeo&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;EmulatorJS 4.2.3 · DAT 1.0.0.03&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rt-bios-file&quot;&gt;&lt;span class=&quot;rt-file-icon&quot;&gt;&lt;i data-lucide=&quot;package-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;rt-table-title&quot;&gt;ym2608&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;已包含在游戏 archive&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/td&gt;&lt;td&gt;1 个变体&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-mono&quot;&gt;由内容满足&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-badge rt-badge-green&quot;&gt;无需上传&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button&quot;&gt;查看来源&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;div data-bios-panel=&quot;dats&quot; hidden&gt;
          &lt;div class=&quot;rt-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;核心 DAT 目录&lt;/h2&gt;&lt;p class=&quot;rt-subtitle&quot;&gt;上传只创建候选；解析并查看差异后才可显式启用&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button rt-button-primary&quot;&gt;&lt;i data-lucide=&quot;file-up&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;上传 DAT&lt;/button&gt;&lt;/div&gt;
          &lt;div class=&quot;rt-setting-note&quot;&gt;上传 → 安全校验与后台解析 → 查看 BIOS / parent 依赖差异 → 显式启用 → 分批重校验 GameVariant；系统预置版本始终可回滚。&lt;/div&gt;
          &lt;div class=&quot;rt-panel rt-table-wrap&quot;&gt;&lt;table class=&quot;rt-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;核心&lt;/th&gt;&lt;th&gt;当前生效 DAT&lt;/th&gt;&lt;th&gt;来源&lt;/th&gt;&lt;th&gt;解析结果&lt;/th&gt;&lt;th&gt;影响范围&lt;/th&gt;&lt;th&gt;状态&lt;/th&gt;&lt;th&gt;操作&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;FBNeo&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;EmulatorJS 4.2.3 · source c8c70ba&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;fbneo-arcade.dat&lt;/div&gt;&lt;div class=&quot;rt-table-sub rt-mono&quot;&gt;SHA-256 · 9960…3637&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-badge&quot;&gt;系统预置&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;7,980 machines&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;13 个显式 BIOS machines&lt;/div&gt;&lt;/td&gt;&lt;td&gt;2 个平台目录&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-badge rt-badge-green&quot;&gt;生效中&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button&quot;&gt;查看差异&lt;/button&gt; &lt;button type=&quot;button&quot; class=&quot;rt-button&quot;&gt;上传新版本&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;MAME 2003&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;DAT source 0ee1c0e · Core 4.2.1 覆盖&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;mame2003.xml&lt;/div&gt;&lt;div class=&quot;rt-table-sub rt-mono&quot;&gt;SHA-256 · dacf…a147&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-badge&quot;&gt;系统预置&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;4,727 machines&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;17 个 base dependency targets&lt;/div&gt;&lt;/td&gt;&lt;td&gt;1 个平台目录&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-badge rt-badge-green&quot;&gt;生效中&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button&quot;&gt;查看差异&lt;/button&gt; &lt;button type=&quot;button&quot; class=&quot;rt-button&quot;&gt;上传新版本&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;MAME 2003 Plus&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;EmulatorJS 4.2.3 · source 09e84fe&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;mame2003-plus.xml&lt;/div&gt;&lt;div class=&quot;rt-table-sub rt-mono&quot;&gt;SHA-256 · e110…303c&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-badge&quot;&gt;系统预置&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;5,257 machines&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;17 个 base dependency targets&lt;/div&gt;&lt;/td&gt;&lt;td&gt;0 个平台目录&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-badge rt-badge-green&quot;&gt;生效中&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button&quot;&gt;查看差异&lt;/button&gt; &lt;button type=&quot;button&quot; class=&quot;rt-button&quot;&gt;上传新版本&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;
    &lt;/main&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;retrom-ui-review&#x27;);
      const modeButton = root.querySelector(&#x27;#rt-mode-button&#x27;);
      const modeLabel = root.querySelector(&#x27;#rt-mode-label&#x27;);
      const breadcrumbMode = root.querySelector(&#x27;#rt-breadcrumb-mode&#x27;);
      const breadcrumbPage = root.querySelector(&#x27;#rt-breadcrumb-page&#x27;);
      let mode = &#x27;user&#x27;;

      const pageNames = {
        home: &#x27;首页&#x27;, library: &#x27;游戏库&#x27;, saves: &#x27;我的存档&#x27;, detail: &#x27;游戏详情&#x27;, play: &#x27;游玩&#x27;,
        &#x27;admin-import&#x27;: &#x27;游戏入库&#x27;, &#x27;admin-import-new&#x27;: &#x27;导入文件 / 目录&#x27;, &#x27;admin-import-tasks&#x27;: &#x27;任务进度&#x27;,
        &#x27;admin-review&#x27;: &#x27;待审核&#x27;, &#x27;admin-review-history&#x27;: &#x27;审核历史&#x27;, &#x27;admin-games&#x27;: &#x27;游戏管理&#x27;, &#x27;admin-game-detail&#x27;: &#x27;游戏管理详情&#x27;, &#x27;admin-platform-instances&#x27;: &#x27;平台目录&#x27;, &#x27;admin-bios&#x27;: &#x27;BIOS 管理&#x27;
      };
      const ingestionPages = new Set([&#x27;admin-import&#x27;, &#x27;admin-import-new&#x27;, &#x27;admin-import-tasks&#x27;, &#x27;admin-review&#x27;, &#x27;admin-review-history&#x27;]);

      function showPage(page) {
        const activeNavigationTarget = page === &#x27;detail&#x27; ? &#x27;library&#x27; : page === &#x27;admin-game-detail&#x27; ? &#x27;admin-games&#x27; : page;
        root.querySelector(&#x27;.rt-app&#x27;).classList.toggle(&#x27;is-playing&#x27;, page === &#x27;play&#x27;);
        root.querySelectorAll(&#x27;.rt-page&#x27;).forEach((element) =&gt; element.classList.toggle(&#x27;is-active&#x27;, element.dataset.page === page));
        root.querySelectorAll(&#x27;.rt-nav-button&#x27;).forEach((button) =&gt; button.classList.toggle(&#x27;is-active&#x27;, button.dataset.pageTarget === activeNavigationTarget));
        root.querySelector(&#x27;[data-ingest-parent]&#x27;).classList.toggle(&#x27;is-context&#x27;, page !== &#x27;admin-import&#x27; &amp;&amp; ingestionPages.has(page));
        breadcrumbPage.textContent = page !== &#x27;admin-import&#x27; &amp;&amp; ingestionPages.has(page)
          ? `游戏入库 / ${pageNames[page]}`
          : page === &#x27;admin-game-detail&#x27;
            ? &#x27;游戏管理 / 游戏详情&#x27;
            : (pageNames[page] || &#x27;页面&#x27;);
      }

      root.querySelectorAll(&#x27;[data-page-target]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showPage(button.dataset.pageTarget)));
      root.querySelectorAll(&#x27;[data-page-link]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showPage(button.dataset.pageLink)));

      function setMode(nextMode) {
        mode = nextMode;
        root.querySelectorAll(&#x27;[data-nav-mode]&#x27;).forEach((group) =&gt; { group.hidden = group.dataset.navMode !== mode; });
        modeLabel.textContent = mode === &#x27;user&#x27; ? &#x27;Play space&#x27; : &#x27;Administration&#x27;;
        breadcrumbMode.textContent = mode === &#x27;user&#x27; ? &#x27;用户侧&#x27; : &#x27;管理后台&#x27;;
        modeButton.querySelector(&#x27;span&#x27;).textContent = mode === &#x27;user&#x27; ? &#x27;管理后台&#x27; : &#x27;返回用户侧&#x27;;
        showPage(mode === &#x27;user&#x27; ? &#x27;home&#x27; : &#x27;admin-import&#x27;);
      }

      modeButton.addEventListener(&#x27;click&#x27;, () =&gt; setMode(mode === &#x27;user&#x27; ? &#x27;admin&#x27; : &#x27;user&#x27;));

      let currentGame = &#x27;metal&#x27;;
      const gameDetails = {
        metal: {
          title: &#x27;Metal Slug&#x27;, coverTitle: &#x27;METAL SLUG&#x27;, coverClass: &#x27;rt-cover-b&#x27;, platform: &#x27;Arcade / FBNeo 游戏列表 · 1996&#x27;, directory: &#x27;FBNeo 游戏列表&#x27;,
          meta: [&#x27;SNK&#x27;, &#x27;动作 / 射击&#x27;, &#x27;1–2 人&#x27;], description: &#x27;驾驶载具、营救俘虏并一路突破敌军防线。当前 ROM 已用 FBNeo DAT 完成 parent / BIOS 依赖解析，另有两个兼容核心可供选择。&#x27;,
          hours: &#x27;2.4h&#x27;, publisher: &#x27;SNK&#x27;, saveName: &#x27;沙漠据点前&#x27;, saveCore: &#x27;FBNeo&#x27;, save: &#x27;今天 22:14 · FBNeo · 与当前核心兼容&#x27;, dos: false, ready: true,
          cores: [&#x27;FBNeo · 目录默认&#x27;, &#x27;MAME 2003 Plus · 兼容&#x27;, &#x27;MAME 2003 · 需验证&#x27;], check: &#x27;ROM、parent 与 BIOS 依赖均已满足&#x27;
        },
        doom: {
          title: &#x27;DOOM&#x27;, coverTitle: &#x27;DOOM&#x27;, coverClass: &#x27;rt-cover-c&#x27;, platform: &#x27;MS-DOS / DOS 经典游戏 · 1993&#x27;, directory: &#x27;DOS 经典游戏&#x27;,
          meta: [&#x27;id Software&#x27;, &#x27;第一人称射击&#x27;, &#x27;1 人&#x27;], description: &#x27;火星基地被恶魔占领。DOS 游戏在启动前可指定可执行程序，默认项由审核阶段确认，也可在每次启动时覆盖。&#x27;,
          hours: &#x27;1.8h&#x27;, publisher: &#x27;id Software&#x27;, saveName: &#x27;Phobos Lab&#x27;, saveCore: &#x27;DOSBox Pure&#x27;, save: &#x27;昨天 23:06 · DOSBox Pure · 与当前核心兼容&#x27;, dos: true, ready: true,
          cores: [&#x27;DOSBox Pure · 目录默认 / 必需线程模式&#x27;], check: &#x27;启动包完整，已识别 3 个可执行程序&#x27;
        },
        zelda: {
          title: &#x27;Zelda no Densetsu&#x27;, coverTitle: &#x27;ZELDA&#x27;, coverClass: &#x27;rt-cover-a&#x27;, platform: &#x27;Famicom Disk System / 磁碟冒险 · 1986&#x27;, directory: &#x27;磁碟冒险&#x27;,
          meta: [&#x27;Nintendo&#x27;, &#x27;动作 / 冒险&#x27;, &#x27;1 人&#x27;], description: &#x27;这是磁碟系统版本，FCEUmm 启动时必须加载 disksys.rom。游戏文件已通过识别，但当前系统缺少所需 BIOS。&#x27;,
          hours: &#x27;48m&#x27;, publisher: &#x27;Nintendo&#x27;, saveName: &#x27;迷失森林入口&#x27;, saveCore: &#x27;FCEUmm&#x27;, save: &#x27;8 月 3 日 · FCEUmm · 等待 BIOS&#x27;, dos: false, ready: false,
          cores: [&#x27;FCEUmm · 目录默认 / 缺少 BIOS&#x27;], check: &#x27;缺少 disksys.rom，上传后才能开始游戏&#x27;
        }
      };

      function openGame(key) {
        const game = gameDetails[key] || gameDetails.metal;
        currentGame = key in gameDetails ? key : &#x27;metal&#x27;;
        const cover = root.querySelector(&#x27;#rt-detail-cover&#x27;);
        cover.className = `rt-cover ${game.coverClass} rt-detail-cover`;
        root.querySelector(&#x27;#rt-detail-cover-title&#x27;).textContent = game.coverTitle;
        root.querySelector(&#x27;#rt-detail-platform&#x27;).textContent = game.platform;
        root.querySelector(&#x27;#rt-detail-title&#x27;).textContent = game.title;
        root.querySelector(&#x27;#rt-detail-meta&#x27;).innerHTML = game.meta.map((item) =&gt; `&lt;span&gt;${item}&lt;/span&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#rt-detail-description&#x27;).textContent = game.description;
        root.querySelector(&#x27;#rt-detail-hours&#x27;).textContent = game.hours;
        root.querySelector(&#x27;#rt-info-directory&#x27;).textContent = game.directory;
        root.querySelector(&#x27;#rt-info-publisher&#x27;).textContent = game.publisher;
        root.querySelector(&#x27;#rt-detail-save-title&#x27;).textContent = game.saveName;
        root.querySelector(&#x27;#rt-detail-save-meta&#x27;).textContent = game.save;
        root.querySelector(&#x27;#rt-dos-field&#x27;).hidden = !game.dos;
        root.querySelector(&#x27;#rt-core-select&#x27;).innerHTML = game.cores.map((item) =&gt; `&lt;option&gt;${item}&lt;/option&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#rt-core-origin&#x27;).textContent = `默认核心来自平台目录“${game.directory}”；切换只影响本次启动`;
        root.querySelector(&#x27;#rt-launch-check-text&#x27;).textContent = game.check;
        root.querySelector(&#x27;#rt-launch-ready&#x27;).textContent = game.ready ? &#x27;准备就绪&#x27; : &#x27;启动受阻&#x27;;
        root.querySelector(&#x27;#rt-launch-ready&#x27;).className = game.ready ? &#x27;rt-badge rt-badge-green&#x27; : &#x27;rt-badge rt-badge-red&#x27;;
        root.querySelector(&#x27;#rt-launch-check&#x27;).className = game.ready ? &#x27;rt-checkline&#x27; : &#x27;rt-checkline is-warning&#x27;;
        root.querySelectorAll(&#x27;[data-start-game]&#x27;).forEach((button) =&gt; { button.disabled = !game.ready; });
        root.querySelector(&#x27;[data-start-current-save]&#x27;).disabled = !game.ready;
        showPage(&#x27;detail&#x27;);
      }

      root.querySelectorAll(&#x27;[data-open-game]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; openGame(button.dataset.openGame)));

      root.querySelector(&#x27;#rt-core-select&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {
        const label = event.target.value;
        const blocked = label.includes(&#x27;缺少 BIOS&#x27;) || label.includes(&#x27;不兼容&#x27;);
        const needsValidation = label.includes(&#x27;需验证&#x27;);
        const status = root.querySelector(&#x27;#rt-launch-ready&#x27;);
        const checkline = root.querySelector(&#x27;#rt-launch-check&#x27;);
        if (blocked) {
          status.textContent = &#x27;启动受阻&#x27;;
          status.className = &#x27;rt-badge rt-badge-red&#x27;;
          checkline.className = &#x27;rt-checkline is-warning&#x27;;
        } else if (needsValidation) {
          status.textContent = &#x27;启动时验证&#x27;;
          status.className = &#x27;rt-badge rt-badge-amber&#x27;;
          checkline.className = &#x27;rt-checkline is-warning&#x27;;
          root.querySelector(&#x27;#rt-launch-check-text&#x27;).textContent = &#x27;将使用所选核心的 DAT / 文件规则创建兼容性结果&#x27;;
        } else {
          status.textContent = &#x27;准备就绪&#x27;;
          status.className = &#x27;rt-badge rt-badge-green&#x27;;
          checkline.className = &#x27;rt-checkline&#x27;;
          root.querySelector(&#x27;#rt-launch-check-text&#x27;).textContent = gameDetails[currentGame].check;
        }
        root.querySelectorAll(&#x27;[data-start-game]&#x27;).forEach((button) =&gt; { button.disabled = blocked; });
      });

      let playerReturnPage = &#x27;detail&#x27;;
      let playerRunToken = 0;

      function requestPlayerFullscreen() {
        const fullscreenTarget = document.documentElement;
        if (document.fullscreenElement || !fullscreenTarget.requestFullscreen) return;
        fullscreenTarget.requestFullscreen({ navigationUI: &#x27;hide&#x27; }).catch(() =&gt; {
          const state = root.querySelector(&#x27;#rt-player-launch-state&#x27;);
          state.textContent = &#x27;运行中 · 浏览器未允许全屏，可用右上角重试&#x27;;
          state.classList.remove(&#x27;is-loading&#x27;);
        });
      }

      function startGame(key, { fromSave = false, returnPage = &#x27;detail&#x27; } = {}) {
        const game = gameDetails[key] || gameDetails.metal;
        if (!game.ready) return;
        currentGame = key in gameDetails ? key : &#x27;metal&#x27;;
        playerReturnPage = returnPage;
        const runToken = ++playerRunToken;
        const selectedCore = fromSave ? game.saveCore : root.querySelector(&#x27;#rt-core-select&#x27;).value;
        const needsValidation = !fromSave &amp;&amp; selectedCore.includes(&#x27;需验证&#x27;);
        const state = root.querySelector(&#x27;#rt-player-launch-state&#x27;);
        const stageState = root.querySelector(&#x27;#rt-player-stage-state&#x27;);
        root.querySelector(&#x27;#rt-player-game&#x27;).textContent = game.title;
        root.querySelector(&#x27;#rt-player-core&#x27;).textContent = fromSave
          ? `${selectedCore} · 正在恢复“${game.saveName}”`
          : needsValidation
            ? `${selectedCore.split(&#x27; · &#x27;)[0]} · 正在验证核心兼容性`
            : `${selectedCore.split(&#x27; · &#x27;)[0]} · 正在创建新会话`;
        state.textContent = needsValidation
          ? &#x27;验证中 · 复用共享兼容性任务 · 退出等待不会取消任务&#x27;
          : &#x27;启动中 · 自动预检并加载 EmulatorJS&#x27;;
        stageState.textContent = needsValidation
          ? &#x27;正在验证核心兼容性 · 完成后自动继续，无第二个开始按钮&#x27;
          : &#x27;正在加载 EmulatorJS · 无第二个开始按钮&#x27;;
        state.classList.add(&#x27;is-loading&#x27;);
        showPage(&#x27;play&#x27;);
        requestPlayerFullscreen();
        if (needsValidation) window.setTimeout(() =&gt; {
          if (runToken !== playerRunToken) return;
          state.textContent = &#x27;验证中 · 正在生成依赖包&#x27;;
          root.querySelector(&#x27;#rt-player-core&#x27;).textContent = `${selectedCore.split(&#x27; · &#x27;)[0]} · 兼容性检查通过`;
        }, 650);
        window.setTimeout(() =&gt; {
          if (runToken !== playerRunToken) return;
          root.querySelector(&#x27;#rt-player-core&#x27;).textContent = `${selectedCore.split(&#x27; · &#x27;)[0]} · 本次游玩 00:00:01`;
          state.textContent = document.fullscreenElement
            ? &#x27;运行中 · 自动启动 · 已进入全屏&#x27;
            : &#x27;运行中 · 自动启动 · 全屏请求未获允许&#x27;;
          stageState.textContent = &#x27;一次点击后已自动运行 · 已连接控制器 1&#x27;;
          state.classList.remove(&#x27;is-loading&#x27;);
        }, needsValidation ? 1300 : 650);
      }

      root.querySelectorAll(&#x27;[data-start-game]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!button.disabled) startGame(currentGame, { returnPage: &#x27;detail&#x27; });
      }));
      root.querySelector(&#x27;[data-start-current-save]&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        if (!event.currentTarget.disabled) startGame(currentGame, { fromSave: true, returnPage: &#x27;detail&#x27; });
      });
      root.querySelectorAll(&#x27;[data-quick-start]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (button.disabled) return;
        const sourcePage = button.closest(&#x27;[data-page]&#x27;)?.dataset.page || &#x27;home&#x27;;
        startGame(button.dataset.quickStart, { fromSave: true, returnPage: sourcePage });
      }));
      root.querySelector(&#x27;#rt-enter-fullscreen&#x27;).addEventListener(&#x27;click&#x27;, requestPlayerFullscreen);
      root.querySelector(&#x27;#rt-exit-player&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        playerRunToken += 1;
        const returnToSource = () =&gt; showPage(playerReturnPage);
        if (document.fullscreenElement) document.exitFullscreen().then(returnToSource, returnToSource);
        else returnToSource();
      });

      root.querySelector(&#x27;[data-cancel-job]&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = &#x27;正在取消&#x27;;
        const rowStatus = button.closest(&#x27;.rt-job-row&#x27;).querySelector(&#x27;.rt-badge&#x27;);
        rowStatus.textContent = &#x27;正在取消 · 67%&#x27;;
        rowStatus.className = &#x27;rt-badge rt-badge-amber&#x27;;
        const detailStatus = root.querySelector(&#x27;#rt-task-detail-status&#x27;);
        detailStatus.textContent = &#x27;正在取消&#x27;;
        detailStatus.className = &#x27;rt-badge rt-badge-amber&#x27;;
        root.querySelector(&#x27;#rt-job-cancel-note&#x27;).textContent = &#x27;已提交取消请求；Worker 会在下一个有界检查点停止并清理 scratch。状态仍不是“已取消”，已完成条目也不会回滚。&#x27;;
      });

      root.querySelectorAll(&#x27;[data-bios-view]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;[data-bios-view]&#x27;).forEach((peer) =&gt; peer.classList.toggle(&#x27;is-active&#x27;, peer === button));
        root.querySelectorAll(&#x27;[data-bios-panel]&#x27;).forEach((panel) =&gt; { panel.hidden = panel.dataset.biosPanel !== button.dataset.biosView; });
      }));

      root.querySelectorAll(&#x27;.rt-candidate&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;.rt-candidate&#x27;).forEach((peer) =&gt; peer.classList.toggle(&#x27;is-selected&#x27;, peer === button));
      }));

      root.querySelectorAll(&#x27;[data-review-item]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelector(&#x27;[data-review-workspace]&#x27;).classList.add(&#x27;is-detail-open&#x27;);
        root.querySelectorAll(&#x27;[data-review-item]&#x27;).forEach((peer) =&gt; {
          peer.classList.toggle(&#x27;is-selected&#x27;, peer === button);
          peer.setAttribute(&#x27;aria-current&#x27;, peer === button ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
        root.querySelector(&#x27;[data-review-position]&#x27;).textContent = button.dataset.reviewPositionValue;
        root.querySelector(&#x27;[data-review-file-output]&#x27;).textContent = button.dataset.reviewFile;
        root.querySelector(&#x27;[data-review-preview-output]&#x27;).textContent = button.dataset.reviewPreview;
        root.querySelector(&#x27;[data-review-field=&quot;title&quot;]&#x27;).value = button.dataset.reviewTitle;
        root.querySelector(&#x27;[data-review-field=&quot;year&quot;]&#x27;).value = button.dataset.reviewYear;
        root.querySelector(&#x27;[data-review-field=&quot;developer&quot;]&#x27;).value = button.dataset.reviewDeveloper;
        root.querySelector(&#x27;[data-review-field=&quot;players&quot;]&#x27;).value = button.dataset.reviewPlayers;
        root.querySelector(&#x27;[data-review-field=&quot;description&quot;]&#x27;).value = button.dataset.reviewDescription;
        root.querySelector(&#x27;[data-review-candidate-title]&#x27;).textContent = button.dataset.reviewCandidate;
        root.querySelector(&#x27;[data-review-candidate-meta]&#x27;).textContent = button.dataset.reviewCandidateMeta;
        const candidateBadge = root.querySelector(&#x27;[data-review-candidate-badge]&#x27;);
        candidateBadge.textContent = button.dataset.reviewCandidateBadge;
        candidateBadge.className = button.dataset.reviewCandidateBadge === &#x27;精确&#x27; ? &#x27;rt-badge rt-badge-green&#x27; : &#x27;rt-badge rt-badge-amber&#x27;;
        const validation = root.querySelector(&#x27;[data-review-validation-output]&#x27;);
        validation.textContent = button.dataset.reviewValidation;
        validation.classList.toggle(&#x27;is-warning&#x27;, button.dataset.reviewValidationStatus !== &#x27;READY&#x27;);
        root.querySelector(&#x27;[data-review-approve]&#x27;).disabled = button.dataset.reviewValidationStatus !== &#x27;READY&#x27;;
      }));
      root.querySelector(&#x27;[data-review-back]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelector(&#x27;[data-review-workspace]&#x27;).classList.remove(&#x27;is-detail-open&#x27;);
      });

      root.querySelectorAll(&#x27;.rt-chip&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const group = button.closest(&#x27;[data-chip-group]&#x27;) || root;
        group.querySelectorAll(&#x27;.rt-chip&#x27;).forEach((peer) =&gt; peer.classList.toggle(&#x27;is-active&#x27;, peer === button));
      }));

      const applyRequestedView = (requestedView) =&gt; {
        if (requestedView.startsWith(&#x27;game-&#x27;)) {
          setMode(&#x27;user&#x27;);
          openGame(requestedView.slice(5));
        } else if (requestedView === &#x27;admin-bios-dats&#x27;) {
          setMode(&#x27;admin&#x27;);
          showPage(&#x27;admin-bios&#x27;);
          root.querySelector(&#x27;[data-bios-view=&quot;dats&quot;]&#x27;).click();
        } else if (requestedView.startsWith(&#x27;admin-&#x27;) &amp;&amp; pageNames[requestedView]) {
          setMode(&#x27;admin&#x27;);
          showPage(requestedView);
        } else if (pageNames[requestedView]) {
          if ([&#x27;home&#x27;, &#x27;library&#x27;, &#x27;saves&#x27;].includes(requestedView)) setMode(&#x27;user&#x27;);
          showPage(requestedView);
        }
      };

      applyRequestedView(window.location.hash.slice(1));
      window.addEventListener(&#x27;message&#x27;, (event) =&gt; {
        if (event.data?.type === &#x27;retrom-view&#x27;) applyRequestedView(event.data.view || &#x27;&#x27;);
      });
      window.parent.postMessage({ type: &#x27;retrom-ready&#x27; }, &#x27;*&#x27;);

      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;

<script>
(() => {
