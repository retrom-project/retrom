    #retrom-ui-review {

            &lt;tr&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;MAME 2003 Plus&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;增强兼容目录&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;mame2003-plus.xml&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;与当前运行方式匹配&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-badge&quot;&gt;系统预置&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;rt-table-title&quot;&gt;5,257 个游戏&lt;/div&gt;&lt;div class=&quot;rt-table-sub&quot;&gt;17 个依赖目标&lt;/div&gt;&lt;/td&gt;&lt;td&gt;0 个平台目录&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rt-badge rt-badge-green&quot;&gt;生效中&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button&quot;&gt;查看差异&lt;/button&gt; &lt;button type=&quot;button&quot; class=&quot;rt-button&quot;&gt;上传新版本&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;

      &lt;div class=&quot;rt-compare-grid&quot;&gt;
        &lt;section class=&quot;rt-compare-panel&quot;&gt;&lt;h3&gt;当前信息 · 不可编辑&lt;/h3&gt;&lt;div class=&quot;rt-form-grid&quot;&gt;&lt;label class=&quot;rt-field&quot;&gt;&lt;span class=&quot;rt-label&quot;&gt;游戏标题&lt;/span&gt;&lt;input class=&quot;rt-input&quot; value=&quot;Metal Slug 3&quot; readonly&gt;&lt;/label&gt;&lt;label class=&quot;rt-field&quot;&gt;&lt;span class=&quot;rt-label&quot;&gt;发行年份&lt;/span&gt;&lt;input class=&quot;rt-input&quot; value=&quot;2000&quot; readonly&gt;&lt;/label&gt;&lt;label class=&quot;rt-field&quot;&gt;&lt;span class=&quot;rt-label&quot;&gt;开发商&lt;/span&gt;&lt;input class=&quot;rt-input&quot; value=&quot;SNK&quot; readonly&gt;&lt;/label&gt;&lt;label class=&quot;rt-field&quot;&gt;&lt;span class=&quot;rt-label&quot;&gt;玩家人数&lt;/span&gt;&lt;input class=&quot;rt-input&quot; value=&quot;1–2&quot; readonly&gt;&lt;/label&gt;&lt;label class=&quot;rt-field rt-field-wide&quot;&gt;&lt;span class=&quot;rt-label&quot;&gt;简介&lt;/span&gt;&lt;textarea class=&quot;rt-textarea&quot; readonly&gt;阻止莫丁元帅的叛乱，并揭开外星入侵背后的秘密。&lt;/textarea&gt;&lt;/label&gt;&lt;/div&gt;&lt;/section&gt;
        &lt;section class=&quot;rt-compare-panel&quot;&gt;&lt;h3&gt;最新查询 · 可编辑&lt;/h3&gt;&lt;div class=&quot;rt-form-grid&quot;&gt;&lt;label class=&quot;rt-field is-same&quot;&gt;&lt;span class=&quot;rt-label&quot;&gt;游戏标题 · 一致&lt;/span&gt;&lt;input class=&quot;rt-input&quot; value=&quot;Metal Slug 3&quot;&gt;&lt;/label&gt;&lt;label class=&quot;rt-field is-same&quot;&gt;&lt;span class=&quot;rt-label&quot;&gt;发行年份 · 一致&lt;/span&gt;&lt;input class=&quot;rt-input&quot; value=&quot;2000&quot;&gt;&lt;/label&gt;&lt;label class=&quot;rt-field is-changed&quot;&gt;&lt;span class=&quot;rt-label&quot;&gt;开发商 · 已变化&lt;/span&gt;&lt;input class=&quot;rt-input&quot; value=&quot;SNK Corporation&quot;&gt;&lt;/label&gt;&lt;label class=&quot;rt-field is-same&quot;&gt;&lt;span class=&quot;rt-label&quot;&gt;玩家人数 · 一致&lt;/span&gt;&lt;input class=&quot;rt-input&quot; value=&quot;1–2&quot;&gt;&lt;/label&gt;&lt;label class=&quot;rt-field rt-field-wide is-changed&quot;&gt;&lt;span class=&quot;rt-label&quot;&gt;简介 · 已变化&lt;/span&gt;&lt;textarea class=&quot;rt-textarea&quot;&gt;莫丁元帅再度发动叛乱；小队将穿越战场并阻止外星势力。&lt;/textarea&gt;&lt;/label&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;rt-review-cover-upload&quot; style=&quot;min-height:180px;margin-top:12px&quot;&gt;&lt;span&gt;&lt;i data-lucide=&quot;upload&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 点击最新封面上传替换&lt;/span&gt;&lt;/button&gt;&lt;/section&gt;

      &lt;div class=&quot;rt-dialog-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button&quot; data-close-compare&gt;取消&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button rt-button-primary&quot;&gt;应用&lt;/button&gt;&lt;/div&gt;

  &lt;div class=&quot;rt-dialog-backdrop&quot; data-history-dialog hidden&gt;
    &lt;section class=&quot;rt-dialog is-wide&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;rt-history-title&quot;&gt;
      &lt;div class=&quot;rt-panel-heading&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;rt-history-title&quot;&gt;审核完成时的游戏信息&lt;/h2&gt;&lt;p class=&quot;rt-dialog-copy&quot;&gt;2026 年 8 月 5 日 22:09 · 通过并发布&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button&quot; data-close-history aria-label=&quot;关闭&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;rt-snapshot&quot;&gt;&lt;div class=&quot;rt-cover rt-cover-b rt-snapshot-cover&quot;&gt;&lt;span class=&quot;rt-cover-title&quot;&gt;METAL SLUG&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;h2&gt;Metal Slug&lt;/h2&gt;&lt;p class=&quot;rt-subtitle&quot;&gt;Arcade · FBNeo 游戏列表 · 1996&lt;/p&gt;&lt;div class=&quot;rt-info-list&quot;&gt;&lt;div class=&quot;rt-info-row&quot;&gt;&lt;span&gt;开发商 / 发行商&lt;/span&gt;&lt;span&gt;SNK / SNK&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rt-info-row&quot;&gt;&lt;span&gt;玩家人数&lt;/span&gt;&lt;span&gt;1–2 人&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rt-info-row&quot;&gt;&lt;span&gt;运行方式&lt;/span&gt;&lt;span&gt;FBNeo&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rt-info-row&quot;&gt;&lt;span&gt;采用来源&lt;/span&gt;&lt;span&gt;Hasheous 精确候选&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;rt-section-head&quot;&gt;&lt;h3&gt;当时的简介&lt;/h3&gt;&lt;/div&gt;&lt;p class=&quot;rt-dialog-copy&quot;&gt;马尔科与塔马受命阻止莫丁元帅的叛乱，穿越战场并营救被俘人员。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;rt-dialog-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;rt-button rt-button-primary&quot; data-close-history&gt;关闭&lt;/button&gt;&lt;/div&gt;
    &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById('retrom-ui-review');
      const modeButton = root.querySelector('#rt-mode-button');
      const modeLabel = root.querySelector('#rt-mode-label');
      let mode = 'user';

      const pageNames = {
        home: '首页', library: '游戏库', saves: '我的存档', recent: '最近游玩', detail: '游戏详情', play: '游玩',
        'admin-import': '游戏入库', 'admin-import-new': '导入游戏', 'admin-import-tasks': '任务进度',
        'admin-review': '待审核', 'admin-review-history': '审核历史', 'admin-games': '游戏管理', 'admin-game-detail': '游戏管理详情', 'admin-platform-instances': '游戏目录', 'admin-bios': 'BIOS 管理'
      };
      function showPage(page) {
        const activeNavigationTarget = page === 'detail' ? 'library' : page === 'admin-game-detail' ? 'admin-games' : page;
        root.querySelector('.rt-app').classList.toggle('is-playing', page === 'play');
        root.querySelectorAll('.rt-page').forEach((element) =&gt; element.classList.toggle('is-active', element.dataset.page === page));
        root.querySelectorAll('.rt-nav-button').forEach((button) =&gt; button.classList.toggle('is-active', button.dataset.pageTarget === activeNavigationTarget));
        root.querySelector('[data-ingest-parent]').classList.toggle('is-context', ['admin-import-new', 'admin-import-tasks', 'admin-review', 'admin-review-history'].includes(page));
        if (page === 'admin-review') {
          root.querySelector('[data-review-page-title]').textContent = '待审核';
          root.querySelector('[data-review-position]').textContent = '已加载 4 条';
          root.querySelector('[data-review-view=&quot;list&quot;]').hidden = false;
          root.querySelector('[data-review-view=&quot;detail&quot;]').hidden = true;
        }
      }

      root.querySelectorAll('[data-page-target]').forEach((button) =&gt; button.addEventListener('click', () =&gt; showPage(button.dataset.pageTarget)));
      root.querySelectorAll('[data-page-link]').forEach((button) =&gt; button.addEventListener('click', () =&gt; showPage(button.dataset.pageLink)));
      const impactDialog = root.querySelector('[data-impact-dialog]');
      root.querySelectorAll('[data-preview-core]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { impactDialog.hidden = false; }));
      root.querySelectorAll('[data-close-dialog]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { impactDialog.hidden = true; }));

      function setMode(nextMode) {
        mode = nextMode;
        root.querySelectorAll('[data-nav-mode]').forEach((group) =&gt; { group.hidden = group.dataset.navMode !== mode; });
        modeLabel.textContent = mode === 'user' ? '我的游戏' : '管理后台';
        modeButton.querySelector('span').textContent = mode === 'user' ? '管理后台' : '返回用户侧';
        showPage(mode === 'user' ? 'home' : 'admin-import');
      }

      modeButton.addEventListener('click', () =&gt; setMode(mode === 'user' ? 'admin' : 'user'));

      let currentGame = 'metal';
      const gameDetails = {
        metal: {
          title: 'Metal Slug', coverTitle: 'METAL SLUG', coverClass: 'rt-cover-b', platform: 'Arcade / FBNeo 游戏列表 · 1996', directory: 'FBNeo 游戏列表',
          meta: ['SNK', '动作 / 射击', '1–2 人'], description: '驾驶载具、营救俘虏并一路突破敌军防线。系统已经准备好推荐运行方式，可以直接开始。',
          hours: '2.4h', publisher: 'SNK', saveName: '沙漠据点前', saveCore: 'FBNeo', save: 'FBNeo · 今天 22:14', dos: false, ready: true,
          cores: ['FBNeo · 推荐', 'MAME 2003 Plus · 可选', 'MAME 2003 · 开始时检查'], check: '系统已选好适合这个目录的运行方式'
        },
        doom: {
          title: 'DOOM', coverTitle: 'DOOM', coverClass: 'rt-cover-c', platform: 'MS-DOS / DOS 经典游戏 · 1993', directory: 'DOS 经典游戏',
          meta: ['id Software', '第一人称射击', '1 人'], description: '火星基地被恶魔占领。DOS 游戏在启动前可指定可执行程序，默认项由审核阶段确认，也可在每次启动时覆盖。',
          hours: '1.8h', publisher: 'id Software', saveName: 'Phobos Lab', saveCore: 'DOSBox Pure', save: 'DOSBox Pure · 昨天 23:06', dos: true, ready: true,
          cores: ['DOSBox Pure · 推荐'], check: '系统已识别 3 个可启动程序'
        },
        zelda: {
          title: 'Zelda no Densetsu', coverTitle: 'ZELDA', coverClass: 'rt-cover-a', platform: 'Famicom Disk System / 磁碟冒险 · 1986', directory: '磁碟冒险',
          meta: ['Nintendo', '动作 / 冒险', '1 人'], description: '这是磁碟系统版本，FCEUmm 启动时必须加载 disksys.rom。游戏文件已通过识别，但当前系统缺少所需 BIOS。',
          hours: '48m', publisher: 'Nintendo', saveName: '迷失森林入口', saveCore: 'FCEUmm', save: 'FCEUmm · 8 月 3 日 · 等待 BIOS', dos: false, ready: false,
          cores: ['FCEUmm · 推荐 / 缺少 BIOS'], check: '缺少 disksys.rom，安装后才能开始游戏'
        }
      };
      const corePreferences = {};

      function openGame(key) {
        const game = gameDetails[key] || gameDetails.metal;
        currentGame = key in gameDetails ? key : 'metal';
        const cover = root.querySelector('#rt-detail-cover');
        cover.className = `rt-cover ${game.coverClass} rt-detail-cover`;
        root.querySelector('#rt-detail-cover-title').textContent = game.coverTitle;
        root.querySelector('#rt-detail-platform').textContent = game.platform;
        root.querySelector('#rt-detail-title').textContent = game.title;
        root.querySelector('#rt-detail-meta').innerHTML = game.meta.map((item) =&gt; `&lt;span&gt;${item}&lt;/span&gt;`).join('');
        root.querySelector('#rt-detail-description').textContent = game.description;
        root.querySelector('#rt-detail-hours').textContent = game.hours;
        root.querySelector('#rt-info-directory').textContent = game.directory;
        root.querySelector('#rt-info-publisher').textContent = game.publisher;
        root.querySelector('#rt-detail-save-title').textContent = game.title;
        root.querySelector('#rt-detail-save-meta').textContent = game.save;
        root.querySelector('#rt-dos-field').hidden = !game.dos;
        const coreSelect = root.querySelector('#rt-core-select');
        coreSelect.innerHTML = game.cores.map((item) =&gt; `&lt;option&gt;${item}&lt;/option&gt;`).join('');
        if (corePreferences[currentGame] &amp;&amp; game.cores.includes(corePreferences[currentGame])) coreSelect.value = corePreferences[currentGame];
        root.querySelector('#rt-core-details').removeAttribute('open');
        root.querySelector('#rt-launch-check-text').textContent = game.check;
        root.querySelector('#rt-launch-ready').textContent = game.ready ? '可以直接开始' : '当前不可用';
        root.querySelector('#rt-launch-ready').className = game.ready ? 'rt-badge rt-badge-green' : 'rt-badge rt-badge-red';
        root.querySelector('#rt-launch-check').className = game.ready ? 'rt-checkline' : 'rt-checkline is-warning';
        root.querySelectorAll('[data-start-game]').forEach((button) =&gt; { button.disabled = !game.ready; });
        root.querySelector('[data-start-current-save]').disabled = !game.ready;
        updateCoreSelection(coreSelect.value, false);
        showPage('detail');
      }

      root.querySelectorAll('[data-open-game]').forEach((button) =&gt; button.addEventListener('click', () =&gt; openGame(button.dataset.openGame)));

      const libraryGrid = root.querySelector('.rt-library-grid');
      const librarySearch = root.querySelector('[data-library-search]');
      const librarySort = root.querySelector('[data-library-sort]');
      const libraryCards = [...root.querySelectorAll('[data-library-card]')];
      let libraryPlatform = '';
      function updateLibrary() {
        const query = librarySearch.value.trim().toLocaleLowerCase('zh-CN');
        const visible = libraryCards.filter((card) =&gt; {
          const matches = (!query || card.dataset.libraryTitle.toLocaleLowerCase('zh-CN').includes(query)) &amp;&amp;
            (!libraryPlatform || card.dataset.libraryPlatformName === libraryPlatform);
          card.hidden = !matches;
          return matches;
        });
        const sortMode = librarySort.value;
        [...libraryCards].sort((left, right) =&gt; sortMode === 'title'
          ? left.dataset.libraryTitle.localeCompare(right.dataset.libraryTitle, 'zh-CN')
          : Number(left.dataset[sortMode === 'added' ? 'libraryAdded' : 'libraryRecent']) - Number(right.dataset[sortMode === 'added' ? 'libraryAdded' : 'libraryRecent']))
          .forEach((card) =&gt; libraryGrid.appendChild(card));
        root.querySelector('[data-library-count]').textContent = String(visible.length);
      }
      librarySearch.addEventListener('input', updateLibrary);
      librarySort.addEventListener('change', updateLibrary);
      root.querySelectorAll('[data-library-platform]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        root.querySelectorAll('[data-library-platform]').forEach((candidate) =&gt; candidate.classList.remove('is-active'));
        button.classList.add('is-active');
        libraryPlatform = button.dataset.libraryPlatform;
        updateLibrary();
      }));
      root.addEventListener('keydown', (event) =&gt; {
        if (event.key !== '/' || ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
        event.preventDefault();
        librarySearch.focus();
      });

      function updateCoreSelection(label, remember = true) {
        const blocked = label.includes('缺少 BIOS') || label.includes('不兼容');
        const needsValidation = label.includes('开始时检查');
        const usesOverride = !label.includes('推荐');
        const status = root.querySelector('#rt-launch-ready');
        const checkline = root.querySelector('#rt-launch-check');
        const launchNote = root.querySelector('#rt-launch-note');
        const coreOrigin = root.querySelector('#rt-core-origin');
        if (remember) {
          if (usesOverride) corePreferences[currentGame] = label;
          else delete corePreferences[currentGame];
        }
        root.querySelector('#rt-core-override').hidden = !usesOverride;
        launchNote.classList.toggle('is-override', usesOverride);
        launchNote.textContent = usesOverride ? `已记住这个游戏使用 ${label.split(' · ')[0]}，后续启动将优先使用` : '开始前会自动检查游戏文件和所需系统文件';
        coreOrigin.classList.toggle('is-override', usesOverride);
        coreOrigin.textContent = usesOverride ? '已保留当前选择；改回推荐核心可恢复目录默认设置' : '只有遇到兼容问题或需要特定存档时才建议更改';
        if (blocked) {
          status.textContent = '当前不可用';
          status.className = 'rt-badge rt-badge-red';
          checkline.className = 'rt-checkline is-warning';
        } else if (needsValidation) {
          status.textContent = '开始时检查';
          status.className = 'rt-badge rt-badge-amber';
          checkline.className = 'rt-checkline is-warning';
          root.querySelector('#rt-launch-check-text').textContent = '开始后会自动检查所选运行方式，完成后继续';
        } else {
          status.textContent = '可以直接开始';
          status.className = 'rt-badge rt-badge-green';
          checkline.className = 'rt-checkline';
          root.querySelector('#rt-launch-check-text').textContent = gameDetails[currentGame].check;
        }
        root.querySelectorAll('[data-start-game]').forEach((button) =&gt; { button.disabled = blocked; });
      }

      root.querySelector('#rt-core-select').addEventListener('change', (event) =&gt; {
        updateCoreSelection(event.target.value);
      });
      const coreDetails = root.querySelector('#rt-core-details');
      root.querySelector('[data-close-core]').addEventListener('click', () =&gt; coreDetails.removeAttribute('open'));
      document.addEventListener('pointerdown', (event) =&gt; {
        if (coreDetails.open &amp;&amp; !coreDetails.contains(event.target)) coreDetails.removeAttribute('open');
      });
      document.addEventListener('keydown', (event) =&gt; {
        if (event.key === 'Escape') coreDetails.removeAttribute('open');
      });

      let playerReturnPage = 'detail';
      let playerRunToken = 0;

      function requestPlayerFullscreen() {
        const fullscreenTarget = document.documentElement;
        if (document.fullscreenElement || !fullscreenTarget.requestFullscreen) return;
        fullscreenTarget.requestFullscreen({ navigationUI: 'hide' }).catch(() =&gt; {
          const state = root.querySelector('#rt-player-launch-state');
          state.textContent = '运行中 · 浏览器未允许全屏，可用右上角重试';
          state.classList.remove('is-loading');
        });
      }

      function startGame(key, { fromSave = false, returnPage = 'detail' } = {}) {
        const game = gameDetails[key] || gameDetails.metal;
        if (!game.ready) return;
        currentGame = key in gameDetails ? key : 'metal';
        playerReturnPage = returnPage;
        const runToken = ++playerRunToken;
        const selectedCore = fromSave ? game.saveCore : root.querySelector('#rt-core-select').value;
        const needsValidation = !fromSave &amp;&amp; selectedCore.includes('开始时检查');
        const state = root.querySelector('#rt-player-launch-state');
        const stageState = root.querySelector('#rt-player-stage-state');
        root.querySelector('#rt-player-game').textContent = game.title;
        root.querySelector('#rt-player-core').textContent = fromSave
          ? `${selectedCore} · 正在恢复“${game.saveName}”`
          : needsValidation
            ? `${selectedCore.split(' · ')[0]} · 正在验证核心兼容性`
            : `${selectedCore.split(' · ')[0]} · 正在创建新会话`;
        state.textContent = needsValidation
          ? '验证中 · 复用共享兼容性任务 · 退出等待不会取消任务'
          : '启动中 · 自动预检并加载 EmulatorJS';
        stageState.textContent = needsValidation
          ? '正在验证核心兼容性 · 完成后自动继续，无第二个开始按钮'
          : '正在加载 EmulatorJS · 无第二个开始按钮';
        state.classList.add('is-loading');
        showPage('play');
        requestPlayerFullscreen();
        if (needsValidation) window.setTimeout(() =&gt; {
          if (runToken !== playerRunToken) return;
          state.textContent = '验证中 · 正在生成依赖包';
          root.querySelector('#rt-player-core').textContent = `${selectedCore.split(' · ')[0]} · 兼容性检查通过`;
        }, 650);
        window.setTimeout(() =&gt; {
          if (runToken !== playerRunToken) return;
          root.querySelector('#rt-player-core').textContent = `${selectedCore.split(' · ')[0]} · 本次游玩 00:00:01`;
          state.textContent = document.fullscreenElement
            ? '运行中 · 自动启动 · 已进入全屏'
            : '运行中 · 自动启动 · 全屏请求未获允许';
          stageState.textContent = '一次点击后已自动运行 · 已连接控制器 1';
          state.classList.remove('is-loading');
        }, needsValidation ? 1300 : 650);
      }

      root.querySelectorAll('[data-start-game]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        if (!button.disabled) startGame(currentGame, { returnPage: 'detail' });
      }));
      root.querySelector('[data-start-current-save]').addEventListener('click', (event) =&gt; {
        if (!event.currentTarget.disabled) startGame(currentGame, { fromSave: true, returnPage: 'detail' });
      });
      root.querySelectorAll('[data-quick-start]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        if (button.disabled) return;
        const sourcePage = button.closest('[data-page]')?.dataset.page || 'home';
        startGame(button.dataset.quickStart, { fromSave: true, returnPage: sourcePage });
      }));
      root.querySelector('#rt-enter-fullscreen').addEventListener('click', requestPlayerFullscreen);
      root.querySelector('#rt-exit-player').addEventListener('click', () =&gt; {
        playerRunToken += 1;
        const returnToSource = () =&gt; showPage(playerReturnPage);
        if (document.fullscreenElement) document.exitFullscreen().then(returnToSource, returnToSource);
        else returnToSource();
      });

      root.querySelector('[data-cancel-job]').addEventListener('click', (event) =&gt; {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = '正在取消';
        const rowStatus = button.closest('.rt-job-row').querySelector('.rt-badge');
        rowStatus.textContent = '正在取消 · 67%';
        rowStatus.className = 'rt-badge rt-badge-amber';
        const detailStatus = root.querySelector('#rt-task-detail-status');
        detailStatus.textContent = '正在取消';
        detailStatus.className = 'rt-badge rt-badge-amber';
        root.querySelector('#rt-job-cancel-note').textContent = '已提交取消请求；Worker 会在下一个有界检查点停止并清理 scratch。状态仍不是“已取消”，已完成条目也不会回滚。';
      });

      root.querySelectorAll('[data-bios-view]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        root.querySelectorAll('[data-bios-view]').forEach((peer) =&gt; peer.classList.toggle('is-active', peer === button));
        root.querySelectorAll('[data-bios-panel]').forEach((panel) =&gt; { panel.hidden = panel.dataset.biosPanel !== button.dataset.biosView; });
      }));

      root.querySelectorAll('.rt-candidate').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        root.querySelectorAll('.rt-candidate').forEach((peer) =&gt; peer.classList.toggle('is-selected', peer === button));
      }));

      root.querySelectorAll('[data-review-item]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        root.querySelector('[data-review-workspace]').classList.add('is-detail-open');
        root.querySelector('[data-review-page-title]').textContent = '审核条目';
        root.querySelector('[data-review-view=&quot;list&quot;]').hidden = true;
        root.querySelector('[data-review-view=&quot;detail&quot;]').hidden = false;
        root.querySelectorAll('[data-review-item]').forEach((peer) =&gt; {
          peer.classList.toggle('is-selected', peer === button);
          peer.setAttribute('aria-current', peer === button ? 'true' : 'false');
        });
        root.querySelector('[data-review-position]').textContent = button.dataset.reviewPositionValue;
        root.querySelector('[data-review-file-output]').textContent = button.dataset.reviewFile;
        root.querySelector('[data-review-preview-output]').textContent = button.dataset.reviewPreview;
        root.querySelector('[data-review-field=&quot;title&quot;]').value = button.dataset.reviewTitle;
        root.querySelector('[data-review-field=&quot;year&quot;]').value = button.dataset.reviewYear;
        root.querySelector('[data-review-field=&quot;developer&quot;]').value = button.dataset.reviewDeveloper;
        root.querySelector('[data-review-field=&quot;players&quot;]').value = button.dataset.reviewPlayers;
        root.querySelector('[data-review-field=&quot;description&quot;]').value = button.dataset.reviewDescription;
        root.querySelector('[data-review-candidate-title]').textContent = button.dataset.reviewCandidate;
        root.querySelector('[data-review-candidate-meta]').textContent = button.dataset.reviewCandidateMeta;
        const candidateBadge = root.querySelector('[data-review-candidate-badge]');
        candidateBadge.textContent = button.dataset.reviewCandidateBadge;
        candidateBadge.className = button.dataset.reviewCandidateBadge === '精确' ? 'rt-badge rt-badge-green' : 'rt-badge rt-badge-amber';
        const validation = root.querySelector('[data-review-validation-output]');
        validation.textContent = button.dataset.reviewValidation;
        validation.classList.toggle('is-warning', button.dataset.reviewValidationStatus !== 'READY');
        root.querySelector('[data-review-approve]').disabled = button.dataset.reviewValidationStatus !== 'READY';
      }));
      root.querySelector('[data-review-back]').addEventListener('click', () =&gt; {
        root.querySelector('[data-review-workspace]').classList.remove('is-detail-open');
        root.querySelector('[data-review-page-title]').textContent = '待审核';
        root.querySelector('[data-review-position]').textContent = '已加载 4 条';
        root.querySelector('[data-review-view=&quot;list&quot;]').hidden = false;
        root.querySelector('[data-review-view=&quot;detail&quot;]').hidden = true;
      });

      const compareDialog = root.querySelector('[data-compare-dialog]');
      root.querySelector('[data-open-compare]').addEventListener('click', () =&gt; { compareDialog.hidden = false; });
      root.querySelectorAll('[data-close-compare]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { compareDialog.hidden = true; }));
      const historyDialog = root.querySelector('[data-history-dialog]');
      root.querySelectorAll('[data-open-history]').forEach((row) =&gt; {
        const openHistory = () =&gt; { historyDialog.hidden = false; };
        row.addEventListener('click', openHistory);
        row.addEventListener('keydown', (event) =&gt; { if (event.key === 'Enter' || event.key === ' ') openHistory(); });
      });
      root.querySelectorAll('[data-close-history]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { historyDialog.hidden = true; }));

      root.querySelectorAll('.rt-home-rail').forEach((rail) =&gt; rail.addEventListener('wheel', (event) =&gt; {
        if (rail.scrollWidth &lt;= rail.clientWidth || Math.abs(event.deltaY) &lt;= Math.abs(event.deltaX)) return;
        const previous = rail.scrollLeft;
        rail.scrollLeft += event.deltaY;
        if (rail.scrollLeft !== previous) event.preventDefault();
      }, { passive: false }));
      const homePlatforms = root.querySelector('[data-home-platforms]');
      root.querySelectorAll('[data-home-pin]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        const platform = button.closest('.rt-home-platform');
        const pinned = platform.classList.toggle('is-pinned');
        button.setAttribute('aria-pressed', String(pinned));
        button.setAttribute('aria-label', `${pinned ? '取消置顶' : '置顶'}${platform.dataset.platformName}`);
        if (pinned) homePlatforms.prepend(platform);
        else [...homePlatforms.children].sort((left, right) =&gt; {
          if (left.classList.contains('is-pinned') !== right.classList.contains('is-pinned')) return left.classList.contains('is-pinned') ? -1 : 1;
          return left.dataset.platformName.localeCompare(right.dataset.platformName, 'zh-CN');
        }).forEach((item) =&gt; homePlatforms.append(item));
      }));

      root.querySelectorAll('.rt-chip').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        const group = button.closest('[data-chip-group]') || root;
        group.querySelectorAll('.rt-chip').forEach((peer) =&gt; peer.classList.toggle('is-active', peer === button));
      }));

      const applyRequestedView = (requestedView) =&gt; {
        if (requestedView.startsWith('game-')) {
          setMode('user');
          openGame(requestedView.slice(5));
        } else if (requestedView === 'admin-bios-dats') {
          setMode('admin');
          showPage('admin-bios');
          root.querySelector('[data-bios-view=&quot;dats&quot;]').click();
        } else if (requestedView.startsWith('admin-') &amp;&amp; pageNames[requestedView]) {
          setMode('admin');
          showPage(requestedView);
        } else if (pageNames[requestedView]) {
          if (['home', 'library', 'saves'].includes(requestedView)) setMode('user');
          showPage(requestedView);
        }
      };

      applyRequestedView(window.location.hash.slice(1));
      window.addEventListener('message', (event) =&gt; {
        if (event.data?.type === 'retrom-view') applyRequestedView(event.data.view || '');
      });
      window.parent.postMessage({ type: 'retrom-ready' }, '*');

      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script&gt;globalThis.lucide?.createIcons({attrs:{width:16,height:16}});&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
</body>
</html>
