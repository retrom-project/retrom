    #retrom-ui-review {

    #retrom-ui-review * { box-sizing: border-box; }

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById('retrom-ui-review');
      const app = root.querySelector('.rt-app');
      const modeButton = root.querySelector('#rt-mode-button');
      const modeLabel = root.querySelector('#rt-mode-label');
      let mode = 'user';

      const pageNames = {
        home: '首页', library: '游戏库', saves: '我的存档', favorites: '我的收藏', recent: '最近游玩', account: '账户设置', detail: '游戏详情', play: '游玩',
        'admin-import': '游戏入库', 'admin-import-new': '导入游戏', 'admin-import-tasks': '任务进度',
        'admin-review': '待审核', 'admin-review-history': '审核历史', 'admin-games': '游戏管理', 'admin-game-detail': '游戏管理详情', 'admin-platform-instances': '游戏目录', 'admin-users': '用户管理', 'admin-bios': '运行依赖'
      };
      const authPageNames = new Set(['setup', 'login', 'register', 'reset']);
      function selectReviewScene(scene) {
        root.querySelectorAll('[data-review-scene]').forEach((button) =&gt; button.classList.toggle('is-active', button.dataset.reviewScene === scene));
      }
      function showAuthPage(page) {
        app.hidden = true;
        root.querySelectorAll('[data-auth-page]').forEach((element) =&gt; { element.hidden = element.dataset.authPage !== page; });
        selectReviewScene(page);
      }
      function showPage(page) {
        const activeNavigationTarget = page === 'detail' ? 'library' : page === 'admin-game-detail' ? 'admin-games' : page;
        app.hidden = false;
        root.querySelectorAll('[data-auth-page]').forEach((element) =&gt; { element.hidden = true; });
        app.classList.toggle('is-playing', page === 'play');
        root.querySelectorAll('.rt-page').forEach((element) =&gt; element.classList.toggle('is-active', element.dataset.page === page));
        root.querySelectorAll('.rt-nav-button').forEach((button) =&gt; button.classList.toggle('is-active', button.dataset.pageTarget === activeNavigationTarget));
        selectReviewScene(page);
        root.querySelector('[data-ingest-parent]').classList.toggle('is-context', ['admin-import-new', 'admin-import-tasks', 'admin-review', 'admin-review-history'].includes(page));
        const runtimeParent = root.querySelector('[data-runtime-parent]');
        runtimeParent.classList.toggle('is-context', page === 'admin-bios');
        if (page === 'admin-bios') {
          runtimeParent.classList.remove('is-active');
          const currentView = [...root.querySelectorAll('[data-bios-panel]')].find((panel) =&gt; !panel.hidden)?.dataset.biosPanel || 'files';
          root.querySelectorAll('[data-bios-view]').forEach((button) =&gt; button.classList.toggle('is-active', button.dataset.biosView === currentView));
        }
        if (page === 'admin-review') {
          root.querySelector('[data-review-page-title]').textContent = '待审核';
          root.querySelector('[data-review-position]').textContent = '已加载 4 条';
          root.querySelector('[data-review-view=&quot;list&quot;]').hidden = false;
          root.querySelector('[data-review-view=&quot;detail&quot;]').hidden = true;
        }
      }

      function updateCoreSelection(label, remember = true) {
        const blocked = label.includes('缺少 BIOS') || label.includes('不兼容');
        const needsValidation = label.includes('开始时检查');
        const usesOverride = !label.includes('推荐');
        const status = root.querySelector('#rt-launch-ready');
        const checkline = root.querySelector('#rt-launch-check');
        const launchNote = root.querySelector('#rt-launch-note');
        const coreOrigin = root.querySelector('#rt-core-origin');
        if (remember) {
          if (usesOverride) corePreferences[currentGame] = label;
          else delete corePreferences[currentGame];
        }
        root.querySelector('#rt-core-override').hidden = !usesOverride;
        root.querySelector('#rt-detail-runtime-name').textContent = label.split(' · ')[0];
        launchNote.classList.toggle('is-override', usesOverride);
        launchNote.textContent = usesOverride ? `已记住这个游戏使用 ${label.split(' · ')[0]}，后续启动将优先使用` : '开始前会自动检查游戏文件和所需系统文件';
        coreOrigin.classList.toggle('is-override', usesOverride);
        coreOrigin.textContent = usesOverride ? '已保留当前选择；改回推荐核心可恢复目录默认设置' : '只有遇到兼容问题或需要特定存档时才建议更改';
        if (blocked) {
          status.textContent = '当前不可用';
          status.className = 'rt-badge rt-badge-red';
          checkline.className = 'rt-checkline is-warning';
        } else if (needsValidation) {
          status.textContent = '开始时检查';
          status.className = 'rt-badge rt-badge-amber';
          checkline.className = 'rt-checkline is-warning';
          root.querySelector('#rt-launch-check-text').textContent = '开始后会自动检查所选运行方式，完成后继续';
        } else {
          status.textContent = '可以直接开始';
          status.className = 'rt-badge rt-badge-green';
          checkline.className = 'rt-checkline';
          root.querySelector('#rt-launch-check-text').textContent = gameDetails[currentGame].check;
        }
        root.querySelectorAll('[data-start-game]').forEach((button) =&gt; { button.disabled = blocked; });
      }

      function requestPlayerFullscreen() {

        fullscreenTarget.requestFullscreen({ navigationUI: 'hide' }).catch(() =&gt; {

          state.textContent = '已同步';
          state.classList.remove('is-loading');

      function startGame(key, { fromSave = false, returnPage = 'detail' } = {}) {
        const game = gameDetails[key] || gameDetails.metal;
        if (!game.ready) return;
        currentGame = key in gameDetails ? key : 'metal';
        playerReturnPage = returnPage;
        const runToken = ++playerRunToken;
        const selectedCore = fromSave ? game.saveCore : root.querySelector('#rt-core-select').value;
        const needsValidation = !fromSave &amp;&amp; selectedCore.includes('开始时检查');
        const state = root.querySelector('#rt-player-launch-state');
        const stageState = root.querySelector('#rt-player-stage-state');
        const pauseOverlay = root.querySelector('#rt-player-pause-overlay');
        const platformName = game.platform.split(' / ')[0];
        const coreName = selectedCore.split(' · ')[0];
        root.querySelector('#rt-player-game').textContent = game.title;
        root.querySelector('#rt-player-core').textContent = `${coreName} · ${platformName}`;
        state.textContent = needsValidation ? '正在验证…' : '正在连接…';
        stageState.textContent = needsValidation
          ? '正在验证核心兼容性 · 完成后自动继续，无第二个开始按钮'
          : '正在加载 EmulatorJS · 无第二个开始按钮';
        state.classList.add('is-loading');
        pauseOverlay.classList.remove('is-open');
        pauseOverlay.setAttribute('aria-hidden', 'true');
        showPage('play');
        requestPlayerFullscreen();
        if (needsValidation) window.setTimeout(() =&gt; {
          if (runToken !== playerRunToken) return;
          state.textContent = '正在准备运行环境…';
        }, 650);
        window.setTimeout(() =&gt; {
          if (runToken !== playerRunToken) return;
          root.querySelector('#rt-player-core').textContent = `${coreName} · ${platformName}`;
          state.textContent = '已同步';
          stageState.textContent = '一次点击后已自动运行 · 已连接控制器 1';
          state.classList.remove('is-loading');
        }, needsValidation ? 1300 : 650);
      }

        if (!button.disabled) startGame(currentGame, { returnPage: 'detail' });
      }));

        playerPauseOverlay.setAttribute('aria-hidden', 'false');
      });
      root.querySelector('.rt-player-screen').addEventListener('click', () =&gt; {
        playerPauseOverlay.classList.remove('is-open');
        playerPauseOverlay.setAttribute('aria-hidden', 'true');
      });
      root.querySelector('#rt-player-more').addEventListener('click', () =&gt; root.querySelector('#rt-player-menu').classList.toggle('is-open'));
      const playerDiscButton = root.querySelector('#rt-player-disc');
      const playerDiscMenu = root.querySelector('#rt-player-disc-menu');
      playerDiscButton.addEventListener('click', () =&gt; {
        const open = playerDiscMenu.classList.toggle('is-open');
        playerDiscButton.setAttribute('aria-expanded', String(open));
      });
      playerDiscMenu.querySelectorAll('[data-disc-number]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        const discNumber = button.dataset.discNumber;
        playerDiscMenu.querySelectorAll('[data-disc-number]').forEach((candidate) =&gt; candidate.setAttribute('aria-checked', String(candidate === button)));
        playerDiscButton.innerHTML = `&lt;i data-lucide=&quot;disc-3&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;光盘 ${discNumber} / 3`;
        playerDiscButton.setAttribute('aria-label', `光盘 ${discNumber} / 3`);
        playerDiscButton.setAttribute('aria-expanded', 'false');
        playerDiscMenu.classList.remove('is-open');
        root.querySelector('#rt-player-launch-state').textContent = `已切换到光盘 ${discNumber}`;
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }));
      root.querySelector('[data-open-emulator-controls]').addEventListener('click', () =&gt; {
        const controls = root.querySelector('#rt-player-emulator-controls');
        root.querySelector('#rt-player-menu').classList.remove('is-open');
        controls.classList.add('is-open');
        controls.setAttribute('aria-hidden', 'false');
      });
      root.querySelector('[data-close-emulator-controls]').addEventListener('click', () =&gt; {
        const controls = root.querySelector('#rt-player-emulator-controls');
        controls.classList.remove('is-open');
        controls.setAttribute('aria-hidden', 'true');
      });
      const playerExitDialog = root.querySelector('[data-player-exit-dialog]');
      root.querySelectorAll('[data-player-exit]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        root.querySelector('#rt-player-menu').classList.remove('is-open');
        const saveButton = root.querySelector('[data-save-before-player-exit]');
        saveButton.disabled = false;
        saveButton.innerHTML = '&lt;i data-lucide=&quot;save&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;创建存档';
        root.querySelector('[data-player-exit-copy]').textContent = '游戏进度已同步，可以安全退出。';
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        playerExitDialog.hidden = false;
      }));
      root.querySelector('[data-save-before-player-exit]').addEventListener('click', (event) =&gt; {
        event.currentTarget.disabled = true;
        event.currentTarget.innerHTML = '&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;已创建存档';
        root.querySelector('[data-player-exit-copy]').textContent = '退出前存档已创建，可以安全退出。';
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      });
      root.querySelector('[data-cancel-player-exit]').addEventListener('click', () =&gt; { playerExitDialog.hidden = true; });
      root.querySelector('[data-confirm-player-exit]').addEventListener('click', () =&gt; {
        playerExitDialog.hidden = true;
        playerRunToken += 1;
        const returnToSource = () =&gt; showPage(playerReturnPage);
        if (document.fullscreenElement) document.exitFullscreen().then(returnToSource, returnToSource);
        else returnToSource();
      });

      root.querySelectorAll('[data-bios-view]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        showPage('admin-bios');
        root.querySelectorAll('[data-bios-view]').forEach((peer) =&gt; peer.classList.toggle('is-active', peer.dataset.biosView === button.dataset.biosView));
        root.querySelectorAll('[data-bios-panel]').forEach((panel) =&gt; { panel.hidden = panel.dataset.biosPanel !== button.dataset.biosView; });
      }));
      const biosEntriesDialog = root.querySelector('[data-bios-entries]');
      root.querySelectorAll('[data-open-bios-entries]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { biosEntriesDialog.hidden = false; }));
      root.querySelectorAll('[data-close-bios-entries]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { biosEntriesDialog.hidden = true; }));
      const runtimeDrawer = root.querySelector('[data-runtime-drawer]');
      const runtimeDrawerBackdrop = root.querySelector('[data-runtime-drawer-backdrop]');
      root.querySelectorAll('[data-open-runtime-drawer]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { runtimeDrawer.hidden = false; runtimeDrawerBackdrop.hidden = false; }));
      root.querySelectorAll('[data-close-runtime-drawer]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { runtimeDrawer.hidden = true; runtimeDrawerBackdrop.hidden = true; }));
      runtimeDrawerBackdrop.addEventListener('click', () =&gt; { runtimeDrawer.hidden = true; runtimeDrawerBackdrop.hidden = true; });
      const runtimeDiff = root.querySelector('[data-runtime-diff]');
      root.querySelectorAll('[data-open-runtime-diff]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { runtimeDiff.hidden = false; }));
      root.querySelectorAll('[data-close-runtime-diff]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { runtimeDiff.hidden = true; }));

      const serverImportDrawer = root.querySelector('[data-server-import-drawer]');
      const serverImportBackdrop = root.querySelector('[data-server-import-backdrop]');
      const closeServerImportDrawer = () =&gt; { serverImportDrawer.hidden = true; serverImportBackdrop.hidden = true; };
      root.querySelectorAll('[data-open-server-import-drawer]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { serverImportDrawer.hidden = false; serverImportBackdrop.hidden = false; }));
      root.querySelectorAll('[data-close-server-import-drawer]').forEach((button) =&gt; button.addEventListener('click', closeServerImportDrawer));
      serverImportBackdrop.addEventListener('click', closeServerImportDrawer);

      root.querySelectorAll('.rt-candidate').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        root.querySelectorAll('.rt-candidate').forEach((peer) =&gt; peer.classList.toggle('is-selected', peer === button));
      }));

      const reviewDiscDrawer = root.querySelector('[data-review-disc-drawer]');
      const reviewDiscDrawerBackdrop = root.querySelector('[data-review-disc-drawer-backdrop]');
      const reviewDiscDrawerTitle = root.querySelector('#rt-review-disc-drawer-title');
      let reviewDiscPreviousFocus = null;
      const closeReviewDiscDrawer = () =&gt; {
        reviewDiscDrawer.hidden = true;
        reviewDiscDrawerBackdrop.hidden = true;
        reviewDiscPreviousFocus?.focus();
      };
      root.querySelector('[data-open-disc-drawer]').addEventListener('click', (event) =&gt; {
        reviewDiscPreviousFocus = event.currentTarget;
        reviewDiscDrawer.hidden = false;
        reviewDiscDrawerBackdrop.hidden = false;
        reviewDiscDrawerTitle.focus();
      });
      root.querySelectorAll('[data-close-disc-drawer]').forEach((button) =&gt; button.addEventListener('click', closeReviewDiscDrawer));
      reviewDiscDrawerBackdrop.addEventListener('click', closeReviewDiscDrawer);
      document.addEventListener('keydown', (event) =&gt; {
        if (reviewDiscDrawer.hidden) return;
        if (event.key === 'Escape') {
          event.preventDefault();
          closeReviewDiscDrawer();
          return;
        }
        if (event.key !== 'Tab') return;
        const focusable = [...reviewDiscDrawer.querySelectorAll('button:not([disabled]), input:not([disabled])')];
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable.at(-1);
        if (event.shiftKey &amp;&amp; (document.activeElement === first || document.activeElement === reviewDiscDrawerTitle)) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey &amp;&amp; document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      function setReviewDiscState(state) {
        const card = root.querySelector('[data-review-disc-card]');
        const count = root.querySelector('[data-review-disc-count]');
        const discState = root.querySelector('[data-review-disc-3-state]');
        const summaryState = root.querySelector('[data-review-disc-summary-state]');
        const capabilityState = root.querySelector('[data-review-capability-state]');
        const validation = root.querySelector('[data-review-validation-output]');
        const progress = root.querySelector('[data-review-disc-progress]');
        const actions = root.querySelector('[data-review-disc-actions]');
        const toast = root.querySelector('[data-review-disc-toast]');
        card.classList.toggle('is-validating', state === 'validating');
        card.classList.toggle('is-ready', state === 'ready');
        progress.hidden = state !== 'validating';
        actions.hidden = state !== 'blocked';
        toast.hidden = state !== 'ready';
        if (state === 'validating') {
          count.className = 'rt-badge rt-badge-purple';
          count.textContent = '正在校验';
          discState.className = 'rt-badge rt-badge-purple';
          discState.textContent = '正在校验';
          root.querySelector('[data-review-disc-3-size]').textContent = '242.3 MiB';
          root.querySelector('[data-review-disc-message]').textContent = '补充文件已上传；服务端正在重新核对文件名、总大小、盘序和运行能力。';
          root.querySelector('[data-review-disc-received]').textContent = '已上传 M3U 与 3 张光盘';
          summaryState.className = 'rt-badge rt-badge-purple';
          summaryState.textContent = '正在校验光盘 3';
          capabilityState.className = 'rt-badge rt-badge-purple';
          capabilityState.textContent = '正在校验';
          root.querySelector('[data-review-completeness]').textContent = '正在校验补充光盘';
          validation.classList.add('is-warning');
          validation.classList.add('is-validating');
          validation.textContent = '… 正在校验补充光盘；完成前继续阻止发布';
          root.querySelector('[data-review-decision-copy]').textContent = '补充文件正在校验；结果返回前不能发布。';
          root.querySelector('[data-review-approve]').disabled = true;
        } else if (state === 'ready') {
          count.className = 'rt-badge rt-badge-green';
          count.textContent = '3 / 3 张光盘';
          discState.className = 'rt-badge rt-badge-green';
          discState.textContent = '已就绪';
          root.querySelector('[data-review-disc-3-size]').textContent = '242.3 MiB';
          root.querySelector('[data-review-disc-message]').textContent = '多盘内容完整，运行检查结果已更新。';
          root.querySelector('[data-review-disc-received]').textContent = '已接收 M3U 与 3 张光盘';
          summaryState.className = 'rt-badge rt-badge-green';
          summaryState.textContent = '全部光盘已就绪';
          capabilityState.className = 'rt-badge rt-badge-green';
          capabilityState.textContent = '可以发布';
          root.querySelector('[data-review-completeness]').textContent = '3 张光盘完整';
          validation.classList.remove('is-warning');
          validation.classList.remove('is-validating');
          validation.textContent = '✓ 多盘内容与 Saturn · Yabause 运行依赖均已就绪，可以发布';
          root.querySelector('[data-review-decision-copy]').textContent = '运行检查已经通过，可以发布。';
          root.querySelector('[data-review-source-disc-3]').hidden = false;
          root.querySelector('[data-review-approve]').disabled = false;
        }
      }
      root.querySelector('[data-queue-disc-validation]').addEventListener('click', () =&gt; {
        closeReviewDiscDrawer();
        setReviewDiscState('validating');
      });
      root.addEventListener('retrom:set-disc-state', (event) =&gt; setReviewDiscState(event.detail));

      root.querySelectorAll('[data-review-item]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        root.querySelector('[data-review-workspace]').classList.add('is-detail-open');
        root.querySelector('[data-review-page-title]').textContent = '审核条目';
        root.querySelector('[data-review-view=&quot;list&quot;]').hidden = true;
        root.querySelector('[data-review-view=&quot;detail&quot;]').hidden = false;
        root.querySelectorAll('[data-review-item]').forEach((peer) =&gt; {
          peer.classList.toggle('is-selected', peer === button);
          peer.setAttribute('aria-current', peer === button ? 'true' : 'false');
        });
        root.querySelector('[data-review-position]').textContent = button.dataset.reviewPositionValue;
        root.querySelector('[data-review-file-output]').textContent = button.dataset.reviewFile;
        root.querySelector('[data-review-preview-output]').textContent = button.dataset.reviewPreview;
        root.querySelector('[data-review-field=&quot;title&quot;]').value = button.dataset.reviewTitle;
        root.querySelector('[data-review-field=&quot;year&quot;]').value = button.dataset.reviewYear;
        root.querySelector('[data-review-field=&quot;developer&quot;]').value = button.dataset.reviewDeveloper;
        root.querySelector('[data-review-field=&quot;players&quot;]').value = button.dataset.reviewPlayers;
        root.querySelector('[data-review-field=&quot;description&quot;]').value = button.dataset.reviewDescription;
        const validation = root.querySelector('[data-review-validation-output]');
        validation.textContent = button.dataset.reviewValidation;
        validation.classList.toggle('is-warning', button.dataset.reviewValidationStatus !== 'READY');
        validation.classList.remove('is-validating');
        root.querySelector('[data-review-approve]').disabled = button.dataset.reviewValidationStatus !== 'READY';
      }));
      root.querySelector('[data-review-back]').addEventListener('click', () =&gt; {
        root.querySelector('[data-review-workspace]').classList.remove('is-detail-open');
        root.querySelector('[data-review-page-title]').textContent = '待审核';
        root.querySelector('[data-review-position]').textContent = '已加载 4 条';
        root.querySelector('[data-review-view=&quot;list&quot;]').hidden = false;
        root.querySelector('[data-review-view=&quot;detail&quot;]').hidden = true;
      });

      const compareDialog = root.querySelector('[data-compare-dialog]');
      root.querySelector('[data-open-compare]').addEventListener('click', () =&gt; { compareDialog.hidden = false; });
      root.querySelectorAll('[data-close-compare]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { compareDialog.hidden = true; }));
      const historyDialog = root.querySelector('[data-history-dialog]');
      root.querySelectorAll('[data-open-history]').forEach((row) =&gt; {
        const openHistory = () =&gt; { historyDialog.hidden = false; };
        row.addEventListener('click', openHistory);
        row.addEventListener('keydown', (event) =&gt; { if (event.key === 'Enter' || event.key === ' ') openHistory(); });
      });
      root.querySelectorAll('[data-close-history]').forEach((button) =&gt; button.addEventListener('click', () =&gt; { historyDialog.hidden = true; }));

      root.querySelectorAll('.rt-home-rail').forEach((rail) =&gt; rail.addEventListener('wheel', (event) =&gt; {
        if (rail.scrollWidth &lt;= rail.clientWidth || Math.abs(event.deltaY) &lt;= Math.abs(event.deltaX)) return;
        const previous = rail.scrollLeft;
        rail.scrollLeft += event.deltaY;
        if (rail.scrollLeft !== previous) event.preventDefault();
      }, { passive: false }));
      const homePlatforms = root.querySelector('[data-home-platforms]');
      root.querySelectorAll('[data-home-pin]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        const platform = button.closest('.rt-home-platform');
        const pinned = platform.classList.toggle('is-pinned');
        button.setAttribute('aria-pressed', String(pinned));
        button.setAttribute('aria-label', `${pinned ? '取消置顶' : '置顶'}${platform.dataset.platformName}`);
        if (pinned) homePlatforms.prepend(platform);
        else [...homePlatforms.children].sort((left, right) =&gt; {
          if (left.classList.contains('is-pinned') !== right.classList.contains('is-pinned')) return left.classList.contains('is-pinned') ? -1 : 1;
          return left.dataset.platformName.localeCompare(right.dataset.platformName, 'zh-CN');
        }).forEach((item) =&gt; homePlatforms.append(item));
      }));

      root.querySelectorAll('.rt-chip').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        const group = button.closest('[data-chip-group]') || root;
        group.querySelectorAll('.rt-chip').forEach((peer) =&gt; peer.classList.toggle('is-active', peer === button));
      }));

      const applyRequestedView = (requestedView) =&gt; {
        if (authPageNames.has(requestedView)) {
          showAuthPage(requestedView);
        } else if (requestedView.startsWith('game-')) {
          setMode('user');
          openGame(requestedView.slice(5));
        } else if (requestedView === 'admin-bios-dats') {
          setMode('admin');
          showPage('admin-bios');
          root.querySelector('[data-bios-view=&quot;dats&quot;]').click();
        } else if (requestedView.startsWith('admin-') &amp;&amp; pageNames[requestedView]) {
          setMode('admin');
          showPage(requestedView);
        } else if (pageNames[requestedView]) {
          if (['home', 'library', 'saves', 'favorites', 'recent', 'account', 'detail'].includes(requestedView)) setMode('user');
          showPage(requestedView);
        }
      };

      applyRequestedView(window.location.hash.slice(1));
      window.addEventListener('message', (event) =&gt; {
        if (event.data?.type === 'retrom-view') applyRequestedView(event.data.view || '');
      });
      window.parent.postMessage({ type: 'retrom-ready' }, '*');

      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script&gt;globalThis.lucide?.createIcons({attrs:{width:16,height:16}});&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
</body>
</html>
