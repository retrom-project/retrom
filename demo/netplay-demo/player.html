<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retrom netplay emulator instance</title>
  <link rel="icon" href="data:,">
  <style>
    html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070b; }
    body { position: relative; }
    [data-player-status] {
      position: absolute; inset: 12px auto auto 12px; z-index: 2; padding: 6px 9px;
      border: 1px solid #ffffff24; border-radius: 999px; color: #d5dbdf;
      background: #05070bcc; font: 600 11px/1.2 ui-monospace, monospace;
    }
    html[data-phase="started"] [data-player-status] { opacity: 0; pointer-events: none; }
    html[data-netplay-replay="true"] #game canvas { visibility: hidden !important; }
    .netplay-replay-frame {
      position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: contain;
      background: #05070b; pointer-events: none;
    }
    .ejs_parent { min-height: 100% !important; }
  </style>
</head>
<body>
  <span data-player-status>configuring</span>
  <div id="game"></div>
  <script type="module" src="./src/player-bootstrap.js"></script>
</body>
</html>
